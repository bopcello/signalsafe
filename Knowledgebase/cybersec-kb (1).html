  id:3, title:"Cryptography & Reverse Engineering", level:"Core",
  desc:"The mathematics of secrecy and integrity, and the craft of reading a compiled program's mind. These two disciplines are grouped together because CTF-style challenges in both reward the same underlying skill: patiently reconstructing a hidden structure from limited, indirect observations.",
  subs:[
{t:"Cryptography Foundations", h:`
<h3>3.1 Cryptography Foundations</h3>
<p class="lede">Cryptography provides four distinct guarantees, and most real-world confusion in this subject comes from not knowing which guarantee a given primitive actually provides.</p>
<ul>
<li><b>Confidentiality:</b> only the intended recipient can read the data (encryption).</li>
<li><b>Integrity:</b> the data has not been altered (hashing, MACs).</li>
<li><b>Authentication:</b> you know who you're really talking to (digital signatures, certificates).</li>
<li><b>Non-repudiation:</b> the sender cannot later deny having sent something (digital signatures).</li>
</ul>

<h4>Symmetric vs asymmetric encryption</h4>
<p><b>Symmetric encryption</b> uses the exact same key to encrypt and decrypt (AES, ChaCha20). It's fast and efficient, but requires both parties to already share a secret key through some other secure channel — the classic key-distribution problem. <b>Asymmetric (public-key) encryption</b> uses a mathematically linked key pair: a <b>public key</b> that can be freely shared and a <b>private key</b> that must never leave its owner. Data encrypted with the public key can only be decrypted with the matching private key (RSA, ECC/Elliptic Curve Cryptography). It solves the key-distribution problem but is computationally far more expensive — which is why real-world protocols like TLS use asymmetric crypto only briefly, to securely agree on a symmetric key, and then switch to fast symmetric encryption for the bulk of the actual data (a "hybrid" scheme).</p>

<h4>Hashing</h4>
<p>A <b>cryptographic hash function</b> takes input of any length and produces a fixed-length digest, with three required properties: <b>pre-image resistance</b> (given a hash, you can't find an input that produces it), <b>second pre-image resistance</b> (given an input, you can't find a <i>different</i> input with the same hash), and <b>collision resistance</b> (you can't find <i>any</i> two different inputs that hash to the same value). Hashing is one-way by design — it provides integrity, not secrecy, and should never be described as "encryption." MD5 and SHA-1 are both now broken for collision resistance (practical collisions have been demonstrated) and should never be used in new systems, though they still appear constantly in legacy systems and CTF challenges for exactly that reason. SHA-256 and the SHA-3 family are the current standard choices.</p>

<h4>MACs and HMAC</h4>
<p>A plain hash alone doesn't prove a message is <i>authentic</i> — anyone can compute <code>SHA256(message)</code>. A <b>MAC (Message Authentication Code)</b> mixes in a secret key so that only someone who knows the key can produce a valid tag for a given message. <b>HMAC (Hash-based MAC)</b> is the standard construction, built carefully on top of an underlying hash function in a specific nested way designed to resist the length-extension weakness that a naive <code>hash(key + message)</code> construction suffers from (see 3.3).</p>

<h4>Block cipher modes — why they matter</h4>
<p>A block cipher like AES encrypts fixed-size blocks (16 bytes for AES) one at a time — but real messages aren't exactly one block long, so a <b>mode of operation</b> defines how to chain many block encryptions together.</p>
<ul>
<li><b>ECB (Electronic Codebook):</b> encrypts each block completely independently with the same key — meaning identical plaintext blocks always produce identical ciphertext blocks. This leaks structural patterns in the plaintext directly into the ciphertext (the infamous "ECB penguin" image, where an image encrypted in ECB mode still visibly shows the original outline). Never use ECB for anything beyond a single block.</li>
<li><b>CBC (Cipher Block Chaining):</b> XORs each plaintext block with the <i>previous ciphertext block</i> before encrypting, so identical plaintext blocks produce different ciphertext — but it's vulnerable to padding oracle attacks if the receiving application leaks whether decrypted padding was valid (3.3).</li>
<li><b>CTR/GCM:</b> turn a block cipher into a stream cipher by encrypting a counter value and XORing the result with the plaintext — GCM additionally provides built-in integrity/authentication (an "AEAD," Authenticated Encryption with Associated Data, cipher), making it the modern default recommendation. Its critical rule: a (key, nonce) pair must <i>never</i> be reused, or the keystream can be recovered (3.3).</li>
</ul>
<div class="box"><p><b>Spot-the-mode trick:</b> if you're given a ciphertext image and it still visually resembles the original, that's the textbook signature of ECB mode — the challenge almost always wants you to name that specific weakness.</p></div>
<h4>Key exchange: how two strangers agree on a secret over a public channel</h4>
<p>Symmetric encryption is fast but needs both parties to already share a key — the hard problem is getting that key to both sides safely. <b>Diffie-Hellman</b> solves this: both parties pick a secret number, exchange a public value derived from it, and each combines their own secret with the other's public value to reach the same shared secret, which an eavesdropper who only sees the public values cannot feasibly reconstruct (the discrete-logarithm problem). This is why TLS can establish a fresh symmetric key for every connection without ever transmitting the key itself — the handshake performs a Diffie-Hellman (or elliptic-curve variant, ECDHE) exchange, then switches to fast symmetric encryption (typically AES-GCM or ChaCha20-Poly1305) for the actual data.</p>
<h4>Digital signatures vs encryption — a frequent confusion</h4>
<p>Public-key encryption (encrypt with the recipient's public key, decrypt with their private key) provides confidentiality. A <b>digital signature</b> does the reverse role conceptually: the signer uses their private key to produce a signature over a message hash, and anyone can verify it with the signer's public key — this provides authenticity and integrity ("this message came from this key and wasn't altered"), not secrecy. TLS certificates are signatures, not encryption: a certificate authority signs a statement that a public key belongs to a given domain.</p>
<h4>Why hashing and encryption are not interchangeable</h4>
<p>Hashing is one-way by design — there is no decrypt operation, which is precisely why it's correct for passwords (you only ever need to verify, never recover the original) and wrong for anything you need to get back. Encryption is reversible by design given the key. Using a hash where you need encryption (or vice versa) is a design-level bug, not an implementation detail.</p>
`},

{t:"Classic Ciphers & CTF Encodings", h:`
<h3>3.2 Classic Ciphers & CTF-Style Encodings</h3>
<p class="lede">CTF crypto challenges often start with lightweight historical ciphers and non-cryptographic encodings before moving into modern cryptanalysis — and it's crucial to know the difference between the two categories, since one has no key to find at all.</p>

<h4>Encoding is not encryption</h4>
<p>An <b>encoding</b> (Base64, hex, URL-encoding) is a reversible, publicly known transformation with no secret key — its purpose is compatibility (representing binary data as safe text), not secrecy. Anyone can decode it instantly with no cryptanalysis required. Recognizing an encoding by sight and reversing it is usually step one, not the actual challenge.</p>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Looks like…</th><th scope="col">Likely is…</th></tr>
<tr><td>Mixed case letters + digits, often ending in <code>=</code> padding</td><td>Base64</td></tr>
<tr><td>Only characters 0–9 and a–f</td><td>Hexadecimal</td></tr>
<tr><td>Only uppercase A–Z and digits 2–7</td><td>Base32</td></tr>
<tr><td>%-prefixed hex pairs (<code>%20</code>, <code>%3D</code>)</td><td>URL encoding</td></tr>
<tr><td>Readable but every letter seems shifted</td><td>Caesar/ROT cipher</td></tr>
</table></div>

<h4>Classical ciphers</h4>
<p>A <b>Caesar cipher</b> (or its common special case, <b>ROT13</b>) shifts every letter by a fixed amount through the alphabet. With only 25 possible shifts, it's always brute-forceable instantly — try all 25 and read off which one produces readable text.</p>
<p>A <b>Vigenère cipher</b> extends this idea with a repeating keyword, shifting each letter of the plaintext by the corresponding letter of the key, cycling the key as needed. Because the key repeats, the cipher's strength depends entirely on key length — it's broken via <b>Kasiski examination</b> (finding repeated sequences in the ciphertext, whose spacing reveals likely key lengths as common factors) followed by <b>frequency analysis</b> on each of the resulting key-length-separated letter groups independently (since each group was shifted by the same single key letter, it should show the same letter-frequency fingerprint as plain English, just rotated).</p>
<p>A <b>XOR cipher</b> with a repeating key is mathematically the same structural weakness as Vigenère (XOR-ing is just a different "shift" operation) and is broken the same way — guess/derive the key length, then solve each byte position independently using frequency analysis. A <b>single-byte XOR</b> is trivially brute-forceable outright: there are only 256 possible key bytes, so you try every one and score each result by how closely it resembles English letter-frequency statistics, picking the best-scoring candidate.</p>

<h4>Essential tools for this category</h4>
<ul>
<li><b>CyberChef</b> — a browser-based "cyber Swiss army knife" that lets you chain decode/encode/crypto operations visually (e.g. Base64 decode → XOR → ASCII) without writing any code; usually the fastest first move on an unidentified blob of data.</li>
<li><b>dCode.fr</b> — an extensive library of cipher identifiers and solvers, useful for naming an unfamiliar classical cipher.</li>
<li>Python's <code>base64</code> and <code>binascii</code> modules for scripting any of the above when CyberChef isn't flexible enough.</li>
</ul>
<h4>Frequency analysis against a substitution cipher</h4>
<p>English letter frequency is stable: E, T, A, O, I, N are the most common letters, and "the," "and," "ing" are the most common sequences. Against a simple (monoalphabetic) substitution cipher, counting letter frequency in the ciphertext and mapping the most frequent ciphertext letter to E, the second-most to T, and so on gives a strong starting guess that you then refine by looking for short words (a lone ciphertext letter is almost certainly "I" or "A"). Tools like <code>quipqiup</code> automate this, but doing it by hand once builds the intuition for spotting it instantly in a CTF.</p>
<h4>Recognizing an encoding at a glance</h4>
<table><tr><th scope="col">Pattern</th><th scope="col">Likely encoding</th></tr>
<tr><td>Only <code>0-9a-f</code>, even length</td><td>Hex</td></tr>
<tr><td>Letters, digits, <code>+/=</code>, length divisible by 4</td><td>Base64</td></tr>
<tr><td>Only <code>A-Z2-7=</code></td><td>Base32</td></tr>
<tr><td>Words resembling real English but slightly wrong, consistent letter shift</td><td>Caesar / ROT-N — try all 25 shifts</td></tr>
<tr><td>Groups of 5 letters, uppercase, no spaces matching dictionary words</td><td>Possibly Vigenère — needs key-length analysis (Kasiski examination) first</td></tr></table>
<h4>Vigenère: why key length matters more than the key itself</h4>
<p>A Vigenère cipher applies a repeating-key Caesar shift, so once you know the key <i>length</i>, the ciphertext splits into that many independent Caesar-shifted streams, each solvable by frequency analysis alone. Kasiski examination finds repeated ciphertext sequences and measures the distance between repeats — the key length is very likely a common factor of those distances. This reduces a seemingly hard polyalphabetic cipher back to the easy, single-letter case.</p>
`},

{t:"Applied Cryptographic Attacks", h:`
<h3>3.3 Applied Cryptographic Attacks</h3>
<p class="lede">Beyond classical ciphers, modern cryptanalysis challenges exploit specific, well-documented implementation mistakes around otherwise-strong algorithms — the math itself (AES, RSA) is sound; the surrounding usage is what breaks.</p>

<h4>RSA weaknesses</h4>
<p>RSA security rests on the difficulty of factoring the product of two large primes, <code>n = p × q</code>. If an implementation chooses primes that are too small, too close together, or accidentally shared between two different key pairs (a surprisingly common real-world mistake, since poor-entropy key generation on embedded devices has caused exactly this in the wild), <code>n</code> becomes factorable with public tools (<code>factordb.com</code>, the <code>yafu</code> factoring tool, or Fermat's factorization method for close primes) — once <code>p</code> and <code>q</code> are recovered, the private key follows directly. A separate weakness: if the public exponent <code>e</code> is small (commonly <code>e=3</code>) and the message is <i>not</i> padded before encryption, and the message is short enough that <code>m^e</code> never "wraps around" modulo <code>n</code>, an attacker can recover the plaintext with a simple integer cube root — the "Low Public Exponent" attack.</p>

<h4>Padding oracle attacks</h4>
<p>CBC mode requires the plaintext to be padded to a multiple of the block size before encryption, and the receiver must validate that padding after decrypting. If an application leaks — even indirectly, e.g. through a different error message or a measurable timing difference — whether decrypted padding was valid or invalid, an attacker can abuse that single bit of information to decrypt an entire ciphertext byte by byte, without ever knowing the encryption key, by systematically manipulating the previous ciphertext block and observing the oracle's padding-valid/invalid responses. This is a purely implementation-level flaw in how errors are surfaced, not a weakness in AES-CBC itself.</p>

<h4>Hash length-extension attacks</h4>
<p>Some hash constructions (including plain MD5 and SHA-256, due to their underlying Merkle–Damgård structure) let an attacker compute <code>H(secret + message + extension)</code> given only <code>H(secret + message)</code> and the length of <code>secret</code> — without ever knowing <code>secret</code> itself. This breaks any naive authentication scheme built as <code>MAC = H(secret + message)</code>, because an attacker can forge a valid MAC for a message with attacker-chosen data appended. This is exactly why HMAC exists — its specific nested construction is deliberately designed to be immune to this attack. The tool <code>hashpump</code> automates exploiting a vulnerable naive construction in a CTF setting.</p>

<h4>Nonce/IV reuse</h4>
<p>Stream ciphers (and block-cipher modes that behave like one, such as CTR or GCM) generate a pseudorandom keystream from a key and a <b>nonce</b> (a number used once), then XOR it with the plaintext. If the same (key, nonce) pair is ever reused for two different messages, the identical keystream is produced both times — and since <code>C1 XOR C2 = P1 XOR P2</code> (the keystream cancels out when you XOR the two ciphertexts together), an attacker who can guess or partially know one plaintext can recover the other directly, with zero knowledge of the key. This is why modern AEAD modes like GCM are explicit and strict about never reusing a nonce under the same key.</p>

<h4>Password/hash cracking</h4>
<p>Once you have a password hash (recovered from a database dump, a memory image, or a captured authentication handshake), cracking it means trying candidate passwords and comparing their hash to the target — this is <i>guessing</i>, not breaking the hash function's math. Speed depends heavily on the algorithm: fast general-purpose hashes (MD5, SHA-1, raw SHA-256) can be tried at billions of guesses per second on a GPU, while password-specific hashing algorithms designed to be deliberately slow (bcrypt, scrypt, Argon2) resist this by design.</p>
<pre><code>hashcat -m 0 -a 0 hashes.txt rockyou.txt     # -m 0 selects MD5, -a 0 is a straight dictionary attack
john --wordlist=rockyou.txt hashes.txt       # John the Ripper, auto-detects many hash formats</code></pre>
<p><code>rockyou.txt</code> (a 14-million-entry wordlist leaked from a real 2009 breach) is the de facto standard dictionary for both tools in CTF and real-world password-auditing contexts alike.</p>
<h4>Padding oracle attacks</h4>
<p>CBC mode with PKCS#7 padding pads plaintext to a block boundary and the decryptor checks the padding is well-formed. If the server leaks <i>whether</i> padding was valid (a distinct error message, or even a timing difference) without revealing the plaintext itself, an attacker can decrypt the entire ciphertext byte by byte, without knowing the key, by manipulating the previous ciphertext block and observing the oracle's yes/no answer for each guess — this is the classic reason AEAD modes (GCM) that check integrity as part of decryption are preferred over plain CBC.</p>
<h4>Hash length extension</h4>
<p>Older hash constructions (MD5, SHA-1, SHA-256 used naively) process input in blocks and the final hash is just the internal state after the last block — which means, given <code>H(secret || message)</code> and the length of <code>secret</code>, an attacker can compute <code>H(secret || message || padding || attacker_data)</code> <i>without knowing the secret</i>, by resuming the hash computation from the known output state. This breaks naive "authenticate with <code>hash(secret+message)</code>" schemes; HMAC exists specifically to close this gap by hashing the key in twice with a different construction.</p>
<h4>Weak randomness and key-reuse attacks</h4>
<p>RSA is broken immediately if two public keys share one prime factor — computing the GCD of both moduli recovers both private keys instantly, which has happened in the real world from poor-entropy key generation on embedded devices. XOR-based one-time-pad style encryption is only secure if the key is truly random and never reused; reusing a keystream across two messages lets an attacker XOR the ciphertexts together, cancelling the key and leaving the XOR of the two plaintexts, which is usually enough to recover both with crib-dragging (guessing likely words and checking if they produce readable text in the other message).</p>
`},

{t:"Reverse Engineering Fundamentals", h:`
<h3>3.4 Reverse Engineering Fundamentals</h3>
<p class="lede">Reverse engineering (RE) is the discipline of understanding what a compiled program does without having its source code — a skill needed equally for CTF "crackme" challenges, legitimate malware analysis, and interoperability/security research.</p>

<h4>From source to binary — what gets lost</h4>
<p>Compilation translates human-readable source code through several stages down to raw machine instructions, discarding most human-friendly context along the way: variable names, comments, and high-level structure (loops, if/else) are gone by the time you have a binary — all that remains is addresses, raw instructions, and (if not stripped) function/symbol names. Reversing is the process of reconstructing an approximation of that lost structure by reading machine code directly.</p>

<h4>Static vs dynamic analysis</h4>
<p><b>Static analysis</b> examines the binary without ever executing it: disassembling machine code back into assembly, or further decompiling assembly into pseudo-C for easier reading. It's safe (nothing runs) but can be defeated by obfuscation, and can't observe runtime-only behavior (e.g. a value only computed at execution time). <b>Dynamic analysis</b> runs the binary — ideally in an isolated environment — and observes its actual behavior directly via a debugger, which can step through execution instruction-by-instruction, set breakpoints, and inspect memory/register values live. Real reversing work constantly moves back and forth between both.</p>

<h4>Core toolchain</h4>
<ul>
<li><b>Ghidra</b> — free, NSA-developed disassembler/decompiler with a strong pseudo-C decompiler view; the current default choice for most RE work given it's free and actively maintained.</li>
<li><b>IDA (Interactive DisAssembler)</b> — the long-standing industry-standard disassembler; IDA Free is limited but adequate for many CTF binaries.</li>
<li><b>gdb (GNU Debugger)</b> with the <b>pwndbg</b> or <b>GEF</b> plugin — the standard Linux dynamic-analysis setup, since vanilla gdb's default interface is notoriously unfriendly; these plugins add memory/register visualization, exploit-development helpers, and much more readable output.</li>
<li><b>x64dbg</b> — the equivalent dynamic debugger of choice on Windows.</li>
</ul>

<h4>First moves on any unknown binary</h4>
<pre><code>file challenge              # identifies the file type, architecture, and whether it's stripped/dynamically linked
strings challenge | grep -i flag   # pulls all printable text — flags are sometimes embedded directly
checksec --file=challenge   # reports which binary protections are enabled (see 3.5)</code></pre>
<p>Don't underestimate <code>strings</code> — a surprising number of beginner-tier RE challenges hide the entire flag as plain embedded text, discoverable in seconds without opening a disassembler at all.</p>

<h4>Common obstacles</h4>
<ul>
<li><b>Stripped binaries</b> have had their symbol table (function/variable names) removed, leaving only raw addresses — Ghidra/IDA can still disassemble them, just without the helpful names.</li>
<li><b>Packing</b> compresses/encrypts the real executable code inside a wrapper that unpacks it at runtime (UPX is the common CTF packer — <code>upx -d challenge</code> usually unpacks it trivially, since UPX is not designed to resist analysis, only to shrink file size).</li>
<li><b>Anti-debugging checks</b> have the program detect that it's running under a debugger (via OS-specific checks) and alter its behavior to resist analysis — commonly bypassed by patching out the check or using debugger plugins designed to hide its presence.</li>
</ul>
<h4>Static vs dynamic analysis, and why you need both</h4>
<p><b>Static analysis</b> (disassembling or decompiling without running the program — Ghidra, IDA) is safe and lets you see every code path, but compilers and obfuscation can make the logic hard to follow on paper. <b>Dynamic analysis</b> (running it under a debugger — gdb, x64dbg) lets you watch actual register and memory values at each step, which is often far faster for understanding one specific path, but only shows you the path you actually trigger. The efficient workflow alternates: skim statically to find the interesting function, then step through it dynamically to confirm your reading.</p>
<h4>Calling conventions you'll need to read a disassembly</h4>
<p>On x86-64 Linux (System V ABI), the first six integer/pointer arguments to a function are passed in registers <code>rdi, rsi, rdx, rcx, r8, r9</code>, in that order, with the return value in <code>rax</code>. Recognizing <code>mov edi, 5</code> immediately before a <code>call</code> tells you the function's first argument is 5 — this is how you read what a function does without a decompiler at all, just from the register setup before each call.</p>
<h4>Identifying stripped-symbol binaries</h4>
<p>A stripped binary has no function names, which initially looks intimidating. Start from strings (<code>strings binary | less</code>) and cross-reference where each interesting string is used (Ghidra's "References" feature) — a string like "Invalid license key" points you straight at the validation function regardless of what it's named. Identifying <code>main</code> is usually trivial even stripped: it's the function called from the CRT startup code (<code>__libc_start_main</code>) near the binary's entry point.</p>
`},

{t:"Binary Exploitation (Pwn) Fundamentals", h:`
<h3>3.5 Binary Exploitation ("Pwn") Fundamentals</h3>
<p class="lede">Binary/memory-corruption exploitation ("pwn") is widely considered the steepest learning curve in CTF, because it requires understanding not just a bug but the low-level memory layout of a running process well enough to hijack it. Treat buffer overflows as your entry point and everything else as a progression from there.</p>

<h4>The stack, and why it's exploitable</h4>
<p>When a function is called, the program allocates a region on the <b>call stack</b> holding its local variables and, critically, the <b>return address</b> — the location to jump back to once the function finishes. If a function copies user-controlled data into a fixed-size local buffer <i>without</i> checking that the data actually fits (the classic unsafe pattern: C's <code>gets()</code>, or <code>strcpy</code> without a length bound), an attacker can supply input longer than the buffer and overwrite adjacent stack memory — including, if the input is long enough, the saved return address itself. On function return, the CPU jumps to whatever address the attacker overwrote it with, hijacking the program's execution flow entirely.</p>
<pre><code>// Vulnerable function
void vuln() {
    char buf[64];
    gets(buf);   // no bounds checking — classic stack buffer overflow
}</code></pre>

<h4>Format string bugs</h4>
<p>C's <code>printf</code> family interprets a format string containing specifiers like <code>%s</code>, <code>%x</code>, and <code>%n</code> to decide how to read its following arguments. If user input is passed <i>directly</i> as the format string (<code>printf(user_input)</code> instead of the correct <code>printf("%s", user_input)</code>), the attacker controls which format specifiers get used — <code>%x</code> repeated several times walks the stack and leaks memory contents (useful for defeating ASLR, see below), while <code>%n</code> actually <i>writes</i> the number of bytes printed so far to a memory address taken from the stack, turning the bug into an arbitrary memory write.</p>

<h4>Modern binary protections — and why they exist</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Protection</th><th scope="col">What it does</th><th scope="col">What it forces the attacker to do</th></tr>
<tr><td><b>Stack canary</b></td><td>places a random value before the return address; checked before the function returns</td><td>leak or guess the canary, or find a bug that doesn't need to overwrite through it</td></tr>
<tr><td><b>NX / DEP (No-eXecute / Data Execution Prevention)</b></td><td>marks stack/heap memory as non-executable</td><td>can't jump to injected shellcode directly — must reuse existing executable code instead (ROP, see below)</td></tr>
<tr><td><b>ASLR (Address Space Layout Randomization)</b></td><td>randomizes the base addresses of the stack, heap, and libraries on each run</td><td>needs an information leak to learn an actual address before any hardcoded-address exploit can work</td></tr>
<tr><td><b>PIE (Position-Independent Executable)</b></td><td>randomizes the base address of the main executable itself, not just libraries</td><td>same as ASLR, but now the binary's own code addresses are unknown too</td></tr>
</table></div>
<p><code>checksec</code> reports which of these are enabled on a given binary — reading its output is always the first step before planning an exploit, since it tells you exactly which obstacles you need to defeat.</p>

<h4>Return-Oriented Programming (ROP)</h4>
<p>With NX enabled, you can't simply inject and jump to new shellcode on the stack. <b>ROP</b> works around this by chaining together short, pre-existing instruction sequences already present in the binary or its linked libraries — each ending in a <code>ret</code> instruction, called a <b>gadget</b> — and overwriting the stack with a sequence of addresses pointing to these gadgets in the order you want them executed. Each gadget does a small thing (pop a value into a register, for instance) and then returns, which — because you've placed the <i>next</i> gadget's address right after it on the stack — immediately jumps into the next one, effectively building a program entirely out of borrowed fragments of existing code with no new executable memory required at all.</p>

<h4>pwntools</h4>
<p>The standard Python library for scripting exploit interaction with a vulnerable local binary or remote service — handling connections, packing/unpacking addresses, and much of the repetitive plumbing of exploit development:</p>
<pre><code>from pwn import *
p = remote('target.host', 1337)
payload = b'A' * 72 + p64(0xdeadbeef)   # padding to the return address, then a target address (little-endian pack)
p.sendline(payload)
p.interactive()</code></pre>
<div class="box warn"><p>Pwn is the one category where "read the theory, then do ten small guided exercises" massively outperforms "read the theory, then attempt a real binary" — platforms like <code>pwn.college</code>, protostar, and picoCTF's binary-exploitation track are built around exactly this incremental progression for good reason.</p></div>
<h4>The stack, concretely</h4>
<p>A function's stack frame holds local variables, the saved base pointer, and the return address — the instruction pointer jumps to after the function returns. On x86-64, the stack grows <i>downward</i> (toward lower addresses) while arrays typically fill <i>upward</i>, so writing past the end of a local buffer overwrites what sits above it in memory: other locals, then the saved base pointer, then the return address. A classic stack buffer overflow exploits exactly this: write past a fixed-size buffer with attacker-controlled bytes until you've overwritten the return address with an address of your choosing, and when the function returns, execution jumps there instead.</p>
<h4>Finding the overflow offset</h4>
<pre><code># pwntools cyclic pattern finds exactly how many bytes reach the return address
from pwn import *
payload = cyclic(200)                  # unique 4/8-byte pattern, not just "A"*200
# after it crashes, read the value in the instruction pointer / saved address
offset = cyclic_find(0x6161616161616162)   # exact byte count to the overwrite</code></pre>
<h4>Modern mitigations and what they actually stop</h4>
<table><tr><th scope="col">Mitigation</th><th scope="col">What it stops</th><th scope="col">Typical bypass direction</th></tr>
<tr><td>NX / DEP</td><td>Executing shellcode placed on the stack</td><td>Return-oriented programming (ROP) — reuse existing executable code instead</td></tr>
<tr><td>ASLR</td><td>Hard-coding addresses (they move per run)</td><td>An information leak that reveals one real address at runtime</td></tr>
<tr><td>Stack canaries</td><td>Silently overwriting the return address</td><td>Leak the canary first, or overwrite a function pointer that executes before the check</td></tr>
<tr><td>RELRO</td><td>Overwriting the GOT (function pointer table) to hijack control flow</td><td>Format-string or other write primitive against data RELRO leaves writable</td></tr></table>
<p>A real pwn challenge almost always chains these: leak an address (defeats ASLR) using one bug, then use a second write primitive to build a ROP chain (defeats NX) that calls a library function with attacker-chosen arguments.</p>
`},
  ]

{t:"Linux Privilege Escalation", h:`
<h3>4.1 Linux Security & Privilege Escalation</h3>
<p class="lede">Gaining an initial low-privilege foothold on a Linux machine (via a web shell, SSH with weak creds, or an exploited service) is rarely the end goal — "privilege escalation" (privesc) is the process of turning that into root, and it's almost always a hunt for a misconfiguration rather than a sophisticated exploit.</p>

<h4>The Linux permission model, briefly</h4>
<p>Every file has an owner, a group, and permission bits for owner/group/other (read, write, execute). Root (UID 0) bypasses nearly all permission checks. The entire privesc discipline is about finding somewhere this model has been configured more permissively than intended.</p>

<h4>Enumeration — always first</h4>
<pre><code>id                          # your current user and group memberships
sudo -l                     # what can you run as another user via sudo, without a password?
uname -a                    # kernel version — relevant for known kernel-exploit CVEs
cat /etc/crontab; crontab -l    # scheduled jobs — do any run as root and touch a file you control?
find / -perm -4000 2>/dev/null  # every SUID binary on the system</code></pre>

<h4>SUID binary abuse</h4>
<p>A <b>SUID (Set User ID)</b> bit on an executable makes it run with the permissions of its <i>owner</i>, not the user who launched it — so a SUID binary owned by root runs as root no matter who executes it. This is legitimate and necessary for some system tools (e.g. <code>passwd</code> needs root to edit <code>/etc/shadow</code>), but a SUID binary that can be made to execute arbitrary commands (via a shell escape, a configuration file it reads, or a scripting feature) hands you a root shell. <b>GTFOBins</b> is the standard reference cataloging exactly which common Unix binaries have a known SUID/sudo escalation trick and the precise command to trigger it — checking every SUID binary you find against GTFOBins is close to a mechanical first step.</p>

<h4>Weak sudo configuration</h4>
<p><code>sudo -l</code> lists which commands your current user is allowed to run as another user (often root) via sudo, sometimes without even needing a password. If that list includes a program capable of reading/writing arbitrary files, spawning a shell, or executing other commands — even something that looks unrelated to security, like a text editor or a package manager — it's very likely abusable into a full root shell; GTFOBins covers sudo-context escalations as well as SUID ones.</p>

<h4>Writable files owned/used by root</h4>
<p>If a cron job, systemd service, or startup script runs as root and references a file or script that your current user can write to, you can simply replace its contents with something of your choosing and wait for it to execute — a very common real-world misconfiguration, not just a CTF trick.</p>

<h4>Kernel exploits</h4>
<p>If the kernel itself has a known local-privilege-escalation CVE and the system is unpatched, a public exploit can sometimes be compiled and run directly for a root shell. This is usually treated as a last resort in both CTFs and real engagements since it's the noisiest and most likely to crash the target.</p>

<h4>Automated enumeration scripts</h4>
<p><code>linpeas.sh</code> and <code>LinEnum.sh</code> run a large battery of these checks automatically and color-code likely leads — extremely useful for speed, but reading and understanding <i>why</i> each finding matters (rather than just running the script and guessing) is what actually builds the skill.</p>
<h4>SUID abuse, expanded</h4>
<p>A SUID binary runs with its <i>owner's</i> privileges, not the caller's — if root owns a SUID binary that lets you read, write, or execute arbitrary commands (even indirectly, through an unsafe feature of a legitimate tool), you inherit root for that action. <a href="https://gtfobins.github.io">GTFOBins</a> catalogues exactly which common binaries (find, vim, python, less, awk...) have a documented SUID escalation path — checking your <code>find -perm -4000</code> output against that list is standard procedure, not guesswork.</p>
<pre><code># classic example: if /usr/bin/find is SUID-root
find / -name nonexistent -exec /bin/sh -p \; -quit</code></pre>
<h4>Environment and PATH abuse</h4>
<p>If a SUID or root-run script calls a command by name without a full path (<code>system("ls")</code> instead of <code>system("/bin/ls")</code>) and an attacker controls <code>PATH</code>, placing a malicious <code>ls</code> earlier in the search path gets it executed with the elevated privilege instead. Writable cron scripts or systemd unit files that root executes on a schedule are the same idea applied to persistence: if you can write the file, you get root the next time it runs, even without SUID at all.</p>
<h4>Capabilities — the modern alternative to SUID</h4>
<p>Linux capabilities split root's power into named pieces (<code>cap_net_raw</code> for raw sockets, <code>cap_setuid</code> for changing UID) so a binary can get exactly the privilege it needs instead of full root. Check with <code>getcap -r / 2>/dev/null</code>; a binary with <code>cap_setuid+ep</code> is as dangerous as SUID-root and is frequently missed because people only check for SUID.</p>
`},

{t:"Windows Privilege Escalation & Active Directory", h:`
<h3>4.2 Windows Security, Privilege Escalation & Active Directory</h3>
<p class="lede">Windows privesc follows the same underlying philosophy as Linux — enumerate, find a misconfiguration, abuse it — but the specific mechanisms are entirely different because the Windows permission and service model is structured differently.</p>

<h4>Enumeration</h4>
<pre><code>whoami /priv                # your current token's special privileges
systeminfo                  # OS version/patch level — relevant for known local-privesc CVEs
wmic service list brief     # installed services and their configuration
schtasks /query /fo LIST /v # scheduled tasks</code></pre>

<h4>Unquoted service paths</h4>
<p>If a Windows service's executable path contains a space and isn't wrapped in quotes — e.g. <code>C:\\Program Files\\My App\\service.exe</code> written unquoted — Windows will try each space-separated segment in turn as a potential executable name when starting the service: it first tries <code>C:\\Program.exe</code>, then <code>C:\\Program Files\\My.exe</code>, and so on, before finally trying the real path. If an attacker has write access to any earlier directory in that chain and can plant a malicious executable with the matching name, it runs instead — with whatever privilege the service itself runs as, frequently SYSTEM.</p>

<h4>Weak service/file permissions</h4>
<p>If the binary a service executes (or a DLL/config file it loads) is writable by a low-privileged user, replacing it with attacker-controlled content causes the next service restart to execute that content with the service's privilege level.</p>

<h4>Token and privilege abuse</h4>
<p>Windows access tokens carry specific privileges beyond simple read/write/execute. <code>SeImpersonatePrivilege</code> (commonly granted to service accounts) allows a process to impersonate the security context of another token it can obtain — this is the basis of the well-known "Potato" family of exploits (JuicyPotato, RoguePotato, PrintSpoofer), which trick a SYSTEM-level service into authenticating to an attacker-controlled listener, letting the attacker capture and impersonate that SYSTEM token.</p>

<h4>Automated enumeration tools</h4>
<p><code>winPEAS</code> (the Windows counterpart to linpeas), <code>PowerUp.ps1</code> (a PowerShell module focused specifically on common Windows privesc vectors), and <code>Seatbelt</code> (broad situational-awareness collection) all automate much of the above.</p>

<h4>Active Directory basics</h4>
<p><b>Active Directory (AD)</b> is Microsoft's directory service for centrally managing users, computers, and permissions across a Windows network — it underlies most corporate Windows environments and has its own rich attack surface that appears in advanced/international-level hackathon tracks:</p>
<ul>
<li><b>Kerberoasting:</b> any authenticated domain user can request a Kerberos service ticket for any service account; that ticket is encrypted with a hash derived from the service account's password, which can then be cracked offline exactly like a password hash (3.3) — meaning a single weak service-account password anywhere in the domain is crackable without ever triggering a lockout, since the cracking happens entirely offline.</li>
<li><b>AS-REP Roasting:</b> if an account has <b>Kerberos pre-authentication disabled</b>, an attacker can request its ticket without ever supplying a password, again yielding an offline-crackable hash.</li>
<li><b>BloodHound:</b> a tool that maps the entire web of AD permissions and group memberships as a graph, automatically surfacing non-obvious attack paths — e.g. "user X is a member of a group that has admin rights over a machine where user Y, a domain admin, is logged in" — chains of trust that would be nearly impossible to spot by reading raw permission listings manually.</li>
</ul>
<h4>Service misconfigurations</h4>
<p>If a Windows service runs as <code>NT AUTHORITY\SYSTEM</code> but its binary path or a DLL it loads is writable by your low-privilege user, replacing that file and restarting the service (or waiting for a reboot) executes your code as SYSTEM. <code>icacls</code> and tools like <code>winPEAS</code> or <code>PowerUp.ps1</code> automate finding writable service binaries, weak service permissions, and unquoted service paths (where a space in an unquoted path like <code>C:\Program Files\My App\service.exe</code> lets an attacker place <code>C:\Program.exe</code> to be executed instead).</p>
<h4>Active Directory, the core concepts</h4>
<p>AD organizes users, computers and permissions in a tree; a <b>Domain Controller</b> holds the database. A few structural facts drive most AD attacks: group memberships grant permissions transitively, so a seemingly low-privilege user who is a member of a group with write access to a privileged object inherits that access; <b>Kerberos</b> tickets, not passwords, authenticate most service access, which is what makes <b>Kerberoasting</b> possible — any authenticated user can request a service ticket for any service account and attempt to crack its encryption offline, because the ticket is encrypted with a hash derived from that account's password.</p>
<h4>Attack path thinking</h4>
<p>Modern AD assessment (BloodHound is the standard tool) models the domain as a graph: nodes are users, groups, computers; edges are relationships like "member of," "has admin rights on," "can reset password of." The question isn't "is this one account weak" but "is there any path, however indirect, from a low-privilege account to Domain Admin" — a chain of three unremarkable-looking permissions can add up to full compromise even when no single link looks dangerous alone.</p>
`},

{t:"Digital Forensics", h:`
<h3>4.3 Digital Forensics</h3>
<p class="lede">Forensics is reconstructive — given an artifact (a disk image, a memory dump, a single file, a log), the goal is to determine what happened, when, and by whom, often with no access to the live system at all.</p>

<h4>Disk and filesystem forensics</h4>
<p><b>Autopsy</b> (built on the <b>Sleuth Kit</b>) is the standard open-source platform for examining a disk image: browsing the filesystem as it existed, recovering deleted files (which often remain physically present on disk until their space is overwritten, even after the filesystem "forgets" about them), and building a timeline of file creation/modification/access events.</p>
<p><b>File carving</b> recovers files from raw, unstructured data — a disk image, unallocated space, or a blob with no filesystem metadata at all — purely by recognizing a file format's characteristic header/footer "magic bytes" (e.g. a JPEG always starts with <code>FF D8 FF</code>) and extracting everything between a recognized start and end marker. <code>binwalk</code> and <code>foremost</code> both automate this, and <code>binwalk</code> in particular is the standard first move for "there's a hidden file embedded inside this file" CTF challenges.</p>
<pre><code>binwalk -e suspicious.jpg     # scan for and extract any embedded files/filesystems</code></pre>

<h4>Memory forensics</h4>
<p>A RAM dump captures everything a system was doing at the instant of capture — running processes, open network connections, decrypted data that only ever existed in memory, and sometimes malware that never touched disk at all. <b>Volatility</b> is the standard framework for analyzing memory dumps:</p>
<pre><code>volatility -f mem.dmp imageinfo               # identify the OS/profile the dump matches
volatility -f mem.dmp --profile=Win10x64 pslist     # list running processes at capture time
volatility -f mem.dmp --profile=Win10x64 netscan   # list network connections at capture time</code></pre>
<p>Memory forensics is uniquely powerful for malware analysis precisely because some malware is designed to run "fileless" — existing only in memory specifically to evade disk-based antivirus scanning — making a memory dump the only place such a sample can be observed and captured at all.</p>

<h4>File metadata</h4>
<p>Many file formats carry embedded metadata beyond their visible content — <b>EXIF (Exchangeable Image File Format)</b> data in photos can include camera model, timestamp, and GPS coordinates; office documents can embed author names and edit history. <code>exiftool</code> extracts all of this in one command and is a near-automatic first step on any image/document forensics challenge.</p>

<h4>File-type confusion</h4>
<p>A file's actual type is determined by its content ("magic bytes" at the start of the file), not its extension — a file named <code>photo.jpg</code> can in fact be a renamed ZIP archive, and the OS/most tools will happily treat it according to its real content if asked correctly. The <code>file</code> command identifies true file type by inspecting magic bytes rather than trusting the extension; a hex editor lets you inspect those bytes directly when you need to confirm or investigate manually.</p>

<h4>Log forensics and timeline reconstruction</h4>
<p>Reconstructing "what happened and when" from authentication logs, web server access logs, or Windows Event Logs is a core blue-team/DFIR (Digital Forensics and Incident Response) skill: correlating timestamps across multiple log sources to build a single coherent timeline of an incident, distinguishing an attacker's actions from ordinary background noise, and identifying the initial point of entry.</p>
<h4>The order of volatility</h4>
<p>Evidence should be collected most-volatile-first, because each later step risks destroying what came before: CPU registers and cache (gone on power-off) → RAM (gone on power-off, this is why a live memory capture matters before you ever touch the power button) → network state and running processes → disk → archived logs and backups. Pulling the power cord on a suspected-compromised machine destroys RAM evidence forever — the correct first move, if memory capture is needed, is a live acquisition tool (<code>LiME</code> for Linux, or a hardware write-blocker approach for disk) before any shutdown.</p>
<h4>Disk images and the chain of custody</h4>
<p>Work from a verified copy, never the original: image the disk (<code>dd if=/dev/sdb of=evidence.img bs=4M</code>, or <code>dcfldd</code> for built-in hashing) and record a SHA-256 hash of both the source and the image immediately — if they match, your copy is provably identical, and you can prove nothing was altered during analysis by re-hashing at the end. This hash record is what makes forensic findings defensible rather than just plausible.</p>
<h4>Filesystem timestamps (MACB) and their limits</h4>
<p><b>M</b>odified, <b>A</b>ccessed, <b>C</b>hanged (metadata), <b>B</b>orn (creation) — four timestamps most filesystems track per file. Timestamps are trivially alterable by anyone with write access to the file (<code>touch -t</code>), so they're useful for building a working theory of a timeline but should never be the sole evidence for a conclusion; corroborate with log entries, which are harder (though not impossible) for an attacker to alter without separate evidence of tampering such as a gap in sequential log IDs.</p>
`},

{t:"Steganography & OSINT", h:`
<h3>4.4 Steganography & OSINT</h3>
<p class="lede">Two very different skills that both revolve around finding information that was never meant to be found through the obvious channel.</p>

<h4>Steganography</h4>
<p>Steganography (from Greek for "covered writing") hides data <i>within</i> other, innocuous-looking data, rather than encrypting it — the goal is concealment of the message's very existence, not just its content. Common CTF techniques:</p>
<ul>
<li><b>LSB (Least Significant Bit) steganography:</b> hides data in the lowest-order bit of each pixel's color value in an image — changing the least significant bit alters a color value so slightly it's imperceptible to the human eye, but a dedicated tool can extract the hidden bitstream back out. <code>zsteg</code> automates detection and extraction for PNG/BMP images specifically; <code>steghide</code> handles a different, password-protected embedding scheme commonly used with JPEG/BMP/WAV files.</li>
<li><b>Audio spectrogram hiding:</b> data (sometimes literally an image or text, drawn as a waveform shape) is encoded into an audio file such that it's invisible in a normal waveform view but becomes visible when the audio is viewed as a <b>spectrogram</b> (frequency vs. time) — tools: Audacity's built-in spectrogram view, or the dedicated <b>Sonic Visualiser</b>.</li>
<li><b>Appended data:</b> many file formats have a well-defined end-of-file marker, and most parsers simply stop reading once they hit it — meaning arbitrary extra data can be appended after that marker with zero effect on the file's normal rendering, discoverable only by scrolling to the literal end of the file in a hex editor.</li>
</ul>

<h4>OSINT (Open-Source Intelligence)</h4>
<p>OSINT is the practice of gathering information from publicly available sources — a skill relevant both to attacker reconnaissance (1.3) and to a distinct category of hackathon "investigation" challenges (find a person, place, or organization from limited clues):</p>
<ul>
<li><b>Reverse image search</b> (Google Images, TinEye, Yandex — Yandex is often disproportionately effective for faces and location-identification specifically) to trace an image's origin or find visually similar matches.</li>
<li><b>EXIF geolocation:</b> as noted above, photos taken on GPS-enabled devices often embed exact latitude/longitude in their EXIF metadata unless it was deliberately stripped.</li>
<li><b>Username correlation:</b> the same handle reused across multiple platforms (tools like <code>Sherlock</code> automate checking a username against hundreds of sites at once) often links an otherwise-anonymous account to other, more identifying accounts.</li>
<li><b>WHOIS and Certificate Transparency (crt.sh):</b> domain registration records and issued TLS certificates can reveal organizational ownership, subdomains, and sometimes internal naming conventions never meant to be public.</li>
</ul>
<h4>Where data hides in an image, concretely</h4>
<p><b>LSB (least significant bit) steganography</b> replaces the lowest bit of each pixel's colour value with a bit of hidden data — a change invisible to the eye (each colour channel shifts by at most 1 out of 256 possible values) but recoverable by extracting every LSB in order. <code>zsteg</code> automates checking common LSB patterns in PNG/BMP files. Separately, many formats allow arbitrary <b>appended data</b> after the image's logical end-of-file marker — a JPEG ends at bytes <code>FF D9</code>, so anything after that marker is invisible to an image viewer but fully recoverable with <code>binwalk</code> or by simply truncating the file at that marker and reading what follows.</p>
<pre><code>exiftool image.jpg          # metadata: GPS coordinates, camera model, software used
binwalk image.jpg           # scans for embedded/appended files of any type
binwalk -e image.jpg        # extracts anything it finds
steghide extract -sf image.jpg   # for steghide-specific embedding, if password-protected</code></pre>
<h4>OSINT methodology, not just tools</h4>
<p>Effective OSINT follows a structure, not a random tool list: start from one confirmed fact (a username, an email, a photo), pivot across platforms by reusing that exact identifier (the same username on GitHub, Twitter/X, and a forum often belongs to the same person), and cross-reference details for internal consistency — a claimed location that doesn't match a photo's EXIF GPS data, or a "new" account that reuses an old profile photo found via reverse image search (Google Images, TinEye, or Yandex, which is often strongest for faces). Document your reasoning chain, not just the conclusion — "username X on site A matches username X on site B, both created within a week, both referencing city C" is defensible; "I'm pretty sure it's them" is not.</p>
`},

{t:"Malware Analysis Basics", h:`
<h3>4.5 Malware Analysis Basics</h3>
<p class="lede">Malware analysis borrows directly from the RE toolchain (3.4) and forensics techniques above, applied specifically to understanding what a malicious sample does, how it persists, and how to detect it elsewhere.</p>

<h4>Static triage</h4>
<p>Before ever executing a suspicious sample, gather as much as possible without running it:</p>
<ul>
<li>Compute its cryptographic hash (<code>sha256sum sample</code>) and check that hash against <b>VirusTotal</b>, which aggregates detection results from dozens of antivirus engines and often immediately tells you if a sample is a known, previously-analyzed threat.</li>
<li>Run <code>strings</code> to pull readable text — suspicious imports, hardcoded URLs/IPs (potential command-and-control infrastructure), or configuration data are often visible even in an otherwise-compiled binary.</li>
<li>Inspect imported functions with a PE (Portable Executable, the Windows binary format) analysis tool like <b>PEstudio</b> — specific imports are strong behavioral indicators: <code>WinExec</code>/<code>CreateProcess</code> (execution), <code>CreateRemoteThread</code>/<code>WriteProcessMemory</code> (process injection, a technique for running code inside another legitimate process to hide), <code>RegSetValue</code> (persistence via the registry), <code>InternetOpen</code>/<code>socket</code> (network communication).</li>
</ul>

<h4>Dynamic/sandbox analysis</h4>
<p>Running a sample to observe its actual behavior is far more conclusive than static guessing — but must <i>only</i> ever be done inside an isolated, disposable sandbox (a dedicated VM with no network access to anything sensitive, ideally snapshotted so it can be instantly reverted). <b>Process Monitor</b> (Windows) logs every file, registry, and process operation an executable performs in real time; <b>Wireshark</b> run alongside captures any network communication the sample attempts, which is often how command-and-control infrastructure is first identified.</p>
<div class="box warn"><p>This rule has zero exceptions, including during a hackathon: never execute an unknown or suspicious sample on your main machine, ever. A hackathon's "malware analysis" track is testing your triage skill, not your willingness to take unnecessary risk.</p></div>

<h4>Persistence mechanisms</h4>
<p>Malware that only runs once, until the next reboot, is far less valuable to an attacker than malware that survives — common persistence techniques include Windows registry <b>Run keys</b> (programs listed here launch automatically at every login), scheduled tasks, services configured to auto-start, and placing an executable in a startup folder. Recognizing these locations is equally useful for incident response (finding what an attacker planted) and for malware-analysis challenges (identifying how a sample achieves persistence).</p>

<h4>Indicators of Compromise (IOCs)</h4>
<p>An <b>IOC</b> is any piece of forensic evidence that reliably signals a particular compromise or malware family — file hashes, known-bad domains/IPs used for command-and-control, specific registry keys, or <b>mutex</b> names a malware family characteristically creates to prevent multiple copies of itself running at once (and which can therefore be used as a detection signature). Extracting IOCs from a sample is the practical output of a malware-analysis task — it's literally the artifact a SOC team would use afterward to hunt for the same threat across an entire network.</p>
<h4>Static triage before anything runs</h4>
<p>Before executing a sample anywhere, extract what you can without running it: <code>file sample</code> identifies the format; <code>strings sample | less</code> often reveals URLs, file paths, or error messages that hint at behaviour; hashing (<code>sha256sum</code>) and checking that hash against VirusTotal tells you in seconds whether it's a known, already-analysed sample before you spend an hour reanalysing it yourself. PE header inspection (<code>pecheck</code>, or Ghidra's import list) shows which Windows API functions the sample imports — imports like <code>InternetOpenUrl</code>, <code>CryptEncrypt</code>, or <code>RegSetValue</code> telegraph network communication, encryption (possible ransomware), or persistence respectively, often before you've read a single line of disassembly.</p>
<h4>Dynamic analysis in an isolated sandbox</h4>
<p>Run the sample in a VM with no network access to the host or internet (host-only or fully isolated networking), snapshotted beforehand so you can revert cleanly. Monitor with <code>procmon</code> (Windows) or <code>strace</code>/<code>ltrace</code> (Linux) for file, registry and system-call activity, and <code>Wireshark</code> on the isolated network to see any attempted command-and-control traffic even though it has nowhere real to go. A sandbox service like Cuckoo or a cloud sandbox (any.run, with caution about what you upload) automates this and produces a behaviour report.</p>
<h4>Persistence mechanisms to check for</h4>
<p>Malware that survives a reboot typically uses one of a small set of mechanisms: a Windows Run registry key, a scheduled task, a service, a startup folder shortcut, or (on Linux) a cron job or systemd unit. Checking these handful of locations covers the overwhelming majority of real-world persistence without needing to understand the sample's full logic first.</p>
`},
  ]
},
