<li><b>Build, buy, or partner?</b> Build what differentiates you, buy or use open source for commodity parts, partner for distribution.</li>
<li><b>Focus or breadth?</b> Early on, depth with a defined customer wins. Breadth comes after a repeatable core.</li>
</ul>

<h4>SWOT and PESTLE in one minute</h4>
<p><b>SWOT</b> lists your Strengths and Weaknesses (internal) and Opportunities and Threats (external). <b>PESTLE</b> scans Political, Economic, Social, Technological, Legal, and Environmental forces. In a pitch, use them silently to prepare answers rather than showing a generic grid.</p>
`},

{t:"Product Management & Metrics", h:`
<h3>7.7 Product Management &amp; Metrics</h3>
<p class="lede">Product management is the discipline of deciding what to build next and proving it worked. It applies to any technology product, not just security, and is the bridge between customer discovery and engineering.</p>

<h4>From idea to product</h4>
<ol>
<li><b>Discover:</b> interviews and observation to find real problems (section 7.2).</li>
<li><b>Define:</b> write the problem, the target user, the success metric, and what is out of scope.</li>
<li><b>Prototype and test cheaply:</b> a landing page that measures sign-ups, a clickable mock-up, a "concierge" version where humans do the work behind the scenes, or a "Wizard of Oz" prototype that looks automated but is manual.</li>
<li><b>Build the smallest valuable version</b> (the MVP) and ship it to a few real users.</li>
<li><b>Measure and iterate</b> on behavior, not opinions.</li>
</ol>

<h4>Prioritization</h4>
<pre><code>RICE score = (Reach x Impact x Confidence) / Effort
  Reach: people affected per period      Impact: 0.25 / 0.5 / 1 / 2 / 3
  Confidence: 50% / 80% / 100%           Effort: person-weeks</code></pre>
<p>Other useful lenses: <b>MoSCoW</b> (Must, Should, Could, Won't), the <b>Kano model</b> (basic expectations versus delighters), and the simple <b>impact versus effort</b> grid. For security products, add a fifth axis: does this reduce a customer's real risk or just add a feature?</p>

<h4>Metrics that matter</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Framework</th><th scope="col">What it tracks</th></tr>
<tr><td>AARRR (pirate metrics)</td><td>Acquisition, Activation, Retention, Referral, Revenue</td></tr>
<tr><td>North Star metric</td><td>The one number best capturing delivered value, e.g. "incidents resolved with evidence per week"</td></tr>
<tr><td>Time to value</td><td>How long from signup to the first meaningful result</td></tr>
<tr><td>Retention / churn</td><td>Do customers keep using and paying?</td></tr>
<tr><td>NPS and qualitative feedback</td><td>Satisfaction and reasons</td></tr>
</table></div>
<p>Security-specific product metrics: <b>mean time to detect and to respond</b>, <b>false-positive and false-negative rate</b>, <b>coverage</b> (share of assets protected), <b>alerts per analyst per day</b>, <b>percentage of incidents auto-resolved</b>, and <b>remediation time</b>. Customers renew on these numbers, so instrument them from day one and report them back to the customer.</p>

<h4>Running a small team</h4>
<ul>
<li><b>OKRs (Objectives and Key Results):</b> a few ambitious objectives with measurable results, reviewed on a regular cadence.</li>
<li><b>Technical debt:</b> a conscious loan taken for speed; record it, then schedule repayment before it blocks you.</li>
<li><b>First hires:</b> early on, hire for the skills you lack (usually sales or distribution if founders are technical, or deep security expertise if founders are commercial) and for people who thrive without structure.</li>
<li><b>Decision logs and written specs</b> keep a small team aligned and make hand-offs cheap.</li>
</ul>

<h4>Mini-MBA frameworks cheat sheet</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Framework</th><th scope="col">Use it to</th></tr>
<tr><td>Lean Canvas / Business Model Canvas</td><td>Describe the whole business on one page</td></tr>
<tr><td>Jobs to be done</td><td>Understand why customers hire a product</td></tr>
<tr><td>Segmentation, targeting, positioning</td><td>Choose who to serve and how to be seen</td></tr>
<tr><td>Porter's five forces</td><td>Judge industry attractiveness and pressure points</td></tr>
<tr><td>Crossing the chasm</td><td>Move from early adopters to the mainstream by dominating one niche</td></tr>
<tr><td>Disruptive innovation</td><td>Understand how simpler, cheaper tools displace incumbents from below</td></tr>
<tr><td>Unit economics</td><td>Test whether growth creates or destroys value</td></tr>
<tr><td>Marketing mix (product, price, place, promotion)</td><td>Check that the offer is coherent</td></tr>
<tr><td>RICE / MoSCoW</td><td>Prioritize a roadmap</td></tr>
<tr><td>OKRs</td><td>Align a team on measurable goals</td></tr>
</table></div>
`},

{t:"Finance & Funding", h:`
<h3>7.8 Finance &amp; Funding</h3>
<p class="lede">Money decides how long you can keep trying. You do not need an accounting degree, but you do need to read a runway, understand dilution, and know the options before you accept any of them.</p>

<h4>Basics</h4>
<pre><code>Net burn = cash out - cash in, per month
Runway (months) = cash in bank / net burn
Break-even revenue = fixed costs / contribution margin per unit
Dilution: owning 100% and selling 20% in a round leaves you with 80%;
a later 20% round leaves you with 64% (0.8 x 0.8), before any option pool.</code></pre>

<h4>Funding paths</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Path</th><th scope="col">Description</th><th scope="col">Good for</th></tr>
<tr><td>Bootstrapping / services-funded</td><td>Revenue from consulting, pentests, or early customers funds product work</td><td>Founders who want control; early validation</td></tr>
<tr><td>Grants and government programs</td><td>Non-dilutive money; in India examples include Startup India recognition and science-and-technology department schemes routed through incubators</td><td>Deep-tech and research-heavy ideas</td></tr>
<tr><td>Incubators and accelerators</td><td>College and technology business incubators, and programs such as Y Combinator, Techstars, or Antler, give mentorship, networks, and sometimes capital</td><td>First-time founders; hackathon winners with traction</td></tr>
<tr><td>Competitions and prizes</td><td>Pitch contests like RSAC Innovation Sandbox or Nullcon Startville, and sponsor hackathons</td><td>Credibility, press, and investor attention</td></tr>
<tr><td>Angel and pre-seed</td><td>Individuals investing small amounts on a team and idea</td><td>Building the first version and pilots</td></tr>
<tr><td>Seed and Series A</td><td>Institutional venture funding; investors look for repeatable sales and growth</td><td>Scaling after early product-market fit</td></tr>
<tr><td>Strategic / corporate</td><td>Large vendors invest or partner</td><td>Distribution and acquisition paths</td></tr>
</table></div>

<h4>What investors look for by stage (rough guide)</h4>
<ul>
<li><b>Idea / pre-seed:</b> team quality, problem insight, and a working prototype or early pilots.</li>
<li><b>Seed:</b> design partners or early paying customers, evidence customers will pay, and a plausible path to a repeatable sales motion.</li>
<li><b>Series A:</b> consistent growth, healthy unit economics, a clear ICP, and a team that can scale sales.</li>
</ul>
<p>Specific revenue benchmarks and valuations shift with the market and with investor, so research current ones rather than relying on a fixed number. Instruments such as SAFEs and convertible notes, option pools, and term sheet clauses (liquidation preference, vesting, board seats) are worth studying before your first raise.</p>

<h4>A first financial model</h4>
<ol>
<li><b>Revenue build:</b> number of customers by month times average revenue per account, with churn.</li>
<li><b>Cost build:</b> hosting and AI costs per customer, salaries, tools, compliance, marketing.</li>
<li><b>Break-even and runway:</b> when revenue covers cost, and how much cash is needed to get there.</li>
<li><b>Sensitivity:</b> what happens if churn doubles or sales cycles take twice as long.</li>
</ol>
<p>Keep three years of projections modest and traceable to assumptions you can explain. Judges and investors distrust hockey-stick charts with no logic.</p>

<h4>Exit paths</h4>
<p>Acquisition by a larger security or platform vendor is the most common outcome in the industry; others are growth through profitability, private-equity roll-ups, merging with a complementary product, and, rarely, a public listing. Founders who understand the likely acquirers build products that fit into their portfolios.</p>
<div class="box"><p>Hackathon prizes and wins often convert to internships, mentoring, incubator offers, or open-source reputation rather than cash. Treat these as the real prizes and follow up within a week while the contact is warm.</p></div>
`},

{t:"The Business Slide: Turning This Into Points", h:`
<h3>7.9 The Business Slide: Turning This Into Hackathon Points</h3>
<p class="lede">You will not have time to present a business plan. You will have time for one slide and a sixty-second answer. This section compresses chapter 7 into exactly that, so the "business model and feasibility" criterion (section 6.1) works for you.</p>

<h4>Lean canvas on one slide</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Box</th><th scope="col">One line to write</th></tr>
<tr><td>Customer segment</td><td>Named buyer and user (e.g. IT admins at 50–500-person firms)</td></tr>
<tr><td>Problem</td><td>The top two pains with one number</td></tr>
<tr><td>Solution</td><td>Your three-feature MVP, not your dream roadmap</td></tr>
<tr><td>Unique value proposition</td><td>The positioning sentence (section 7.2)</td></tr>
<tr><td>Unfair advantage</td><td>Honest current edge (data, expertise, partnership)</td></tr>
<tr><td>Channels</td><td>How you reach the first ten customers</td></tr>
<tr><td>Revenue streams</td><td>Price and model</td></tr>
<tr><td>Cost structure</td><td>Biggest two costs, including AI/cloud per customer</td></tr>
<tr><td>Key metrics</td><td>The two numbers you would track from day one</td></tr>
</table></div>

<h4>Bottom-up market size</h4>
<p>Avoid "the global security market is worth hundreds of billions." Instead:</p>
<pre><code>Target organizations in your first segment:          20,000
Share reachable in 2 years (SAM):                     20% = 4,000
Realistic share you could win (SOM):                  5% of SAM = 200
Annual price:                                         $2,400
First-two-year revenue potential:                     200 x $2,400 = $480,000</code></pre>
<p>A small, defensible number grounded in a countable customer list is more credible than a giant top-down figure and shows you know how to find buyers.</p>

<h4>The sixty-second business answer</h4>
<ol>
<li><b>Who pays:</b> "Our buyer is [role] at [type of company]."</li>
<li><b>Why they pay:</b> "Today they spend [cost/time]; we cut it by [measured amount]."</li>
<li><b>How much:</b> "We charge [price] per [unit]; at [number] customers that is [revenue]."</li>
<li><b>How we reach them:</b> "First [channel], then [channel]; our first ten customers are [specific list]."</li>
<li><b>Why we win:</b> "Unlike [alternative], we [difference]; our edge today is [honest moat]."</li>
<li><b>What is next:</b> "In three months we will run [pilot] with [type of customer] and measure [metric]."</li>
</ol>

<h4>A 10-slide deck outline</h4>
<ol>
<li>Title and one-line pitch</li>
<li>Problem (story plus one number)</li>
<li>Solution (what it does, one screenshot)</li>
<li>Live demo or demo video moment</li>
<li>How it works (architecture, the hard thing)</li>
<li>Results (metrics versus baseline)</li>
<li>Market and customer (bottom-up)</li>
<li>Business model and go-to-market</li>
<li>Competition and moat (honest matrix)</li>
<li>Team, roadmap, and ask</li>
</ol>

<h4>Traps to avoid</h4>
<ul>
<li>"We will sell to everyone" — name one segment.</li>
<li>"We have no competitors" — judges hear "I have not researched."</li>
<li>Giant, unsupported market figures and hockey-stick projections.</li>
<li>Ignoring who actually signs the purchase order.</li>
<li>Describing the roadmap as if it were the product that exists today.</li>
</ul>
<div class="box"><p><b>The unifying idea of chapters 6 and 7:</b> a winning product is a real solution to a specific, painful, funded problem — built well enough to prove the hard part, presented clearly enough to be understood in five minutes, and framed as a business someone could realistically start on Monday.</p></div>
`},
  ]
},
{
  id:8, title:"Glossary", level:"Reference",
  desc:"Every acronym and abbreviation used across this knowledge base, with its full form and a one-line plain-English definition. Organized by domain to match the chapters above; use the search box to jump straight to a term.",
  isGlossary:true,
  subs:[
{t:"General & Organizations", h:`
<h3>8.1 General Security Terms & Organizations</h3>
<dl class="terms">
<dt>CTF — Capture The Flag</dt><dd>A competition format where participants solve security challenges to find hidden "flag" strings proving they solved it.</dd>
<dt>CVE — Common Vulnerabilities and Exposures</dt><dd>A public, uniquely-numbered catalog of known software vulnerabilities (e.g. CVE-2021-44228).</dd>
<dt>CVSS — Common Vulnerability Scoring System</dt><dd>A standardized 0–10 score rating how severe a given vulnerability is.</dd>
<dt>CWE — Common Weakness Enumeration</dt><dd>A catalog of general <i>classes</i> of software weakness (e.g. "Improper Input Validation"), as opposed to CVE's specific instances.</dd>
<dt>NVD — National Vulnerability Database</dt><dd>The U.S. government's database that enriches CVE entries with severity scores and extra detail.</dd>
<dt>OWASP — Open Web Application Security Project</dt><dd>A nonprofit foundation producing widely-used free security resources, most famously the "Top 10" web risk list.</dd>
<dt>MITRE ATT&CK — Adversarial Tactics, Techniques, and Common Knowledge</dt><dd>A public knowledge base cataloging real-world attacker behavior as tactics and techniques.</dd>
<dt>PICERL</dt><dd>The six-phase incident response lifecycle: Preparation, Identification, Containment, Eradication, Recovery, Lessons Learned.</dd>
<dt>DFIR — Digital Forensics and Incident Response</dt><dd>The combined discipline of investigating security incidents and recovering/analyzing digital evidence.</dd>
<dt>SOC — Security Operations Center</dt><dd>The team/function responsible for continuously monitoring an organization for security events.</dd>
<dt>SIEM — Security Information and Event Management</dt><dd>A platform that aggregates and correlates logs from across an environment for monitoring and alerting.</dd>
<dt>SOAR — Security Orchestration, Automation and Response</dt><dd>Tooling that automates repetitive SOC response actions based on predefined playbooks.</dd>
<dt>IOC — Indicator of Compromise</dt><dd>A specific, concrete artifact (hash, IP, domain) signaling a particular known compromise or malware family.</dd>
<dt>TTP — Tactics, Techniques, and Procedures</dt><dd>A description of an attacker's behavioral methodology, more durable to track than individual IOCs.</dd>
<dt>APT — Advanced Persistent Threat</dt><dd>A sophisticated, usually state-sponsored or well-resourced attacker group that maintains long-term, stealthy access to a target.</dd>
<dt>C2 / C&C — Command and Control</dt><dd>The infrastructure an attacker uses to remotely control compromised machines after a breach.</dd>
<dt>EDR — Endpoint Detection and Response</dt><dd>Software on individual devices that monitors for and responds to malicious behavior in real time.</dd>
<dt>AV — Antivirus</dt><dd>Software that detects and removes known malware, traditionally via signature matching.</dd>
<dt>XDR — Extended Detection and Response</dt><dd>EDR's successor concept, correlating detection data across endpoints, network, and cloud in one platform.</dd>
<dt>NIDS / HIDS — Network/Host Intrusion Detection System</dt><dd>An IDS deployed either on the network (watching traffic) or on a specific host (watching local activity).</dd>
<dt>VAPT — Vulnerability Assessment and Penetration Testing</dt><dd>The combined practice of scanning for weaknesses (assessment) and actively exploiting them to prove impact (pentest).</dd>
<dt>Red / Blue / Purple Team</dt><dd>Red team attacks (offense), Blue team defends (defense), Purple team is the collaborative practice of both working together to improve detection.</dd>
<dt>Zero-day</dt><dd>A vulnerability that is exploited before (or with no) a patch being available from the vendor.</dd>
</dl>
`},
{t:"Networking & Infrastructure", h:`
<h3>8.2 Networking & Infrastructure</h3>
<dl class="terms">
<dt>OSI — Open Systems Interconnection</dt><dd>The 7-layer reference model describing how network communication is structured, from physical cabling up to the application.</dd>
<dt>TCP/IP — Transmission Control Protocol / Internet Protocol</dt><dd>The practical 4-layer protocol suite the real internet runs on.</dd>
<dt>IP — Internet Protocol</dt><dd>The network-layer protocol responsible for addressing and routing packets between hosts.</dd>
<dt>TCP — Transmission Control Protocol</dt><dd>A reliable, connection-oriented transport protocol using a handshake and sequence numbers.</dd>
<dt>UDP — User Datagram Protocol</dt><dd>A fast, connectionless transport protocol with no delivery guarantee.</dd>
<dt>CIDR — Classless Inter-Domain Routing</dt><dd>Notation (e.g. /24) describing how many bits of an IP address identify the network portion.</dd>
<dt>NAT — Network Address Translation</dt><dd>A technique for mapping multiple private IP addresses to one public IP address.</dd>
<dt>DHCP — Dynamic Host Configuration Protocol</dt><dd>The protocol that automatically assigns IP addresses to devices joining a network.</dd>
<dt>ARP — Address Resolution Protocol</dt><dd>The protocol that resolves an IP address to a MAC address on a local network segment.</dd>
<dt>DNS — Domain Name System</dt><dd>The system that translates human-readable domain names into IP addresses.</dd>
<dt>DNSSEC — DNS Security Extensions</dt><dd>An extension to DNS that cryptographically signs records to prevent spoofing.</dd>
<dt>MITM — Man-in-the-Middle</dt><dd>An attack where the attacker secretly intercepts and possibly alters communication between two parties.</dd>
<dt>VLAN — Virtual Local Area Network</dt><dd>A logical subdivision of a physical network into isolated broadcast domains.</dd>
<dt>SSID / BSSID — Service Set Identifier / Basic SSID</dt><dd>SSID is a Wi-Fi network's human-readable name; BSSID is the access point's actual MAC address.</dd>
<dt>WEP / WPA / WPA2 / WPA3 — Wired Equivalent Privacy / Wi-Fi Protected Access (versions 1–3)</dt><dd>Successive generations of Wi-Fi security standards, from broken (WEP) to current best practice (WPA3).</dd>
<dt>TKIP — Temporal Key Integrity Protocol</dt><dd>The encryption protocol used by original WPA, a stopgap fix over WEP's broken RC4 usage.</dd>
<dt>CCMP — Counter Mode CBC-MAC Protocol</dt><dd>The AES-based encryption protocol used by WPA2.</dd>
<dt>SAE — Simultaneous Authentication of Equals</dt><dd>The handshake used by WPA3 ("Dragonfly"), resistant to offline dictionary attacks.</dd>
<dt>802.1X</dt><dd>An IEEE standard for port-based network access control, underlying enterprise Wi-Fi authentication.</dd>
<dt>VPN — Virtual Private Network</dt><dd>An encrypted tunnel connecting two endpoints over an untrusted network.</dd>
<dt>IPsec — Internet Protocol Security</dt><dd>A network-layer protocol suite for authenticating and encrypting IP packets, often used for site-to-site VPNs.</dd>
<dt>IDS / IPS — Intrusion Detection/Prevention System</dt><dd>A system that detects (IDS) or detects-and-blocks (IPS) malicious network traffic.</dd>
<dt>NGFW — Next-Generation Firewall</dt><dd>A firewall with application-layer awareness and integrated intrusion prevention.</dd>
<dt>DAI — Dynamic ARP Inspection</dt><dd>A switch feature that validates ARP packets against a trusted binding table to stop ARP spoofing.</dd>
<dt>HSTS — HTTP Strict Transport Security</dt><dd>A header telling browsers to always use HTTPS for a site, preventing downgrade attacks.</dd>
<dt>DoS / DDoS — (Distributed) Denial of Service</dt><dd>An attack aimed at making a system or service unavailable to legitimate users, "distributed" meaning from many sources at once.</dd>
<dt>ICMP — Internet Control Message Protocol</dt><dd>A network-layer protocol used for diagnostic/control messages, e.g. ping and traceroute.</dd>
<dt>NTP — Network Time Protocol</dt><dd>The protocol used to synchronize clocks across networked systems; also a common DDoS amplification vector.</dd>
</dl>
`},
{t:"Web Application Security", h:`
<h3>8.3 Web Application Security</h3>
<dl class="terms">
<dt>HTTP/HTTPS — HyperText Transfer Protocol (Secure)</dt><dd>The protocol web browsers and servers use to communicate; HTTPS wraps it in TLS encryption.</dd>
<dt>TLS/SSL — Transport Layer Security / Secure Sockets Layer</dt><dd>Cryptographic protocols providing encryption and integrity for data in transit; SSL is the deprecated predecessor to TLS.</dd>
<dt>URL/URI — Uniform Resource Locator/Identifier</dt><dd>The address format used to identify and locate a resource on the web.</dd>
<dt>API — Application Programming Interface</dt><dd>A defined interface that lets separate software components communicate, commonly over HTTP in web apps.</dd>
<dt>REST — Representational State Transfer</dt><dd>An architectural style for designing APIs around standard HTTP methods and resource URLs.</dd>
<dt>JSON — JavaScript Object Notation</dt><dd>A lightweight, human-readable data format widely used for API request/response bodies.</dd>
<dt>SQLi — SQL Injection</dt><dd>Injecting malicious SQL syntax into a database query via unsanitized input.</dd>
<dt>NoSQLi — NoSQL Injection</dt><dd>The equivalent injection class against non-relational (document) databases.</dd>
<dt>SSTI — Server-Side Template Injection</dt><dd>Injecting template-engine syntax that gets evaluated as code on the server.</dd>
<dt>XSS — Cross-Site Scripting</dt><dd>Injecting malicious script that executes in another user's browser.</dd>
<dt>CSRF — Cross-Site Request Forgery</dt><dd>Tricking a victim's browser into submitting an unwanted request using their existing session.</dd>
<dt>SSRF — Server-Side Request Forgery</dt><dd>Tricking a server into making an HTTP request to a destination of the attacker's choosing.</dd>
<dt>XXE — XML External Entity (injection)</dt><dd>Exploiting XML parsers that process external entity references to read local files or make server-side requests.</dd>
<dt>LFI / RFI — Local/Remote File Inclusion</dt><dd>Tricking an application into including and executing a local or remote attacker-chosen file.</dd>
<dt>IDOR — Insecure Direct Object Reference</dt><dd>Accessing another user's data by directly changing a reference (e.g. an ID) without an ownership check.</dd>
<dt>BOLA — Broken Object Level Authorization</dt><dd>The API-specific term for the same underlying flaw as IDOR.</dd>
<dt>RCE — Remote Code Execution</dt><dd>A vulnerability that lets an attacker run arbitrary commands/code on a target system remotely.</dd>
<dt>JWT — JSON Web Token</dt><dd>A compact, signed token format commonly used for authentication/session claims.</dd>
<dt>CSP — Content Security Policy</dt><dd>A browser-enforced header restricting which script/resource sources a page is allowed to load from.</dd>
<dt>CORS — Cross-Origin Resource Sharing</dt><dd>A browser mechanism that controls whether a web page can make requests to a different origin than its own.</dd>
<dt>SOP — Same-Origin Policy</dt><dd>The default browser security model preventing a page from reading data from a different origin.</dd>
<dt>WAF — Web Application Firewall</dt><dd>A filtering layer in front of a web app that blocks known attack patterns in HTTP traffic.</dd>
<dt>OTP — One-Time Password</dt><dd>A password valid for only a single login/transaction, commonly used in multi-factor authentication.</dd>
<dt>MFA / 2FA — Multi-Factor (Two-Factor) Authentication</dt><dd>Requiring more than one proof of identity (e.g. password plus a code) to log in.</dd>
</dl>
`},
{t:"Cryptography", h:`
<h3>8.4 Cryptography</h3>
<dl class="terms">
<dt>AES — Advanced Encryption Standard</dt><dd>The current standard symmetric block cipher, operating on 128-bit blocks.</dd>
<dt>RC4 — Rivest Cipher 4</dt><dd>A legacy, now-broken stream cipher formerly used in WEP/early WPA and old TLS versions.</dd>
<dt>RSA — Rivest–Shamir–Adleman</dt><dd>A widely used asymmetric encryption/signature algorithm based on the difficulty of factoring large numbers.</dd>
<dt>ECC — Elliptic Curve Cryptography</dt><dd>An asymmetric cryptography approach based on elliptic curve math, offering equivalent security to RSA with much smaller keys.</dd>
<dt>MD5 — Message Digest 5</dt><dd>A legacy, now broken-for-collisions hash function; still common in legacy systems and CTFs.</dd>
<dt>SHA — Secure Hash Algorithm</dt><dd>A family of cryptographic hash functions (SHA-1 broken, SHA-2/SHA-256 and SHA-3 are current standards).</dd>
<dt>HMAC — Hash-based Message Authentication Code</dt><dd>A construction combining a hash function with a secret key to provide message authenticity, resistant to length-extension attacks.</dd>
<dt>MAC — Message Authentication Code</dt><dd>A short tag proving both the integrity and authenticity of a message using a shared secret key.</dd>
<dt>ECB / CBC / CTR / GCM — Electronic Codebook / Cipher Block Chaining / Counter / Galois Counter Mode</dt><dd>Block cipher modes of operation, differing in how they chain block encryptions and whether they provide built-in authentication (GCM).</dd>
<dt>AEAD — Authenticated Encryption with Associated Data</dt><dd>An encryption mode (like GCM) that provides both confidentiality and integrity in one operation.</dd>
<dt>IV / Nonce — Initialization Vector / Number Used Once</dt><dd>A value mixed into encryption to ensure identical plaintexts don't produce identical ciphertexts; must never be reused with the same key in stream-cipher-style modes.</dd>
<dt>PRNG — Pseudo-Random Number Generator</dt><dd>An algorithm generating number sequences that approximate randomness; a weak/predictable PRNG undermines any crypto built on it.</dd>
<dt>PKI — Public Key Infrastructure</dt><dd>The overall system of certificates, authorities, and trust relationships that make public-key cryptography usable at scale on the internet.</dd>
<dt>CA — Certificate Authority</dt><dd>A trusted entity that issues digital certificates vouching for a public key's ownership.</dd>
<dt>CRL / OCSP — Certificate Revocation List / Online Certificate Status Protocol</dt><dd>Two mechanisms for checking whether a certificate has been revoked before its expiry.</dd>
<dt>bcrypt / scrypt / Argon2 / PBKDF2</dt><dd>Deliberately slow, purpose-built password-hashing algorithms designed to resist fast brute-force cracking, unlike general-purpose hashes.</dd>
<dt>Salt / Pepper</dt><dd>A salt is random per-password data mixed in before hashing to defeat precomputed attacks; a pepper is a secret value shared across all hashes, stored separately from the database.</dd>
<dt>Rainbow table</dt><dd>A precomputed table of hash-to-plaintext mappings used to speed up password cracking; defeated by proper salting.</dd>
</dl>
`},
{t:"Systems, Malware & Forensics", h:`
<h3>8.5 Systems, Malware & Forensics</h3>
<dl class="terms">
<dt>SUID / GID / UID — Set User ID / Group ID / User ID</dt><dd>Unix permission concepts; SUID makes a program run with its owner's privileges regardless of who executes it.</dd>
<dt>GTFOBins / LOLBAS</dt><dd>Curated lists of common Unix (GTFOBins) and Windows (LOLBAS, "Living Off the Land Binaries") system binaries with known privilege-escalation or defense-evasion tricks.</dd>
<dt>AD — Active Directory</dt><dd>Microsoft's directory service for centrally managing users, computers, and permissions across a Windows network.</dd>
<dt>RBAC — Role-Based Access Control</dt><dd>An authorization model granting permissions based on a user's assigned role rather than individually.</dd>
<dt>Kerberos / AS-REP / SPN</dt><dd>Kerberos is a network authentication protocol using tickets; AS-REP roasting and SPN (Service Principal Name) ticket abuse (Kerberoasting) are attacks against it.</dd>
<dt>PE — Portable Executable</dt><dd>The standard executable file format used by Windows (.exe, .dll).</dd>
<dt>DLL — Dynamic Link Library</dt><dd>A Windows shared-library file loaded by executables at runtime.</dd>
<dt>ASLR — Address Space Layout Randomization</dt><dd>A memory protection randomizing the base addresses of a process's memory regions on each run.</dd>
<dt>NX / DEP — No-eXecute / Data Execution Prevention</dt><dd>A memory protection marking data regions (like the stack) as non-executable.</dd>
<dt>PIE — Position-Independent Executable</dt><dd>A binary compiled so its own base load address can be randomized, extending ASLR to the executable itself.</dd>
<dt>ROP — Return-Oriented Programming</dt><dd>An exploitation technique chaining existing code fragments ("gadgets") to bypass NX/DEP without injecting new code.</dd>
<dt>GDB — GNU Debugger</dt><dd>The standard command-line debugger on Linux, often extended with the pwndbg or GEF plugin for exploit development.</dd>
<dt>IDA — Interactive DisAssembler</dt><dd>A long-standing industry-standard disassembly and decompilation tool.</dd>
<dt>EXIF — Exchangeable Image File Format</dt><dd>Metadata embedded in image files, potentially including camera model, timestamp, and GPS location.</dd>
<dt>LSB — Least Significant Bit</dt><dd>The lowest-order bit of a value; LSB steganography hides data there since changing it causes minimal visible distortion.</dd>
<dt>OSINT — Open-Source Intelligence</dt><dd>Gathering information from publicly available sources.</dd>
<dt>VM — Virtual Machine</dt><dd>A software-emulated computer running on top of a host system, commonly used to isolate suspicious activity.</dd>
<dt>Sandbox</dt><dd>An isolated environment for safely running untrusted or suspicious code without risking the host system.</dd>
<dt>Honeypot</dt><dd>A deliberately exposed, monitored decoy system designed to attract and study attacker behavior.</dd>
<dt>Patch Tuesday</dt><dd>Microsoft's regular (second Tuesday of each month) scheduled security-update release.</dd>
</dl>
`},
{t:"Cloud, DevSecOps & Misc", h:`
<h3>8.6 Cloud, DevSecOps & Miscellaneous</h3>
<dl class="terms">
<dt>IAM — Identity and Access Management</dt><dd>The cloud/enterprise system of users, roles, and policies controlling who can access what.</dd>
<dt>S3 — Simple Storage Service</dt><dd>AWS's object storage service; misconfigured public "buckets" are a frequent real-world breach cause.</dd>
<dt>IMDSv2 — Instance Metadata Service version 2</dt><dd>AWS's hardened, session-oriented version of the instance metadata endpoint, designed to resist SSRF-based credential theft.</dd>
<dt>K8s — Kubernetes</dt><dd>The dominant open-source platform for orchestrating and managing containerized applications at scale.</dd>
<dt>CI/CD — Continuous Integration / Continuous Deployment</dt><dd>Automated pipelines that build, test, and deploy code changes, often with minimal human intervention.</dd>
<dt>DevSecOps</dt><dd>The practice of integrating security practices directly into the DevOps development and deployment pipeline, rather than bolting it on afterward.</dd>
<dt>STRIDE</dt><dd>A threat-modeling mnemonic: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege.</dd>
<dt>Bug bounty</dt><dd>A program where organizations pay independent researchers for responsibly disclosed vulnerabilities.</dd>
<dt>Pentest — Penetration Test</dt><dd>An authorized, simulated attack against a system to evaluate its real-world security.</dd>
<dt>Shodan / Censys</dt><dd>Internet-wide scanning search engines that index publicly reachable devices and services.</dd>
<dt>UPX — Ultimate Packer for eXecutables</dt><dd>A common open-source executable packer/compressor, frequently seen (and easily reversed) in CTF binaries.</dd>
</dl>
`},
{t:"Product-Building Stack", h:`
<h3>8.7 Software to Learn: Product-Building Stack</h3>
<p class="lede">The practical toolbox for building a working, demoable security product in 24–48 hours. You do not need all of it — pick one language, one web framework, one database, and one deployment route, and know them well. Items marked (core) are the highest return on learning time.</p>
<dl class="terms">
<dt>Python (core)</dt><dd>The default language for security tooling, data work, ML, and quick backends; huge library ecosystem (scapy, requests, pandas, scikit-learn).</dd>
<dt>Go</dt><dd>A compiled language that produces fast, single-binary tools; popular for security agents, scanners, and cloud tooling.</dd>
<dt>Rust</dt><dd>A memory-safe systems language increasingly used for security-critical components and performance-sensitive parsers.</dd>
<dt>TypeScript / JavaScript (core)</dt><dd>The language of the browser and a major backend option via Node.js; needed for almost any web front end.</dd>
<dt>Bash / shell scripting (core)</dt><dd>Glue for automating Linux tasks, tooling pipelines, and demo setup.</dd>
<dt>SQL (core)</dt><dd>The standard language for querying relational databases; also essential for understanding SQL injection.</dd>
<dt>FastAPI / Flask / Django</dt><dd>Python web frameworks for building APIs and backends quickly; FastAPI auto-generates API documentation.</dd>
<dt>Node.js / Express</dt><dd>JavaScript server runtime and minimal web framework for APIs.</dd>
<dt>React / Next.js</dt><dd>The dominant JavaScript UI library and its full-stack framework for building polished dashboards quickly.</dd>
<dt>Flutter / Dart</dt><dd>A cross-platform toolkit for building mobile and web apps from one codebase.</dd>
<dt>Tailwind CSS / component libraries</dt><dd>Utility-first styling and prebuilt UI components that let a small team produce a clean interface fast.</dd>
<dt>Streamlit / Gradio</dt><dd>Python frameworks for turning scripts and models into interactive demo apps in minutes.</dd>
<dt>PostgreSQL (core)</dt><dd>A robust open-source relational database; the safe default for structured data, and pgvector adds vector search.</dd>
<dt>SQLite</dt><dd>A zero-setup file-based database ideal for prototypes and demos.</dd>
<dt>Redis</dt><dd>An in-memory data store used for caching, queues, rate limiting, and sessions.</dd>
<dt>MongoDB</dt><dd>A document database common in rapid prototypes; know its injection pitfalls.</dd>
<dt>Elasticsearch / OpenSearch</dt><dd>Search and analytics engines that also underpin many log-analysis and SIEM products.</dd>
<dt>Kafka / message queues</dt><dd>Systems for streaming events between components; relevant when processing logs at volume.</dd>
<dt>Git and GitHub (core)</dt><dd>Version control and collaboration; also the home of your README, issues, and CI pipeline.</dd>
<dt>GitHub Actions</dt><dd>Built-in CI/CD for running tests, security scans, and deployments on every push.</dd>
<dt>Docker and Docker Compose (core)</dt><dd>Package your app and dependencies so anyone can run it with one command; the backbone of reproducible demos.</dd>
<dt>Kubernetes</dt><dd>Container orchestration for production scale; worth understanding conceptually but rarely needed for a hackathon.</dd>
<dt>Terraform</dt><dd>Infrastructure as code for reproducibly provisioning cloud resources.</dd>
<dt>Nginx / Caddy</dt><dd>Web servers and reverse proxies for TLS, routing, and rate limiting.</dd>
<dt>REST / OpenAPI / Swagger</dt><dd>Conventions and a specification format for designing and documenting HTTP APIs.</dd>
<dt>WebSockets / Server-Sent Events</dt><dd>Mechanisms for pushing live updates (alerts, logs) to a browser dashboard.</dd>
<dt>gRPC / Protocol Buffers</dt><dd>A fast, typed RPC framework for service-to-service communication.</dd>
<dt>Postman / Insomnia / curl</dt><dd>Tools for testing and demonstrating API calls.</dd>
<dt>Vercel / Netlify / Render / Fly.io / Railway</dt><dd>Hosting platforms with generous free tiers for deploying a demo link in minutes.</dd>
<dt>AWS / Google Cloud / Azure free tiers</dt><dd>Major cloud platforms; learn one well, including its IAM and logging services.</dd>
<dt>Cloudflare</dt><dd>DNS, CDN, and edge security services; useful for deploying and protecting a demo.</dd>
<dt>Supabase / Firebase</dt><dd>Hosted backends bundling a database, authentication, and storage for fast prototypes.</dd>
<dt>Auth0 / Keycloak / Clerk</dt><dd>Managed or self-hosted identity providers so you do not hand-roll authentication.</dd>
<dt>Figma (core)</dt><dd>Interface design and prototyping tool; a clickable mock-up is also a customer-discovery tool.</dd>
<dt>Excalidraw / draw.io / Mermaid</dt><dd>Quick tools for architecture diagrams that judges will actually read.</dd>
<dt>Grafana / Chart.js / D3</dt><dd>Dashboards and charting libraries for turning metrics into visuals.</dd>
<dt>Notion / Linear / GitHub Projects</dt><dd>Lightweight task and documentation tools for coordinating a small team.</dd>
<dt>OBS Studio / Loom / Canva</dt><dd>Screen recording and design tools for demo videos, thumbnails, and slide visuals.</dd>
<dt>Devpost / MLH</dt><dd>Platforms where many hackathons host submissions and judging; learn their submission format ahead of time.</dd>
</dl>
`},
{t:"AI & ML for Security Products", h:`
<h3>8.8 Software to Learn: AI &amp; ML for Security Products</h3>
<p class="lede">Many winning projects now combine classic detection with machine learning or language models. This list covers the tooling, the data, and the new attack surface that comes with AI.</p>
<dl class="terms">
<dt>LLM — Large Language Model</dt><dd>A neural network trained on text that can summarize, classify, and generate; powerful for triage and explanation, unreliable without verification.</dd>
<dt>RAG — Retrieval-Augmented Generation</dt><dd>Giving an LLM relevant retrieved documents so answers cite real evidence instead of guessing.</dd>
<dt>Embeddings and vector databases (pgvector, FAISS, Chroma)</dt><dd>Numeric representations of text and stores for similarity search; the engine behind RAG and log or code search.</dd>
<dt>LangChain / LlamaIndex / agent frameworks</dt><dd>Libraries for chaining model calls, tools, and retrieval; useful but add complexity, so use only what you need.</dd>
<dt>Function calling / tool use</dt><dd>Letting a model call defined functions (query a SIEM, run a scan); the foundation of agentic systems and a key security boundary.</dd>
<dt>MCP — Model Context Protocol</dt><dd>An open protocol for connecting AI applications to external tools and data sources; auditing what permissions each tool grants is itself a security product area.</dd>
<dt>Agentic AI</dt><dd>Systems where a model plans and takes multiple actions on its own; powerful for automation, risky without limits and human approval.</dd>
<dt>Human-in-the-loop</dt><dd>Requiring a person to approve high-impact actions; a strong answer to "what if the AI is wrong."</dd>
<dt>scikit-learn / XGBoost</dt><dd>Classical machine-learning libraries; often better than deep learning for tabular security data and far easier to explain.</dd>
<dt>PyTorch / TensorFlow</dt><dd>Deep-learning frameworks for custom neural models.</dd>
<dt>Hugging Face</dt><dd>Hub of open models, datasets, and libraries for fine-tuning and inference.</dd>
<dt>Ollama / llama.cpp</dt><dd>Tools for running open models locally, useful when data cannot leave the customer's environment.</dd>
<dt>pandas / Jupyter</dt><dd>Data analysis library and notebook environment for exploring logs and measuring results.</dd>
<dt>Precision / recall / F1 / ROC-AUC</dt><dd>Standard metrics for classifiers; precision is how many alerts were real, recall is how many real threats were caught, F1 balances both.</dd>
<dt>False positive / false negative</dt><dd>A false alarm versus a missed threat; the central trade-off of every detection product.</dd>
<dt>Baseline</dt><dd>A simple reference method you must beat for a result to mean anything.</dd>
<dt>Ablation study</dt><dd>Removing a component to show how much it actually contributes.</dd>
<dt>Prompt injection</dt><dd>Hiding instructions in content an LLM reads so the model follows the attacker instead of the user; the leading LLM-application risk.</dd>
<dt>Jailbreak</dt><dd>Prompting a model to bypass its safety rules.</dd>
<dt>OWASP Top 10 for LLM Applications</dt><dd>A ranked list of the main security risks specific to LLM-based applications.</dd>
<dt>MITRE ATLAS</dt><dd>A knowledge base of adversary tactics and techniques against AI systems, modeled on ATT&amp;CK.</dd>
<dt>Guardrails</dt><dd>Input and output checks that constrain what an AI system may accept, say, or do.</dd>
<dt>Data poisoning / model poisoning</dt><dd>Corrupting training data or a model so it behaves wrongly in ways the attacker chooses.</dd>
<dt>Adversarial examples</dt><dd>Inputs crafted to fool a model, such as malware modified to evade a classifier.</dd>
<dt>Hallucination</dt><dd>A model confidently producing false content; mitigate with retrieval, citations, and verification.</dd>
<dt>Model inversion / training-data extraction</dt><dd>Attacks that recover private information from a model.</dd>
<dt>CIC-IDS2017 / UNSW-NB15</dt><dd>Public labeled network-traffic datasets widely used for intrusion-detection research.</dd>
<dt>EMBER</dt><dd>A public benchmark dataset of Windows executable features for malware classification.</dd>
<dt>PhishTank / OpenPhish / URLhaus</dt><dd>Public feeds of phishing and malicious URLs useful for training and testing detectors.</dd>
<dt>CISA KEV — Known Exploited Vulnerabilities</dt><dd>A catalog of vulnerabilities confirmed to be exploited in the wild; excellent for prioritization features.</dd>
<dt>EPSS — Exploit Prediction Scoring System</dt><dd>A model estimating the probability that a vulnerability will be exploited soon.</dd>
<dt>CRS — Cyber Reasoning System</dt><dd>An autonomous system that finds and patches vulnerabilities, the kind of entry built for DARPA's AI Cyber Challenge.</dd>
</dl>
`},
{t:"Security Product Tooling & Standards", h:`
<h3>8.9 Software to Learn: Security Product Tooling &amp; Standards</h3>
<p class="lede">The tools and standards that appear inside real security products. Knowing the vocabulary lets you integrate with existing ecosystems, which both judges and customers reward.</p>
<dl class="terms">
<dt>SAST — Static Application Security Testing</dt><dd>Analyzing source code for vulnerabilities without running it; tools include Semgrep, CodeQL, Bandit, and SonarQube.</dd>
<dt>DAST — Dynamic Application Security Testing</dt><dd>Testing a running application from outside; OWASP ZAP and Nuclei are common open-source choices.</dd>
<dt>SCA — Software Composition Analysis</dt><dd>Finding known-vulnerable third-party components; examples include Trivy, Grype, OWASP Dependency-Check, and Dependabot.</dd>
<dt>IAST — Interactive Application Security Testing</dt><dd>Instrumenting an app during testing to observe vulnerabilities from inside.</dd>
<dt>Semgrep</dt><dd>A fast pattern-based code scanner whose rules are easy to write; a great way to demonstrate custom detection quickly.</dd>
<dt>CodeQL</dt><dd>A query language and engine that treats code as data to find vulnerability patterns.</dd>
<dt>Nuclei</dt><dd>A template-driven vulnerability scanner with a large community template library.</dd>
<dt>Trivy / Grype / Syft</dt><dd>Scanners for container images and dependencies (Trivy, Grype) and a generator of software bills of materials (Syft).</dd>
<dt>SBOM — Software Bill of Materials</dt><dd>A machine-readable inventory of the components in software, in formats such as SPDX and CycloneDX.</dd>
<dt>SLSA / Sigstore / cosign</dt><dd>A framework for software supply-chain integrity levels and open tools for signing and verifying build artifacts.</dd>
<dt>gitleaks / trufflehog</dt><dd>Scanners that find secrets committed to git history.</dd>
<dt>OPA / Rego</dt><dd>Open Policy Agent and its policy language for expressing and enforcing rules as code.</dd>
<dt>Falco</dt><dd>Runtime security tool detecting suspicious behavior in containers and Kubernetes.</dd>
<dt>osquery</dt><dd>Exposes a machine's state as SQL tables so you can query endpoints like a database.</dd>
<dt>Velociraptor</dt><dd>An endpoint visibility and digital-forensics collection platform used in incident response.</dd>
<dt>Zeek</dt><dd>A network analysis framework that turns traffic into rich, structured logs.</dd>
<dt>Suricata / Snort</dt><dd>Open-source network intrusion detection and prevention engines driven by rules.</dd>
<dt>Wazuh / Security Onion / Elastic Security</dt><dd>Open-source security monitoring platforms combining log collection, detection, and dashboards.</dd>
<dt>Sigma</dt><dd>A vendor-neutral format for writing detection rules that can be converted to many SIEM query languages.</dd>
<dt>YARA</dt><dd>A rule language for identifying malware and files by patterns in their content.</dd>
<dt>STIX / TAXII</dt><dd>Standard formats and transport for sharing structured cyber-threat intelligence.</dd>
<dt>MISP / OpenCTI</dt><dd>Open-source platforms for storing, correlating, and sharing threat intelligence.</dd>
<dt>TheHive / Cortex</dt><dd>Open-source case-management and analysis-automation tools for incident response teams.</dd>
<dt>Shuffle / n8n</dt><dd>Workflow-automation platforms used to build SOAR-style playbooks.</dd>
<dt>Prometheus / OpenTelemetry / Loki</dt><dd>Metrics, tracing, and log tooling for observing your own system; also a source of security signals.</dd>
<dt>HashiCorp Vault / SOPS / KMS</dt><dd>Systems for storing secrets and managing encryption keys properly.</dd>
<dt>OAuth 2.0 / OpenID Connect</dt><dd>Standards for delegated authorization and federated login; you will integrate with these constantly.</dd>
<dt>SAML / SCIM</dt><dd>Enterprise single sign-on protocol and user-provisioning standard that large customers expect.</dd>
<dt>WebAuthn / FIDO2 / Passkeys</dt><dd>Phishing-resistant, public-key-based login standards replacing passwords.</dd>
<dt>mTLS — Mutual TLS</dt><dd>TLS where both client and server present certificates, common for service-to-service trust.</dd>
<dt>Zero Trust / ZTNA</dt><dd>A model that never trusts by network location and verifies every request, and zero-trust network access products built on it.</dd>
<dt>CNAPP / CSPM</dt><dd>Cloud-native application protection platforms and cloud security posture management, the umbrella categories for cloud misconfiguration products.</dd>
<dt>SOAR playbook</dt><dd>An automated, scripted response workflow triggered by an alert.</dd>
<dt>EPSS + CVSS + KEV prioritization</dt><dd>Combining severity (CVSS), likelihood (EPSS), and confirmed exploitation (KEV) to decide what to fix first.</dd>
<dt>NVD API</dt><dd>Programmatic access to CVE data enriched with severity and affected-product information.</dd>
<dt>MITRE ATT&amp;CK Navigator / STIX data</dt><dd>Tools and machine-readable data for mapping detections and findings to ATT&amp;CK techniques.</dd>
<dt>Burp Suite / OWASP ZAP extensions</dt><dd>Plug-in ecosystems for extending web testing tools.</dd>
</dl>
`},
{t:"Business & Product Terms (Mini-MBA)", h:`
<h3>8.10 Business &amp; Product Terms (Mini-MBA)</h3>
<p class="lede">The vocabulary of building and selling a technology product. Chapter 7 explains how these ideas fit together.</p>
<dl class="terms">
<dt>MVP — Minimum Viable Product</dt><dd>The smallest version that delivers real value and lets you learn from real users.</dd>
<dt>PMF — Product-Market Fit</dt><dd>The state where a product clearly satisfies a market need; customers pull it from you rather than you pushing it.</dd>
<dt>ICP — Ideal Customer Profile</dt><dd>A precise description of the type of customer that gets the most value and is easiest to win.</dd>
<dt>JTBD — Jobs To Be Done</dt><dd>A framework viewing products as hired to make progress in a specific situation.</dd>
<dt>Persona</dt><dd>A representative description of a user or buyer type, including goals and fears.</dd>
<dt>Value proposition</dt><dd>The specific benefit a customer gets and why it beats alternatives.</dd>
<dt>Positioning</dt><dd>How you want customers to place your product relative to alternatives.</dd>
<dt>Wedge</dt><dd>A narrow, painful use case that gets you into an account or market before you expand.</dd>
<dt>Moat</dt><dd>A durable advantage that makes the business hard to copy or displace.</dd>
<dt>TAM / SAM / SOM</dt><dd>Total addressable market, the serviceable part you could reach, and the realistically obtainable share.</dd>
<dt>GTM — Go-To-Market</dt><dd>The plan for reaching, convincing, and selling to customers.</dd>
<dt>PLG / SLG</dt><dd>Product-led growth, where the product drives adoption, versus sales-led growth, where a sales team does.</dd>
<dt>Land and expand</dt><dd>Win a small initial deployment, then grow usage inside the account.</dd>
<dt>Channel partner / reseller / VAR</dt><dd>A third party that sells or bundles your product, often for a margin.</dd>
<dt>MSP / MSSP / MDR</dt><dd>Managed service provider, managed security service provider, and managed detection and response — companies that run IT or security for customers.</dd>
<dt>OEM</dt><dd>Selling your technology to be embedded in another company's product.</dd>
<dt>Pilot / POC — Proof of Concept</dt><dd>A time-boxed trial with agreed success criteria before a customer buys.</dd>
<dt>Design partner</dt><dd>An early customer who helps shape the product in exchange for early access.</dd>
<dt>Freemium / open core</dt><dd>Free tier or free open-source core with paid advanced features.</dd>
<dt>MRR / ARR</dt><dd>Monthly and annual recurring revenue.</dd>
<dt>ARPA / ARPU</dt><dd>Average revenue per account or per user.</dd>
<dt>CAC — Customer Acquisition Cost</dt><dd>Sales and marketing spend divided by new customers won.</dd>
<dt>LTV — Lifetime Value</dt><dd>The gross profit a customer is expected to generate before leaving.</dd>
<dt>Churn / GRR / NRR</dt><dd>Customer loss rate, gross revenue retention, and net revenue retention including expansion.</dd>
<dt>Gross margin</dt><dd>Revenue minus the direct cost of delivering the product, as a share of revenue.</dd>
<dt>Unit economics</dt><dd>The profit or loss attributable to a single customer or unit sold.</dd>
<dt>CAC payback</dt><dd>Months of gross profit needed to earn back the cost of acquiring a customer.</dd>
<dt>Burn rate / runway</dt><dd>Monthly net cash loss and the number of months until cash runs out.</dd>
<dt>Burn multiple</dt><dd>Net burn divided by net new recurring revenue; a measure of growth efficiency.</dd>
<dt>Rule of 40</dt><dd>A heuristic that growth rate plus profit margin should total at least 40%.</dd>
<dt>Bootstrapping</dt><dd>Funding the company from revenue or personal funds rather than outside investment.</dd>
<dt>SAFE / convertible note</dt><dd>Simple instruments that let investors fund a company now and convert to equity in a later priced round.</dd>
<dt>Cap table</dt><dd>A record of who owns how much of the company.</dd>
<dt>ESOP / option pool</dt><dd>Shares reserved to compensate employees.</dd>
<dt>Dilution</dt><dd>The reduction in an owner's percentage as new shares are issued.</dd>
<dt>Term sheet / due diligence</dt><dd>A non-binding summary of investment terms and the investigation that precedes closing.</dd>
<dt>Accelerator / incubator / TBI</dt><dd>Programs that support early companies; a TBI is a technology business incubator, often hosted by a university.</dd>
<dt>Demo day / pitch deck</dt><dd>The event at which startups present to investors and the slide deck used to do so.</dd>
<dt>KPI / OKR / North Star metric</dt><dd>Key performance indicators, objectives and key results, and the single metric best representing delivered value.</dd>
<dt>RICE / MoSCoW / Kano</dt><dd>Frameworks for prioritizing features.</dd>
<dt>AARRR</dt><dd>Pirate metrics: acquisition, activation, retention, referral, revenue.</dd>
<dt>Time to value</dt><dd>How long a new customer takes to get a first meaningful result.</dd>
<dt>Pivot</dt><dd>A deliberate change of direction based on what you learned.</dd>
<dt>Technical debt</dt><dd>The future cost of shortcuts taken now.</dd>
<dt>Lean Canvas / Business Model Canvas</dt><dd>One-page templates describing a business: customers, problem, solution, channels, revenue, costs.</dd>
<dt>Porter's five forces</dt><dd>A framework analyzing competitive rivalry, new entrants, suppliers, buyers, and substitutes.</dd>
<dt>SWOT / PESTLE</dt><dd>Frameworks for assessing internal strengths and weaknesses with external opportunities and threats, and for scanning broader environmental forces.</dd>
</dl>
`},
{t:"Compliance, Law & Governance", h:`
<h3>8.11 Compliance, Law &amp; Governance Terms</h3>
<p class="lede">The standards, laws, and governance concepts that security buyers ask about. Educational overview only, not legal advice.</p>
<dl class="terms">
<dt>GRC — Governance, Risk, and Compliance</dt><dd>The function and tooling for managing policies, risks, and audit evidence.</dd>
<dt>SOC 2</dt><dd>An audit report on a service provider's controls; Type I is a point-in-time design review and Type II covers operating effectiveness over a period.</dd>
<dt>ISO/IEC 27001</dt><dd>International standard for an information security management system.</dd>
<dt>PCI DSS — Payment Card Industry Data Security Standard</dt><dd>Requirements for organizations handling payment-card data.</dd>
<dt>HIPAA</dt><dd>US law governing the privacy and security of health information.</dd>
<dt>GDPR — General Data Protection Regulation</dt><dd>European regulation on personal data protection with significant penalties.</dd>
<dt>DPDP Act, 2023</dt><dd>India's Digital Personal Data Protection Act, governing consent, data-handling duties, and breach obligations.</dd>
<dt>CERT-In</dt><dd>India's national computer emergency response team, which issues directions including incident-reporting timelines.</dd>
<dt>IT Act, 2000</dt><dd>India's primary cyber law, covering offenses such as unauthorized access.</dd>
<dt>NIST CSF — Cybersecurity Framework</dt><dd>A voluntary framework organizing security outcomes into functions such as govern, identify, protect, detect, respond, and recover.</dd>
<dt>CIS Controls</dt><dd>A prioritized list of defensive actions for improving cyber hygiene.</dd>
<dt>DPA — Data Processing Agreement</dt><dd>A contract defining how a vendor handles a customer's personal data.</dd>
<dt>DPO — Data Protection Officer</dt><dd>The person responsible for overseeing data-protection compliance.</dd>
<dt>SLA — Service-Level Agreement</dt><dd>A contractual commitment on availability and response times.</dd>
<dt>VDP — Vulnerability Disclosure Policy</dt><dd>A public statement of how to report flaws safely and how you will respond.</dd>
<dt>CVD — Coordinated Vulnerability Disclosure</dt><dd>Working privately with a vendor to fix a flaw before publishing details.</dd>
<dt>Safe harbor</dt><dd>A promise not to pursue legal action against good-faith security researchers following the rules.</dd>
<dt>Data residency / sovereignty</dt><dd>Requirements that data be stored or processed in a specific country or region.</dd>
<dt>Data minimization</dt><dd>Collecting and keeping only the data needed for a stated purpose.</dd>
<dt>Cyber insurance / errors and omissions</dt><dd>Insurance covering breach costs and professional-liability claims.</dd>
<dt>Open-source licenses (MIT, Apache 2.0, GPL, AGPL)</dt><dd>Permissive licenses allow broad reuse; copyleft licenses require sharing derivative code under certain conditions.</dd>
<dt>Third-party / vendor risk</dt><dd>The risk introduced by suppliers; why buyers send security questionnaires.</dd>
<dt>Security questionnaire / trust center</dt><dd>Standard vendor-assessment forms and a public page publishing your security posture and documents.</dd>
<dt>Penetration-test report</dt><dd>An independent assessment summarizing attempted attacks and findings, often requested by buyers.</dd>
</dl>
`},
{t:"Hackathon & Pitch Terms", h:`
<h3>8.12 Hackathon &amp; Pitch Terms</h3>
<p class="lede">Event, judging, and presentation vocabulary used in chapters 5 and 6.</p>
<dl class="terms">
<dt>Rubric</dt><dd>The published list of judging criteria and sometimes weights; the first thing to read.</dd>
<dt>Golden path</dt><dd>The single, rehearsed end-to-end flow shown in a demo.</dd>
<dt>Feature freeze / code freeze</dt><dd>The point after which no new features (or any changes) are made so the team can polish and package.</dd>
<dt>Async judging</dt><dd>Judges review submissions on their own time using the page, video, and repo rather than a live pitch.</dd>
<dt>Quadratic voting</dt><dd>A voting method where the cost of additional votes on one option rises, used in some community-judged events.</dd>
<dt>Popular choice / audience award</dt><dd>A prize decided by community or audience vote separately from the main judging.</dd>
<dt>Sponsor track</dt><dd>A prize category tied to using a sponsor's platform or API.</dd>
<dt>Elevator pitch / one-liner</dt><dd>A thirty-second or one-sentence description of what you do and for whom.</dd>
<dt>Demo video</dt><dd>A two-to-three minute recorded walkthrough, often the first thing judges watch.</dd>
<dt>README</dt><dd>The repository front page; for judges it doubles as the product page.</dd>
<dt>PoC — Proof of Concept</dt><dd>A minimal implementation demonstrating that an idea is technically possible.</dd>
<dt>PoV — Proof of Vulnerability</dt><dd>Concrete evidence, often an input that triggers a bug, showing a finding is real; central to the DARPA AI Cyber Challenge scoring.</dd>
<dt>AIxCC — AI Cyber Challenge</dt><dd>A DARPA competition in which teams built autonomous systems to find and fix vulnerabilities in real software, finals held at DEF CON 33.</dd>
<dt>OSS-CRS</dt><dd>An open-source effort growing out of the AI Cyber Challenge winners to standardize cyber reasoning systems for real-world use.</dd>
<dt>RSAC Innovation Sandbox</dt><dd>A long-running pitch competition for early-stage security startups at the RSA Conference.</dd>
<dt>Nullcon Startville</dt><dd>A security-product showcase at the Nullcon conference where selected companies demo to judges.</dd>
<dt>Smart India Hackathon</dt><dd>A large national hackathon in which government bodies and industry post problem statements for student teams to solve.</dd>
<dt>Write-up</dt><dd>A documented explanation of how a challenge or project was solved; often required and sometimes scored.</dd>
<dt>Q&amp;A bank</dt><dd>A prepared list of likely judge questions with rehearsed answers.</dd>
<dt>Backup demo</dt><dd>A recorded or offline version of the demo used when the live version fails.</dd>
</dl>
`},
  ]
},
];

const EXTRA = {"1": {"t": "Worked Methodology: Subnetting and Detecting ARP Spoofing", "h": "<h3>1.7 Worked Methodology: Subnetting and Detecting ARP Spoofing</h3>\n<p class=\"lede\">A working chapter: objectives, a worked example you can run in a lab you own, the mistakes that cost points, and exercises.</p>\n<h4>Learning objectives</h4><ul><li>Compute network, broadcast and host range from any CIDR block by hand.</li><li>Write a detector for a Layer 2 attack and state what it cannot catch.</li></ul>\n<h4>Worked example</h4><p><b>Subnetting by hand.</b> Given <code>10.4.7.130/26</code>: 32 &minus; 26 = 6 host bits, so each block has 2<sup>6</sup> = 64 addresses. Blocks start at multiples of 64 in the last octet (0, 64, 128, 192), so .130 sits in the block starting at <code>10.4.7.128</code>. Broadcast is <code>10.4.7.191</code>, usable hosts are .129 to .190 (62 hosts). Use this to size an nmap scan: <code>nmap -sn 10.4.7.128/26</code>.</p>\n<p><b>ARP spoof detector.</b> ARP replies are unauthenticated, so an attacker claims another host's IP with their own MAC. A simple defence is to remember the first MAC seen for each IP and alert on change:</p>\n<pre><code>from scapy.all import sniff, ARP\nseen = {}\ndef check(p):\n    if p.haslayer(ARP) and p[ARP].op == 2:      # ARP reply\n        ip, mac = p[ARP].psrc, p[ARP].hwsrc\n        if ip in seen and seen[ip] != mac:\n            print(f\"ALERT {ip}: {seen[ip]} -> {mac}\")\n        seen.setdefault(ip, mac)\nsniff(filter=\"arp\", prn=check, store=0)</code></pre>\n<p>Test in a lab: run an ARP spoofing tool between two VMs you own and confirm the alert fires. <b>Limits:</b> a legitimate NIC replacement or failover looks identical to an attack (false positive), and an attacker present before the detector starts poisons the baseline (false negative). Stating these limits is what separates a project from a demo.</p>\n<h4>Common mistakes</h4><ul><li>Scanning networks you do not own or have written permission to test.</li><li>Reporting open ports without saying what service runs there and why it matters.</li><li>Claiming a detector works without measuring false alarms on normal traffic.</li></ul>\n<h4>Exercises</h4><ol><li>How many hosts are in <code>172.16.40.0/21</code>? (Answer: 2046 usable.)</li><li>Capture a TCP handshake in Wireshark and label SYN, SYN-ACK, ACK with sequence numbers.</li><li>Extend the detector to also flag a gateway MAC change and log to a file with timestamps.</li></ol>"}, "2": {"t": "Worked Methodology: Testing and Fixing Broken Access Control", "h": "<h3>2.7 Worked Methodology: Testing and Fixing Broken Access Control</h3>\n<p class=\"lede\">A working chapter: objectives, a worked example you can run in a lab you own, the mistakes that cost points, and exercises.</p>\n<h4>Learning objectives</h4><ul><li>Test authorization by replaying one user's request as another user.</li><li>Fix injection and access-control bugs at the root, not with filters.</li></ul>\n<h4>Worked example</h4><p><b>IDOR test.</b> Broken access control is the top OWASP 2021 category. Log in as two normal users, then request one user's object with the other's token:</p>\n<pre><code>import requests\nA = {\"Authorization\": \"Bearer ALICE_TOKEN\"}\nB = {\"Authorization\": \"Bearer BOB_TOKEN\"}\nurl = \"https://lab.local/api/orders/1001\"       # Alice's order\nprint(requests.get(url, headers=A).status_code)  # expect 200\nprint(requests.get(url, headers=B).status_code)  # expect 403 or 404, a 200 is a bug</code></pre>\n<p><b>Fix at the root.</b> Enforce ownership in the data query and use parameters, never string concatenation:</p>\n<pre><code>cur.execute(\"SELECT id, total FROM orders WHERE id = %s AND owner_id = %s\",\n            (order_id, current_user.id))</code></pre>\n<p>Retest after the fix and keep both results as before/after evidence. For XSS, encode output for its context (HTML, attribute, JavaScript) and add a Content-Security-Policy as a second layer.</p>\n<h4>Common mistakes</h4><ul><li>Trusting hidden form fields, cookies or client-side checks for authorization.</li><li>Running a scanner against a live site you do not own.</li><li>Fixing one endpoint and missing the same flaw on sibling endpoints (check every HTTP method).</li></ul>\n<h4>Exercises</h4><ol><li>List every endpoint of a lab app and build a table of role versus allowed action; test each cell.</li><li>Why does a parameterised query stop SQL injection but not an IDOR?</li><li>Write a regression test that fails on the vulnerable code and passes after the fix.</li></ol>"}, "3": {"t": "Worked Methodology: Authenticated Encryption and a Reversing Workflow", "h": "<h3>3.6 Worked Methodology: Authenticated Encryption and a Reversing Workflow</h3>\n<p class=\"lede\">A working chapter: objectives, a worked example you can run in a lab you own, the mistakes that cost points, and exercises.</p>\n<h4>Learning objectives</h4><ul><li>Use an AEAD correctly and explain what nonce reuse breaks.</li><li>Follow a repeatable workflow in Ghidra to solve a small crackme.</li></ul>\n<h4>Worked example</h4><p><b>Never invent your own cipher.</b> Use a vetted AEAD, which gives confidentiality and tamper detection together:</p>\n<pre><code>from cryptography.hazmat.primitives.ciphers.aead import AESGCM\nimport os\nkey = AESGCM.generate_key(bit_length=256)\naes = AESGCM(key)\nnonce = os.urandom(12)                       # unique per message under one key\nct = aes.encrypt(nonce, b\"secret\", b\"header\")  # header is authenticated, not encrypted\npt = aes.decrypt(nonce, ct, b\"header\")         # raises InvalidTag if anything changed</code></pre>\n<p>Reusing a nonce with the same key in GCM lets an attacker XOR two ciphertexts to get the XOR of the plaintexts and can expose the authentication key, so store the nonce next to the ciphertext and never reuse it. For passwords use a slow salted hash such as Argon2 (<code>argon2-cffi</code>: <code>PasswordHasher().hash(pw)</code>), not SHA-256.</p>\n<p><b>Ghidra workflow.</b> (1) Import the binary and run auto-analysis. (2) Open Defined Strings and find messages such as \"Correct\" or \"Wrong\". (3) Follow cross-references to the function using them. (4) Read the decompiler output and rename variables as you understand them. (5) Find the comparison that decides success and work backwards to what input satisfies it. Verify in a debugger (gdb) before you trust your reading.</p>\n<h4>Common mistakes</h4><ul><li>Using ECB mode, a fixed IV or a key derived directly from a short password.</li><li>Storing keys in the repository or a hard-coded constant.</li><li>Reversing without running the program in an isolated VM first.</li></ul>\n<h4>Exercises</h4><ol><li>Encrypt the same image with AES-ECB and AES-GCM and compare; explain the difference.</li><li>What happens to decryption if one byte of <code>ct</code> is changed? Why is that desirable?</li><li>Write a crackme in C that compares input to a transformed constant, then solve a classmate's.</li></ol>"}, "4": {"t": "Worked Methodology: Live Triage, Memory Analysis and YARA", "h": "<h3>4.6 Worked Methodology: Live Triage, Memory Analysis and YARA</h3>\n<p class=\"lede\">A working chapter: objectives, a worked example you can run in a lab you own, the mistakes that cost points, and exercises.</p>\n<h4>Learning objectives</h4><ul><li>Run an ordered triage on a Linux host and record evidence safely.</li><li>Use memory forensics and a YARA rule to find malicious code.</li></ul>\n<h4>Worked example</h4><p><b>Linux triage order</b> (most volatile first): running processes and network, then users and persistence, then files and logs.</p>\n<pre><code>ps auxf                                  # process tree, look for odd parents\nss -tulpn                                # listening ports and owning processes\nlast -a | head                           # recent logins\ncrontab -l; ls /etc/cron.*               # scheduled persistence\nfind / -perm -4000 -type f 2>/dev/null   # SUID files, privilege escalation candidates\njournalctl -u ssh --since \"1 hour ago\"   # authentication activity</code></pre>\n<p><b>Memory analysis</b> with Volatility 3 on a Windows image: <code>vol -f mem.raw windows.pslist</code> lists processes, <code>windows.netscan</code> shows connections, <code>windows.malfind</code> flags injected executable memory. Compare process names against the expected parent (for example, <code>svchost.exe</code> should be a child of <code>services.exe</code>).</p>\n<p><b>YARA</b> matches patterns in files or memory:</p>\n<pre><code>rule demo_dropper {\n  strings: $a = \"cmd.exe /c\" ascii  $b = { 4D 5A 90 00 }\n  condition: $b at 0 and $a\n}</code></pre>\n<p>Record hashes of every artifact (<code>sha256sum</code>), keep a timeline with timestamps in UTC, and write findings as: what was seen, where, and how confident you are.</p>\n<h4>Common mistakes</h4><ul><li>Rebooting or cleaning a compromised machine before collecting evidence.</li><li>Running unknown samples outside an isolated, snapshotted VM.</li><li>Mixing time zones in a timeline.</li></ul>\n<h4>Exercises</h4><ol><li>Build a one-line-per-event timeline from <code>auth.log</code> for a brute-force login.</li><li>Write a YARA rule for a benign test file of your own and test for false positives on system files.</li><li>Explain why a process named <code>svchost.exe</code> started from a user folder is suspicious.</li></ol>"}, "5": {"t": "Worked Methodology: Detection Engineering and Cloud Misconfiguration", "h": "<h3>5.6 Worked Methodology: Detection Engineering and Cloud Misconfiguration</h3>\n<p class=\"lede\">A working chapter: objectives, a worked example you can run in a lab you own, the mistakes that cost points, and exercises.</p>\n<h4>Learning objectives</h4><ul><li>Write a detection rule and measure it with precision and recall.</li><li>Automate a cloud misconfiguration check.</li></ul>\n<h4>Worked example</h4><p><b>Sigma rule</b> (portable detection format) for encoded PowerShell:</p>\n<pre><code>title: Suspicious PowerShell Encoded Command\nstatus: experimental\nlogsource: {category: process_creation, product: windows}\ndetection:\n  selection:\n    Image|endswith: '\\powershell.exe'\n    CommandLine|contains: ' -enc'\n  condition: selection\nfalsepositives: [Admin automation scripts]\nlevel: medium</code></pre>\n<p><b>Measure it.</b> Replay labelled events (malicious and normal). Precision = TP / (TP + FP) tells how many alerts are real; recall = TP / (TP + FN) tells how many attacks you caught. A rule with high recall and poor precision burns analyst time, so tune it and report both numbers. Map each rule to a MITRE ATT&amp;CK technique to show coverage and gaps.</p>\n<p><b>Cloud check</b> for S3 buckets missing a public-access block:</p>\n<pre><code>import boto3, botocore\ns3 = boto3.client(\"s3\")\nfor b in s3.list_buckets()[\"Buckets\"]:\n    try:\n        cfg = s3.get_public_access_block(Bucket=b[\"Name\"])[\"PublicAccessBlockConfiguration\"]\n        if not all(cfg.values()): print(\"PARTIAL\", b[\"Name\"])\n    except botocore.exceptions.ClientError as e:\n        if e.response[\"Error\"][\"Code\"] == \"NoSuchPublicAccessBlockConfiguration\":\n            print(\"NO BLOCK\", b[\"Name\"])</code></pre>\n<p>Run it only on an account you own, and pair each finding with a fix and its risk.</p>\n<h4>Common mistakes</h4><ul><li>Reporting alert counts instead of precision and recall.</li><li>Giving cloud scanners admin credentials; use a read-only role.</li><li>Letting an LLM triage alerts without a labelled test set to measure it.</li></ul>\n<h4>Exercises</h4><ol><li>Write a second Sigma rule for a failed-login burst and list its likely false positives.</li><li>Compute precision and recall for 40 alerts: 30 real, 10 false, 15 real attacks missed.</li><li>Add an IAM check for users without MFA to the cloud scanner.</li></ol>"}};
DATA.forEach(c=>{ if(EXTRA[c.id]) c.subs.push(EXTRA[c.id]); });
const LEVEL_NAMES = {"1":"Networking","2":"Web","3":"Crypto & Reverse Engineering","4":"Systems, Forensics & Malware","5":"Defense, Cloud & DevSecOps"};
["1","2","3","4","5"].forEach(k=>{
  if(LEVELS[k]) DATA.find(c=>c.id===6).subs.push({t:"Hackathon Level Guide: "+LEVEL_NAMES[k], h:LEVELS[k]});
});
const DESC = {
 1:"How data moves across networks, how to observe it, and how each layer is attacked and defended.",
 2:"How web applications and APIs fail, how to test them methodically, and how to fix them.",
 3:"How cryptography is built and broken, plus the basics of reverse engineering and binary exploitation.",
 4:"Linux and Windows security, forensics, steganography, OSINT and malware analysis.",
 5:"Blue-team operations, cloud and DevSecOps, secure coding and threat modelling.",
 6:"How judges score, how to choose a problem, show technical depth, and deliver the demo.",
 7:"Who buys security products and why: markets, pricing, go-to-market, compliance, strategy and funding.",
 8:"Terms, tools and standards for building and presenting a security product."};
const GROUPS = [
 {id:'common', label:'1. Common core', small:'Everyone reads: product building with guides, business & glossary.', ids:[6,7,8], tag:'Common'},
 {id:'spec', label:'2. Specialisations', small:'Choose one each: chapters 1 to 5', ids:[1,2,3,4,5], tag:'Track'}];
const groupNav=document.getElementById('groupNav'), chunkNav=document.getElementById('chunkNav'), container=document.getElementById('chunkContainer');
groupNav.setAttribute('role','tablist'); chunkNav.setAttribute('role','tablist');
let cur={g:0,c:0,s:0};
const byId=id=>DATA.findIndex(d=>d.id===id);
const groupOf=ci=>GROUPS.findIndex(g=>g.ids.includes(DATA[ci].id));

GROUPS.forEach((g,gi)=>{
  const b=document.createElement('button'); b.setAttribute('role','tab'); b.id='g-'+gi;
  b.innerHTML=`${g.label}<small>${g.small}</small>`; b.onclick=()=>go(byId(g.ids[0]),0); groupNav.appendChild(b);
});
const order=[...GROUPS[0].ids,...GROUPS[1].ids].map(byId);
order.forEach(ci=>{
  const chunk=DATA[ci], gi=groupOf(ci), isG=chunk.isGlossary;
  const btn=document.createElement('button'); btn.setAttribute('role','tab'); btn.id='nav-'+ci; btn.dataset.g=gi;
  btn.setAttribute('aria-controls','chunk-'+ci);
  const dispNum = isG ? '§' : String(GROUPS[gi].ids.indexOf(chunk.id)+1).padStart(2,'0');
  btn.innerHTML=`<span class="n">${dispNum}</span>${chunk.title}`;
  btn.onclick=()=>go(ci,0); chunkNav.appendChild(btn);

  const section=document.createElement('section'); section.className='chunk'; section.id='chunk-'+ci;
  section.setAttribute('aria-labelledby','h-'+ci);
  const head=document.createElement('div'); head.className='chunk-head';
  head.innerHTML=`<div><h2 id="h-${ci}">${isG?'':dispNum+'. '}${chunk.title}</h2><p>${DESC[chunk.id]||chunk.desc}</p></div>`;
  section.appendChild(head);
  if(isG){
    const s=document.createElement('input'); s.type='search'; s.className='glos-search';
    s.setAttribute('aria-label','Filter glossary terms on this page'); s.placeholder='Filter terms on this page (e.g. RSA, spoof, cloud)';
    s.oninput=()=>filterGlossary(ci,s.value); section.appendChild(s);
  }
  const subnav=document.createElement('div'); subnav.className='subnav'; subnav.setAttribute('role','tablist');
  subnav.setAttribute('aria-label',chunk.title+' topics'); section.appendChild(subnav);
  const sc=document.createElement('div'); section.appendChild(sc);
  chunk.subs.forEach((sub,si)=>{
    const sb=document.createElement('button'); sb.setAttribute('role','tab'); sb.id=`subnav-${ci}-${si}`;
    sb.setAttribute('aria-controls',`sub-${ci}-${si}`); sb.textContent=dispNum+'.'+(si+1)+' '+sub.t;
    sb.onclick=()=>go(ci,si); subnav.appendChild(sb);
    const art=document.createElement('article'); art.className='subpage'; art.id=`sub-${ci}-${si}`;
    art.setAttribute('role','tabpanel'); art.setAttribute('aria-labelledby',sb.id); art.tabIndex=0; art.innerHTML=sub.h; sc.appendChild(art);
  });
  container.appendChild(section);
});
function go(ci,si,noHash){
  const gi=groupOf(ci); cur={g:gi,c:ci,s:si};
  GROUPS.forEach((_,i)=>groupNav.children[i].setAttribute('aria-selected',i===gi));
  order.forEach(i=>{
    const b=document.getElementById('nav-'+i), on=i===ci;
    b.hidden = groupOf(i)!==gi; b.classList.toggle('active',on); b.setAttribute('aria-selected',on); b.tabIndex=on?0:-1;
    document.getElementById('chunk-'+i).classList.toggle('active',on);
  });
  DATA[ci].subs.forEach((_,i)=>{
    const on=i===si, sb=document.getElementById(`subnav-${ci}-${i}`);
    document.getElementById(`sub-${ci}-${i}`).classList.toggle('active',on);
    sb.classList.toggle('active',on); sb.setAttribute('aria-selected',on); sb.tabIndex=on?0:-1;
  });
  GROUPS.forEach((_,i)=>groupNav.children[i].tabIndex=i===gi?0:-1);
  if(!noHash){ try{ history.replaceState(null,'','#c'+DATA[ci].id+'-'+(si+1)); }catch(e){} }
}
function keys(list){
  list.addEventListener('keydown',e=>{
    const t=[...list.querySelectorAll('[role=tab]')].filter(x=>!x.hidden); const i=t.indexOf(document.activeElement);
    if(i<0) return; let n=null;
    if(e.key==='ArrowRight') n=(i+1)%t.length; else if(e.key==='ArrowLeft') n=(i-1+t.length)%t.length;
    else if(e.key==='Home') n=0; else if(e.key==='End') n=t.length-1;
    if(n!==null){e.preventDefault(); t[n].focus(); t[n].click();}
  });
}
keys(groupNav); keys(chunkNav); document.querySelectorAll('.subnav').forEach(keys);
function filterGlossary(ci,q){
  q=q.trim().toLowerCase();
  const art=document.querySelector(`#chunk-${ci} article.active`); if(!art) return;
  art.querySelectorAll('dt').forEach(dt=>{
    const dd=dt.nextElementSibling, show=q===''||(dt.textContent+' '+(dd?dd.textContent:'')).toLowerCase().includes(q);
    dt.style.display=show?'':'none'; if(dd) dd.style.display=show?'':'none';
  });
}
(function(){ let h=''; try{h=location.hash;}catch(e){} const m=h.match(/^#c(\d+)-(\d+)$/); let ci=m?byId(+m[1]):byId(6), si=m?+m[2]-1:0;
  if(ci<0||!DATA[ci].subs[si]){ci=byId(6);si=0;} go(ci,si,true); })();
