  subs:[
{t:"Blue Team & SOC Fundamentals", h:`
<h3>5.1 Blue Team & SOC Fundamentals</h3>
<p class="lede">Everything in this knowledge base so far has been mostly offense-flavored. Blue team is the discipline of detecting, responding to, and recovering from exactly those techniques — and it rewards process and documentation as much as technical skill.</p>

<h4>The SOC and SIEM</h4>
<p>A <b>SOC (Security Operations Center)</b> is the team (and often physical/virtual space) responsible for continuously monitoring an organization's systems for security events. Its central tool is typically a <b>SIEM (Security Information and Event Management)</b> platform, which aggregates logs from every corner of the environment — firewalls, endpoints, applications, authentication systems — into one searchable, correlatable place, since an attack is often only visible as a <i>pattern</i> spread across multiple separate log sources that look unremarkable individually. Splunk is the dominant commercial platform; the <b>ELK stack (Elasticsearch, Logstash, Kibana)</b> and <b>Wazuh</b> are the common free/open-source choices and the ones most hackathon blue-team tracks are actually built around.</p>

<h4>The Incident Response lifecycle (PICERL)</h4>
<p>Incident response follows a well-established six-phase model, commonly remembered by the acronym <b>PICERL</b> — expect judges in a blue-team or DFIR track to ask you to map your actions onto this model directly:</p>
<ol>
<li><b>Preparation:</b> everything done <i>before</i> an incident — logging coverage, having playbooks ready, backups, trained staff. The single highest-leverage phase, since it's the only one that happens on your own schedule rather than under pressure.</li>
<li><b>Identification:</b> determining that an incident is actually happening, and scoping what's affected.</li>
<li><b>Containment:</b> stopping the incident from spreading further — often split into short-term containment (isolate the affected system immediately) and long-term containment (apply a more durable fix while investigation continues).</li>
<li><b>Eradication:</b> removing the actual root cause — the malware, the unauthorized account, the vulnerable code path.</li>
<li><b>Recovery:</b> safely restoring affected systems to normal operation and monitoring closely for any sign of recurrence.</li>
<li><b>Lessons Learned:</b> a post-incident review of what happened, what worked, and what should change — feeding directly back into improving the Preparation phase next time.</li>
</ol>

<h4>MITRE ATT&CK</h4>
<p><b>MITRE ATT&CK (Adversarial Tactics, Techniques, and Common Knowledge)</b> is a publicly maintained, continuously updated knowledge base that catalogs real-world attacker behavior as a structured matrix of <b>tactics</b> (the attacker's goal at a given stage, e.g. "Initial Access," "Privilege Escalation," "Exfiltration") and, within each tactic, specific <b>techniques</b> (the concrete method used, each with a reference ID like <code>T1059</code> for "Command and Scripting Interpreter"). Mapping a finding to its ATT&CK technique ID is the standard professional way to communicate what happened precisely and unambiguously — doing this in a hackathon report instantly signals familiarity with how real security teams actually talk to each other.</p>

<h4>Threat intelligence: IOCs vs TTPs</h4>
<p>Section 4.5 introduced <b>IOCs (Indicators of Compromise)</b> — concrete, specific artifacts like a file hash or a malicious IP address. <b>TTPs (Tactics, Techniques, and Procedures)</b> describe the attacker's <i>behavior and methodology</i> at a more abstract level — "this group consistently uses phishing emails with macro-enabled documents, followed by a specific privilege-escalation chain." IOCs are easy for an attacker to change (a new IP, a recompiled binary with a different hash) and therefore go stale quickly; TTPs describe deeper behavioral patterns that are far more expensive for an attacker to change, making TTP-based detection more durable over time — this is the core insight behind the oft-repeated security maxim "detect behaviors, not just signatures."</p>
<h4>Reading a SIEM alert like an analyst</h4>
<p>A raw alert ("process creation: powershell.exe -enc ...") is only the start. Triage follows a consistent sequence: confirm the alert is real (pull the raw log, not just the summary), establish scope (which host, which user, what time), check whether the behaviour has a legitimate explanation (an admin script scheduled for that exact time), and only then escalate. Analysts who skip straight to "this looks bad, escalate" without this sequence generate the alert fatigue that causes real incidents to get missed in the noise.</p>
<h4>PICERL, with what actually happens at each stage</h4>
<table><tr><th scope="col">Stage</th><th scope="col">Core question</th><th scope="col">Typical action</th></tr>
<tr><td>Preparation</td><td>Are we ready before anything happens?</td><td>Playbooks, backups, logging coverage, trained team</td></tr>
<tr><td>Identification</td><td>Did something actually happen?</td><td>Alert triage, confirm scope</td></tr>
<tr><td>Containment</td><td>Stop it from getting worse, without destroying evidence</td><td>Network-isolate the host, disable the account — not "wipe immediately"</td></tr>
<tr><td>Eradication</td><td>Remove the cause, not just the symptom</td><td>Patch the vulnerability, remove the malware and its persistence</td></tr>
<tr><td>Recovery</td><td>Return to normal operation safely</td><td>Restore from a known-clean backup, monitor closely afterward</td></tr>
<tr><td>Lessons learned</td><td>Why did this work, and what changes?</td><td>Post-incident review, update playbooks</td></tr></table>
<p>Containment before eradication matters: wiping a compromised host immediately destroys the evidence needed to understand how the attacker got in, which means you patch the symptom and get breached the same way again.</p>
<h4>IOCs vs TTPs, and why TTPs matter more long-term</h4>
<p>An IOC (a specific file hash, IP address, domain) is cheap for an attacker to change — one new build invalidates every hash-based detection you had. A TTP (how they move laterally, how they establish persistence, what tools they favour) is far more expensive for an attacker to change, since it reflects their actual tradecraft. This is why mature detection engineering (as in chapter 5.6) targets behaviour and technique, mapped to MITRE ATT&CK, rather than chasing an ever-changing list of indicators.</p>
`},

{t:"Cloud & DevSecOps Security", h:`
<h3>5.2 Cloud & DevSecOps Security</h3>
<p class="lede">As infrastructure has moved to the cloud and software delivery has shifted to continuous, automated pipelines, a distinct set of risks has emerged that barely existed a decade ago, built around identity, misconfiguration, and automation trust rather than classic network perimeters.</p>

<h4>Misconfiguration is the #1 cloud risk</h4>
<p>Unlike a traditional on-premises server, cloud resources are provisioned through a web of permission and configuration settings that are extremely easy to get subtly wrong at scale — and a single misconfigured setting can expose an entire dataset:</p>
<ul>
<li><b>Public storage buckets:</b> AWS S3 buckets (or Azure Blob Storage, Google Cloud Storage) left with public read/write access have caused an enormous share of real-world large-scale data breaches — it's a one-checkbox mistake with catastrophic consequences.</li>
<li><b>Overly permissive IAM (Identity and Access Management) policies:</b> granting a role or user blanket <code>"Action": "*", "Resource": "*"</code> permissions violates the <b>principle of least privilege</b> (grant only the exact access needed, nothing more) and means any single compromised credential or service effectively compromises the entire cloud account.</li>
<li><b>Open security groups:</b> a security group rule allowing <code>0.0.0.0/0</code> (meaning "any IP address on the entire internet") on a sensitive port like SSH, RDP, or a database port exposes that service to the whole internet rather than only the intended internal network.</li>
</ul>

<h4>SSRF to cloud credential theft</h4>
<p>Every major cloud provider exposes an <b>instance metadata service</b> at a fixed, non-routable address (<code>169.254.169.254</code>) reachable only from inside the instance itself, used by the instance to retrieve its own configuration — critically including temporary IAM credentials for whatever role the instance has been assigned. An SSRF vulnerability (2.4) in an application running on that instance lets an attacker reach this address <i>through</i> the vulnerable app and steal those live credentials, often escalating a web bug directly into full control over cloud resources the application itself was never supposed to touch. Modern defenses include <b>IMDSv2</b> (AWS's session-oriented metadata protocol requiring a request header that's much harder for a typical SSRF to replicate) and network-level egress restrictions.</p>

<h4>Container and Kubernetes security</h4>
<p>Containers (Docker) package an application with its dependencies for consistent deployment, but share the host machine's kernel — meaning a container-escape vulnerability can potentially compromise the underlying host itself. Core hygiene: never run a container process as root unless genuinely required, avoid the <code>--privileged</code> flag (which disables most of Docker's isolation), and scan container images for known-vulnerable base-layer packages (<code>trivy</code> is the standard open-source scanner for this). <b>Kubernetes</b>, the dominant container-orchestration platform, adds its own attack surface: an exposed <code>kubelet</code> API or Kubernetes API server with weak authentication, overly broad <b>RBAC (Role-Based Access Control)</b> bindings, and secrets stored as plaintext environment variables rather than through Kubernetes' dedicated (though still imperfect) Secrets mechanism.</p>

<h4>CI/CD pipeline security</h4>
<p><b>CI/CD (Continuous Integration/Continuous Deployment)</b> pipelines automatically build, test, and deploy code — and because they're automated and privileged (they typically need credentials to push to production), they're an increasingly attractive target. Common failures: secrets (API keys, credentials) accidentally committed directly into a repository's history (findable afterward with <code>gitleaks</code> or <code>trufflehog</code>, which scan git history specifically for secret-shaped patterns, even if the secret was later "removed" in a subsequent commit — git history still remembers it); build artifacts that aren't cryptographically signed, allowing tampering to go undetected; and <b>supply-chain attacks</b>, where a compromised or maliciously-published upstream dependency gets pulled automatically into the build.</p>
<h4>The shared responsibility model</h4>
<p>Cloud providers secure the infrastructure (physical hardware, hypervisor, in some cases the managed service's underlying code); the customer secures what they configure on top of it: data, access policies, network rules, and — for IaaS — the guest OS itself. The split moves depending on the service model: IaaS leaves you responsible for almost everything above the hypervisor; a fully managed PaaS/SaaS leaves you responsible mainly for configuration and data. The overwhelming majority of real cloud breaches are customer-side misconfiguration (public storage buckets, over-broad IAM roles), not provider infrastructure failures — which is exactly what chapter 5.6's scanner targets.</p>
<h4>IAM: the principle that matters most</h4>
<p><b>Least privilege</b> means a role or service account gets exactly the permissions it needs and nothing more — not "Admin" because it was faster to set up. A compromised service with <code>s3:*</code> on every bucket turns a single leaked credential into a full data breach; the same compromise with <code>s3:GetObject</code> on one named bucket limits the blast radius to that bucket's contents. Reviewing IAM policies for wildcard actions (<code>"Action": "*"</code>) and wildcard resources (<code>"Resource": "*"</code>) together is one of the highest-value single checks in a cloud security review.</p>
<h4>DevSecOps: shifting checks left</h4>
<p>"Shift left" means running security checks as early in the pipeline as possible, where fixing a finding costs minutes, rather than in production, where it costs an incident. A practical pipeline layers: SAST (static analysis of your own code) on every commit, dependency scanning (<code>npm audit</code>, <code>pip-audit</code>, or Trivy for container images) on every build, IaC scanning (Checkov, tfsec) before any Terraform plan applies, and DAST against a staging environment before release. Each layer catches a different class of bug; none of them alone is sufficient.</p>
`},

{t:"Secure Coding & Threat Modeling", h:`
<h3>5.3 Secure Coding & Threat Modeling</h3>
<p class="lede">For "build it securely" tracks rather than "break it" tracks, this section is effectively the rubric — most build-track hackathon judging criteria map almost directly onto these principles.</p>

<h4>STRIDE threat modeling</h4>
<p><b>STRIDE</b> is a structured checklist for systematically thinking through what can go wrong with a system <i>before</i> it's built, developed at Microsoft and still the most widely taught threat-modeling framework:</p>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Letter</th><th scope="col">Threat</th><th scope="col">Violates</th><th scope="col">Example</th></tr>
<tr><td>S</td><td>Spoofing</td><td>Authentication</td><td>Pretending to be another user or system</td></tr>
<tr><td>T</td><td>Tampering</td><td>Integrity</td><td>Modifying data or code in transit or at rest</td></tr>
<tr><td>R</td><td>Repudiation</td><td>Non-repudiation</td><td>Denying having performed an action, with no logs to disprove it</td></tr>
<tr><td>I</td><td>Information disclosure</td><td>Confidentiality</td><td>Exposing data to someone unauthorized to see it</td></tr>
<tr><td>D</td><td>Denial of service</td><td>Availability</td><td>Making a system unusable for legitimate users</td></tr>
<tr><td>E</td><td>Elevation of privilege</td><td>Authorization</td><td>Gaining capabilities beyond what was granted</td></tr>
</table></div>
<p>Walking through each letter for every major component and data flow in a system you're designing — even briefly — surfaces a remarkable number of the vulnerability classes covered in earlier chapters before a single line of code is written.</p>

<h4>Secure-by-default coding habits</h4>
<ul>
<li>Use parameterized queries/prepared statements for all database access, always, with no exceptions for "this input is probably safe."</li>
<li>Encode output for the exact context it's rendered into, and set a Content Security Policy — don't rely on input filtering alone to stop XSS.</li>
<li>Validate input on the server, every time, regardless of what client-side validation already exists — client-side checks are a UX feature, not a security boundary (2.1).</li>
<li>Apply the principle of least privilege to every service account, database user, and cloud role — each should be able to do only exactly what it needs to, nothing more.</li>
<li>Fail securely: when something goes wrong (an exception, a timeout, an unexpected state), the default behavior should be to deny access, not to silently grant it.</li>
</ul>

<h4>Secrets management</h4>
<p>API keys, database passwords, and signing keys should never be hardcoded into source code — not even "temporarily," since that code is frequently committed to version control before anyone remembers to remove it. The correct pattern is environment variables (at minimum) or a dedicated secrets manager (HashiCorp Vault, AWS Secrets Manager, etc.) for anything beyond a small personal project. This applies directly to a hackathon's own project repository too — judges in many international-level events do check submitted repos for exactly this mistake, and it's an easy, avoidable deduction.</p>

<h4>Dependency hygiene</h4>
<p>Modern applications pull in dozens to thousands of third-party packages, any one of which can carry a known vulnerability (OWASP A06, 2.2) or, in a supply-chain attack, be maliciously compromised at the source. Pin dependency versions rather than always pulling "latest," run automated vulnerability scanners as part of your build (<code>npm audit</code>, <code>pip-audit</code>, GitHub's Dependabot), and be wary of adding a dependency that's unmaintained or has very few other users relying on it.</p>
<h4>STRIDE, applied to a concrete feature</h4>
<p>STRIDE gives six questions to ask about any feature before you build it, each mapping to a security property it threatens:</p>
<table><tr><th scope="col">Letter</th><th scope="col">Threat</th><th scope="col">Property violated</th><th scope="col">Example for a file-upload feature</th></tr>
<tr><td>S</td><td>Spoofing</td><td>Authentication</td><td>Can someone upload as another user?</td></tr>
<tr><td>T</td><td>Tampering</td><td>Integrity</td><td>Can the file be modified in transit or at rest?</td></tr>
<tr><td>R</td><td>Repudiation</td><td>Non-repudiation</td><td>Is there a log proving who uploaded what?</td></tr>
<tr><td>I</td><td>Information disclosure</td><td>Confidentiality</td><td>Can another user read a private upload by guessing its URL?</td></tr>
<tr><td>D</td><td>Denial of service</td><td>Availability</td><td>Can a huge or malformed file crash the service?</td></tr>
<tr><td>E</td><td>Elevation of privilege</td><td>Authorization</td><td>Can an uploaded file (e.g. a crafted config) change server behaviour?</td></tr></table>
<p>Running this table against each major feature, even quickly, catches design-level flaws before a line of code is written — which is far cheaper than finding them in a penetration test afterward.</p>
<h4>Secure coding habits with concrete before/after</h4>
<pre><code># Insecure: trusts client-side size check only
file = request.files['upload']
file.save(f"/uploads/{file.filename}")          # path traversal if filename = "../../etc/passwd"

# Safer
from werkzeug.utils import secure_filename
filename = secure_filename(file.filename)        # strips path components
if file.content_length > MAX_SIZE: abort(413)
if not allowed_extension(filename): abort(400)
file.save(os.path.join(UPLOAD_DIR, filename))     # UPLOAD_DIR is outside the web root ideally</code></pre>
<p>Validate three independent things for any upload: size, type (check actual content/magic bytes, not just the extension, since an extension is trivially renamed), and destination path — each is a separate control and skipping any one reopens the flaw.</p>
`},

{t:"Hackathon & CTF Strategy", h:`
<h3>5.4 Hackathon & CTF Strategy</h3>
<p class="lede">Technical knowledge alone doesn't determine placement — how a team allocates its limited time, divides work, and communicates usually matters just as much, especially in time-boxed events.</p>

<h4>Triage before committing</h4>
<p>At the start of a CTF-style event, skim every available challenge across every category before diving deeply into any single one. Challenges are typically weighted by difficulty (often reflected directly in point value), and grabbing the accessible points spread across several categories early is almost always a better strategy than fully solving one hard challenge while easier points sit untouched elsewhere.</p>

<h4>Divide work by strength, not by challenge</h4>
<p>A team with members strong in web, crypto/pwn, forensics/OSINT, and infrastructure respectively should generally split along those lines rather than everyone working the same challenge simultaneously — parallelism across categories almost always beats serial focus, since most categories require genuinely different skills and tooling.</p>

<h4>Document continuously, not at the end</h4>
<p>Keep a shared running log (a doc, a shared notes file, a private channel) of what's been tried on each challenge and what the result was — this prevents duplicated effort when team members rotate between challenges, makes it trivial to hand a half-solved challenge to a teammate, and turns the final write-up/report (required by many hackathons, especially for build tracks) into an assembly task rather than a from-scratch writing exercise under time pressure at the very end.</p>

<h4>Verify before you doubt yourself</h4>
<p>Always re-check the exact required flag format (e.g. <code>flag{...}</code>, case sensitivity, specific wrapping) before concluding an approach has failed — a large fraction of "this should be the flag but it's not accepted" moments are formatting mismatches, not actually wrong answers, and re-checking costs nothing.</p>

<h4>Time-box difficult problems</h4>
<p>Set an explicit, honest cutoff (e.g. 45 minutes) before stepping away from a stuck challenge, even if you feel close — and genuinely switch to something else rather than just mentally continuing to chew on it. Coming back later with fresh eyes (or a teammate's fresh perspective) very often reveals what was missed, and the time spent stuck provides zero value toward the scoreboard in the meantime.</p>

<h4>For build tracks specifically</h4>
<p>A fully working, cleanly demoable minimum viable product consistently outperforms an ambitious feature list that's half-broken at demo time — judges score what they can actually see run live, not what you describe it was supposed to do. Scope ruthlessly early, and protect time at the end specifically for testing the demo flow itself, not just the underlying code.</p>
<h4>Time-boxing a CTF or security-track hackathon</h4>
<p>Before touching a single challenge, skim every category and read each prompt — spend no more than 15–20 minutes on this reconnaissance pass. Rank by estimated effort-to-points ratio, not raw point value: a 500-point challenge nobody has solved an hour in is often a worse bet than two unsolved 150-point challenges, because point values frequently reflect difficulty poorly, and partial progress on an unsolvable-for-your-team challenge scores nothing. Set a hard time limit per challenge (e.g. 45 minutes) and move on if you hit it — you can always return later with fresh eyes or a hint.</p>
<h4>Working as a team, not five soloists</h4>
<p>Split by category strength from the start rather than everyone attempting the same challenge in parallel. Keep a shared, continuously updated document (even just a single shared note) listing: which challenges are claimed, what's been tried and ruled out, and any partial findings — this single habit prevents the common failure mode of two team members independently rediscovering the same dead end.</p>
<h4>When you're stuck</h4>
<p>A useful, concrete checklist before asking for a hint: re-read the prompt literally, word for word — CTF prompts are usually precise, not vague; check the challenge's point value and category again for a clue you missed; try the simplest possible interpretation before an elaborate one (a "crypto" challenge with a short ciphertext is more likely Caesar than RSA); and check file metadata (<code>file</code>, <code>exiftool</code>, <code>strings</code>) on any provided file before assuming you need custom tooling.</p>
`},

{t:"Tools Cheat Sheet & Practice Platforms", h:`
<h3>5.5 Tools Cheat Sheet & Practice Platforms</h3>
<p class="lede">A consolidated reference of every tool named across this knowledge base, grouped by category, plus where to go to practice each skill deliberately after reading.</p>

<div class="grid3">
<div class="card"><h5>Recon / Network</h5><ul><li>nmap</li><li>Wireshark / tshark</li><li>netcat</li><li>Shodan / Censys</li></ul></div>
<div class="card"><h5>Web</h5><ul><li>Burp Suite / OWASP ZAP</li><li>ffuf / gobuster / dirb</li><li>sqlmap</li><li>Browser DevTools</li></ul></div>
<div class="card"><h5>Crypto</h5><ul><li>CyberChef</li><li>hashcat / John the Ripper</li><li>hashpump</li><li>factordb / yafu</li></ul></div>
<div class="card"><h5>Reverse / Pwn</h5><ul><li>Ghidra / IDA</li><li>gdb + pwndbg/GEF</li><li>pwntools</li><li>checksec</li></ul></div>
<div class="card"><h5>Forensics</h5><ul><li>Autopsy / Sleuth Kit</li><li>Volatility</li><li>binwalk / foremost</li><li>exiftool</li></ul></div>
<div class="card"><h5>Privesc / AD</h5><ul><li>linpeas / winPEAS</li><li>GTFOBins / LOLBAS</li><li>BloodHound</li><li>PowerUp.ps1</li></ul></div>
<div class="card"><h5>Malware</h5><ul><li>VirusTotal</li><li>PEstudio</li><li>Process Monitor</li><li>Wireshark</li></ul></div>
<div class="card"><h5>Cloud / DevSecOps</h5><ul><li>trivy</li><li>gitleaks / trufflehog</li><li>cloud IAM consoles</li></ul></div>
<div class="card"><h5>Blue Team / SOC</h5><ul><li>Splunk / ELK / Wazuh</li><li>Snort / Suricata</li><li>MITRE ATT&CK Navigator</li></ul></div>
</div>

<h4>Practice platforms, roughly by category</h4>
<ul>
<li><b>General CTF, beginner-friendly:</b> picoCTF — specifically designed for students, excellent first stop across every category in this knowledge base.</li>
<li><b>Guided, structured labs:</b> TryHackMe — step-by-step rooms that teach a concept, not just test it.</li>
<li><b>Realistic, self-directed boxes:</b> HackTheBox — closer to real penetration-testing engagements, less hand-holding.</li>
<li><b>Linux fundamentals specifically:</b> OverTheWire's Bandit wargame — the standard starting point for command-line and Linux-permission comfort.</li>
<li><b>Web-specific, very deep:</b> PortSwigger Web Security Academy (free, built by Burp Suite's creators, arguably the single best resource for section 2) and OWASP Juice Shop (a deliberately vulnerable app to practice against hands-on).</li>
<li><b>Pwn-specific, structured progression:</b> pwn.college, and the classic "protostar" exploit-exercises VM.</li>
<li><b>Write-ups:</b> CTFtime.org archives past competitions' challenges alongside community-written solutions — reading write-ups for challenges you didn't solve, immediately after an event while it's fresh, is one of the highest-leverage learning habits in this entire field.</li>
</ul>
<h4>A minimum toolkit, by category</h4>
<table><tr><th scope="col">Category</th><th scope="col">Core tools</th><th scope="col">Use for</th></tr>
<tr><td>Network</td><td>nmap, Wireshark, tcpdump</td><td>Scanning, packet capture and analysis</td></tr>
<tr><td>Web</td><td>Burp Suite, ffuf, sqlmap</td><td>Interception, fuzzing, SQLi automation</td></tr>
<tr><td>Crypto</td><td>CyberChef, Python + <code>pycryptodome</code></td><td>Encoding/decoding, custom cipher scripts</td></tr>
<tr><td>Reversing/Pwn</td><td>Ghidra, gdb + pwndbg, pwntools</td><td>Disassembly, debugging, exploit scripting</td></tr>
<tr><td>Forensics</td><td>Autopsy, Volatility 3, binwalk</td><td>Disk/memory analysis, embedded-file extraction</td></tr>
<tr><td>OSINT</td><td>theHarvester, Maltego, exiftool</td><td>Information gathering, metadata</td></tr></table>
<h4>Practice platforms, matched to goal</h4>
<ul><li><b>picoCTF / OverTheWire</b> — structured, beginner-friendly, good for building fundamentals across categories.</li><li><b>HackTheBox / TryHackMe</b> — realistic full-machine scenarios closer to an actual assessment, good once fundamentals are solid.</li><li><b>pwn.college / Exploit Education</b> — focused, guided progression specifically for binary exploitation, the category where unguided practice wastes the most time.</li><li><b>PortSwigger Web Security Academy</b> — free, structured, and the most directly aligned with real-world web bug classes of any platform on this list.</li></ul>
<p>Pick platforms by category gap, not novelty — ten focused hours on the category your team is weakest in outperforms ten scattered hours across categories you're already comfortable with.</p>
`},
  ]
},

  desc:"Hackathons are scored by humans with a rubric and about five minutes of attention. This chapter decodes the criteria judges actually use, shows what winners of major international events did differently, and turns that into a concrete plan for choosing the idea, building the technical depth judges can see, demoing it, and packaging the submission.",
  subs:[
{t:"How Judges Actually Score", h:`
<h3>6.1 How Judges Actually Score (Rubric Decoding)</h3>
<p class="lede">A hackathon is not a software-quality audit. It is a ranking exercise done by tired experts who see dozens of projects, so the winning move is to know the rubric in advance and make every criterion visible within the first minutes of the demo.</p>

<h4>The criteria show up again and again</h4>
<p>Rubrics differ in wording, but across the events surveyed while writing this chapter the same handful of criteria keep appearing. One large blockchain hackathon listed originality and creativity, technicality and design, business model and feasibility, usability, practicality, and contribution to its ecosystem. A student hackathon's judge guide listed innovation and creativity and technical difficulty. A national tech-award hackathon added integration with other systems and technologies, plus an assessment of the team's potential as secondary criteria. Another event explicitly scored "learning" — did the team stretch itself. A security-community write-up even argued judges should reward originality of form, not just of idea. Always read the actual rubric first; the table below is the typical shape, not a promise.</p>

<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Criterion</th><th scope="col">What the judge is really asking</th><th scope="col">Typical weight*</th><th scope="col">Visible proof to give them</th></tr>
<tr><td>Innovation / originality</td><td>Have I seen this exact thing 20 times today?</td><td>15–25%</td><td>One sentence stating the new angle; a comparison row against the obvious alternative</td></tr>
<tr><td>Technical depth / difficulty</td><td>Did they build something hard, or glue APIs together?</td><td>20–30%</td><td>Architecture diagram, the "one hard thing" explained, metrics against a baseline</td></tr>
<tr><td>Real problem / impact</td><td>Does a real person lose sleep over this?</td><td>15–25%</td><td>A named user, one hard number (cost of breach, hours wasted), a story</td></tr>
<tr><td>Usability / design</td><td>Could I use this without the team standing next to me?</td><td>10–15%</td><td>Clean UI, a 3-click golden path, readable output instead of raw logs</td></tr>
<tr><td>Completeness / working demo</td><td>Does it actually run, live, right now?</td><td>10–20%</td><td>Live demo on pre-seeded data, deployed link, backup video</td></tr>
<tr><td>Business model / feasibility</td><td>Would anyone pay, and can this become more than a weekend project?</td><td>10–20%</td><td>One business slide: buyer, price, market size built bottom-up (see chapter 7)</td></tr>
<tr><td>Security of the product itself</td><td>In a security track: is the thing that claims to protect secure?</td><td>implicit</td><td>Threat model, no secrets in the repo, auth and rate limiting, dependency scan</td></tr>
<tr><td>Ecosystem / sponsor fit</td><td>Did they use our platform meaningfully?</td><td>0–20%</td><td>Deep use of the sponsor's API or product, named explicitly in the pitch</td></tr>
<tr><td>Communication</td><td>Did I understand it in 30 seconds?</td><td>5–15%</td><td>A one-line pitch and a clear story arc</td></tr>
</table></div>
<p class="foot-note">*Weights are illustrative ranges. Many events never publish scoring details — one large hackathon explicitly said its judges scored projects in confidence — so treat any number here as a prior, not a fact.</p>

<h4>How judging is run changes how you optimize</h4>
<ul>
<li><b>Live pitch judging:</b> the demo and delivery carry the score. Rehearse; the Q&amp;A is part of the score.</li>
<li><b>Async judging:</b> a judge might be assigned only two or three projects and review them on their own time, so your README, video, and first screenshot are the product. Make the first screen of the submission page do all the persuading.</li>
<li><b>Multi-round judging:</b> some companies crowdsource a first round from all employees and let an expert panel pick from the top ten. Round one rewards instant clarity for non-experts; round two rewards depth. Optimize for both audiences.</li>
<li><b>Community or quadratic voting:</b> at least one major Ethereum hackathon combined traditional judging with community voting and published all judge scoring sheets afterward. Expect transparency, expect your social proof (a clean demo video people want to share) to matter, and expect your reasoning to be audited later.</li>
<li><b>Popular-choice prizes:</b> several sponsor events have a separate audience prize. It is often easier to win than the grand prize and still counts for your portfolio.</li>
</ul>

<h4>The reverse-engineering routine (do this in the first hour)</h4>
<ol>
<li>Find the rubric on the event page and copy it into your team notes.</li>
<li>Look up the judges: are they CISOs, researchers, VCs, or sponsor engineers? That decides whether to spend your pitch on depth, market, or platform fit.</li>
<li>Read past winners and their write-ups; patterns repeat year to year.</li>
<li>For each criterion, decide the one artifact that will prove it (a slide, a demo moment, a README section) and put it on the task board.</li>
<li>Split effort roughly in proportion to the weights, then add a small bonus for whatever the rubric under-weights but the judges personally care about.</li>
</ol>
<div class="box"><p><b>Rule of thumb:</b> if a criterion cannot be seen in the first five minutes, it effectively does not exist for scoring. Do not rely on judges reading your code to discover how good it is.</p></div>
`},

{t:"Picking a Problem Worth Winning", h:`
<h3>6.2 Picking a Problem Worth Winning</h3>
<p class="lede">The idea is chosen once but graded on almost every criterion — originality, impact, feasibility, and business sense all trace back to it. Spend real time here; teams that skip it end up polishing a project nobody needed.</p>

<h4>Score ideas before you commit</h4>
<p>Rate each candidate idea 1–5 on these seven questions and sum. Anything under about 24/35 is probably not your project.</p>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Question</th><th scope="col">What a 5 looks like</th></tr>
<tr><td>Pain</td><td>Someone is losing money, time, or sleep today</td></tr>
<tr><td>Frequency</td><td>It happens daily or weekly, not once a year</td></tr>
<tr><td>Willingness to pay</td><td>A budget already exists for a workaround (analyst hours, an existing tool)</td></tr>
<tr><td>Feasibility in the time box</td><td>A convincing slice can run in 24–48 hours on public data</td></tr>
<tr><td>Demo-ability</td><td>The before/after is visible in 60 seconds</td></tr>
<tr><td>Differentiation</td><td>You can name the closest alternative and say exactly what is different</td></tr>
<tr><td>Rubric / sponsor fit</td><td>It lands squarely on the track and the judges' background</td></tr>
</table></div>

<h4>Idea patterns that fit cybersecurity hackathons</h4>
<ul>
<li><b>Make security usable for people without a security team:</b> small businesses, clinics, schools, local government. Hackathon events keep rewarding "security that anyone can use."</li>
<li><b>Alert triage and explanation:</b> turn raw logs and alerts into a prioritized, explained, evidence-linked story. Judges in SOC-flavored tracks feel alert fatigue personally.</li>
<li><b>Software supply chain:</b> dependency risk scoring, SBOM generation and diffing, secrets scanning in CI, malicious-package detection.</li>
<li><b>Identity and authentication:</b> MFA/passkey flows, session-hijack detection, risky-login scoring. An enterprise multi-factor-authentication solution has won overall at at least one security hackathon judged by industry security leaders — unglamorous enterprise pain scores well.</li>
<li><b>Fraud and phishing for local contexts:</b> regional-language phishing, payment-fraud signals, deepfake-voice scam detection.</li>
<li><b>AI and LLM security:</b> prompt-injection test harnesses, guardrails, auditing which tools an AI agent can call, output validation. This is a fresh attack surface, which also reads as "why now."</li>
<li><b>Security automation with human approval:</b> detect, propose a fix, and wait for a human click rather than acting blindly.</li>
<li><b>Developer-side tools:</b> patch analysis, vulnerability assessment helpers, email security add-ons — the kind of practical tooling that has placed in industry co-innovation hackathons.</li>
</ul>

<h4>Idea patterns to avoid</h4>
<ul>
<li>Yet another password manager or encrypted chat app — judges have seen dozens and you cannot out-engineer mature products in a weekend.</li>
<li>"An AI chatbot for cybersecurity" with no data, no evidence trail, and no measurement.</li>
<li>A thin wrapper around nmap or a public API with a new coat of paint.</li>
<li>Anything that needs a huge proprietary dataset, hardware you do not have, or access to a live production network.</li>
<li>A project whose demo requires attacking a real third-party system. Use your own lab, a deliberately vulnerable app, or public datasets.</li>
</ul>

<h4>Three questions that sharpen the idea</h4>
<ol>
<li><b>Who is awake at 2 a.m. because of this problem?</b> Name the job title.</li>
<li><b>Could a competitor kill this in a weekend?</b> If yes, the differentiation is too thin.</li>
<li><b>What is the single sentence a judge repeats to a colleague?</b> If you cannot write it, the idea is not sharp yet.</li>
</ol>
<div class="box"><p>A narrow, painful problem solved convincingly beats a broad "platform" described vaguely. Judges reward the project they can picture being used on Monday.</p></div>
`},

{t:"Technical Depth Judges Can See", h:`
<h3>6.3 Technical Depth Judges Can See</h3>
<p class="lede">Technical difficulty is usually the heaviest criterion, but it is only counted if it is visible. The aim is to show one genuinely hard thing done well, supported by boring but reliable glue — not a dozen half-working features.</p>

<h4>Pick one "hard thing"</h4>
<p>Decide the single technical spike that justifies your project: a detection model with measured accuracy, a clever parser, a novel correlation of two data sources, a sandboxed analysis pipeline, an automated proof that a finding is real. Spend the first third of your time making that one thing work end to end on real data. Everything else (UI, auth, storage) can be templated or simple.</p>

<h4>Measure it against a baseline</h4>
<p>Nothing impresses a technical judge like a number with context. For almost any security feature, you can report some of: <b>precision, recall, F1, false-positive rate, time to detect, latency, throughput, cost per scan, coverage</b>. Always compare against a simple baseline (a regex, an existing Snort/Suricata rule, a naive model) so the number means something, and state limits honestly. A modest, honestly measured improvement beats a vague claim of "99% accuracy." Public datasets save hours: network-intrusion corpora such as CIC-IDS2017 and UNSW-NB15, the EMBER malware benchmark, phishing and malicious-URL feeds such as PhishTank and URLhaus, CISA's Known Exploited Vulnerabilities catalog, EPSS exploit-probability scores, the NVD, and MITRE ATT&amp;CK's machine-readable data.</p>

<h4>Hybrid beats pure: AI proposes, a checker disposes</h4>
<p>If you use machine learning or an LLM, wrap it in deterministic verification. The strongest recent example is the final of DARPA's AI Cyber Challenge at DEF CON 33: the winning system combined multiple AI agents with traditional tools such as fuzzing and static analysis, and its team notably stayed conservative — it did not submit patches without a working proof that the vulnerability was real, and even switched off a looser patching path before the finals to avoid accuracy penalties. Translate that to a hackathon: every AI-generated claim should be backed by evidence, a reproducible check, or a human approval step. It also answers the question you will certainly get — "what if the AI hallucinates?"</p>

<h4>Make the product secure (security tracks check this)</h4>
<ul>
<li>Do a 15-minute STRIDE pass (section 5.3) and put the threat model in the README.</li>
<li>No secrets in the repo, ever; run <code>gitleaks</code> before submitting. Judges in international events do check.</li>
<li>Authentication, input validation, and rate limiting on every endpoint; parameterized queries; output encoding.</li>
<li>Run a dependency scan (<code>trivy</code>, <code>pip-audit</code>, <code>npm audit</code>) and a quick SAST pass (<code>semgrep</code>); mention the clean result.</li>
<li>Generate an SBOM; it takes one command and signals supply-chain maturity.</li>
</ul>

<h4>Make it reproducible</h4>
<p>A judge or sponsor engineer should be able to run <code>docker compose up</code> and see the same thing you demoed. Pin versions, include sample data, ship a <code>.env.example</code>, and choose an open-source license. Reproducibility is persuasive evidence that the work is real.</p>

<h4>Show the architecture, not just the screens</h4>
<p>One clear diagram: data in, the hard component, decision/evidence out, human in the loop, where the trust boundaries are. Label the one component that is new. Judges with limited time will use this diagram to decide how deep your work goes.</p>
<div class="box warn"><p><b>Common technical-score killers:</b> a demo that depends on conference Wi-Fi; hard-coded outputs presented as live analysis; "AI" that is just a prompt with no measurement; features listed in slides that are not in the repo. Judges can usually tell, and it costs trust on every other criterion.</p></div>
`},

{t:"Lessons From Winners", h:`
<h3>6.4 Lessons From Winners of Major Events</h3>
<p class="lede">No single formula exists, but across well-documented events a consistent set of behaviors separates winners. The table summarizes what could be verified from public reports; the lessons below it are the pattern, not a guarantee.</p>

<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Event</th><th scope="col">What happened</th><th scope="col">Lesson to copy</th></tr>
<tr><td>DARPA AI Cyber Challenge final (DEF CON 33, Aug 2025)</td><td>Team Atlanta (Georgia Tech, KAIST, Samsung Research, POSTECH) won the $4M first prize with roughly 393 points, over 170 ahead of second-place Trail of Bits. Seven finalist teams ran autonomous systems against dozens of real software projects over many hours.</td><td>Read the scoring function and optimize for it; accuracy over volume; combine AI with classic tools; be modular enough to improve and later open-source (the team is open-sourcing parts of it as OSS-CRS).</td></tr>
<tr><td>RSAC Innovation Sandbox</td><td>Ten early-stage security startups pitch to a judge panel; a recent winner was HiddenLayer (machine-learning model security) with Pangea second.</td><td>A clear new category tied to a new attack surface (AI/ML) plus a crisp pitch wins attention.</td></tr>
<tr><td>Nullcon Startville</td><td>Ten security product companies each present for five minutes including a demo.</td><td>Five minutes is the real unit of competition; design the story and demo to that budget.</td></tr>
<tr><td>Microsoft Sentinel hackathon on Devpost</td><td>Cash prizes with a first prize of $10,000 and a separate popular-choice prize; entrants had to build end-to-end solutions delivering enterprise value on the sponsor's platform.</td><td>Go deep on the sponsor's product and frame outcomes as enterprise value; consider the audience prize.</td></tr>
<tr><td>Cisco Singapore co-innovation hackathon</td><td>Winning and finalist projects were practical tools — git patch analysis, vulnerability assessment tooling, email security — judged by a panel mixing security sales leaders and academia.</td><td>Practical tooling plus a business-aware pitch; panels with sales people ask "who buys this?"</td></tr>
<tr><td>A security hackathon reported by TheCable (Nigeria)</td><td>The overall winner built multi-factor authentication for a large enterprise; a senior security-operations leader from a major tech company judged.</td><td>Boring-but-needed enterprise problems can beat flashy ideas.</td></tr>
<tr><td>HackerOne H1-702 and H1-202 CTFs</td><td>Winners were chosen from hundreds of registrants and only a small fraction submitted complete entries; creativity was an explicit criterion and winning write-ups were published.</td><td>Finish and submit — completeness alone puts you in a small pool; write-up quality is part of the score.</td></tr>
<tr><td>Rubrik and EthBerlin style events</td><td>Crowd-sourced first-round judging or community quadratic voting combined with expert panels.</td><td>Non-experts decide early rounds; clarity and shareability matter before depth does.</td></tr>
</table></div>

<h4>Patterns across winners</h4>
<ol>
<li><b>They finished.</b> At the CTF events above, only a small share of registrants submitted something complete. A working, submitted project already beats most of the field.</li>
<li><b>They optimized for the scoring rules, not for abstract quality.</b> The AI Cyber Challenge winner treated accuracy penalties as a design constraint.</li>
<li><b>They combined new and proven methods.</b> LLM agents plus fuzzing and static analysis, not LLM alone.</li>
<li><b>They addressed a concrete, current problem</b> — a new attack surface (AI), supply chain, enterprise identity, alert fatigue.</li>
<li><b>They told a story about a user, not a feature list.</b> Practitioner advice for pitch events is consistent: have one clear key message, let the founder or lead speak, and avoid a canned demo.</li>
<li><b>They turned the win into something longer-lived.</b> Open-source releases, jobs, internships, incubation offers. Many hackathons advertise internships or mentoring as prizes; treat them as the real prize.</li>
</ol>
<div class="box"><p><b>Honest caveat:</b> detailed scoring sheets are rarely public, so these lessons are inferred from announcements, rubrics, and winner write-ups. Treat them as strong heuristics and keep reading the specific rubric of your event.</p></div>

<h4>Evidence base used for this chapter</h4>
<ul>
<li><a href="https://www.infosecurity-magazine.com/news/defcon-ai-cyber-challenge-winners/">Infosecurity Magazine — AIxCC winners at DEF CON</a></li>

{t:"Demo, Pitch & Submission Package", h:`
<h3>6.5 Demo, Pitch &amp; Submission Package</h3>
<p class="lede">Judges evaluate what they see. A polished demo of one feature beats a broken demo of five, and a submission page that explains itself in ten seconds beats a better project that makes the judge dig.</p>

<h4>The five-minute pitch structure</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Time</th><th scope="col">Beat</th><th scope="col">What to do</th></tr>
<tr><td>0:00–0:30</td><td>Hook</td><td>A real person and a moment of pain. One sentence, no jargon.</td></tr>
<tr><td>0:30–1:00</td><td>Problem and stakes</td><td>One credible number (cost, time, prevalence). Say who the user is.</td></tr>
<tr><td>1:00–3:00</td><td>Live demo — the golden path</td><td>Attack or problem, detection, evidence, fix. One uninterrupted flow on pre-seeded data.</td></tr>
<tr><td>3:00–3:45</td><td>How it works</td><td>The architecture diagram; name the hard thing and the measured result.</td></tr>
<tr><td>3:45–4:30</td><td>Business and impact</td><td>Buyer, price, bottom-up market, why you win (chapter 7).</td></tr>
<tr><td>4:30–5:00</td><td>Close</td><td>What is next, what you need, then repeat the one-sentence pitch.</td></tr>
</table></div>

<h4>Demo rules that win</h4>
<ul>
<li><b>Build the demo first, features second.</b> Define the golden path on day one and build exactly that.</li>
<li><b>Demo live, but have a recorded backup.</b> A live run is far more convincing than screenshots; a backup video saves you when the network dies.</li>
<li><b>Make it deterministic.</b> Pre-seed data, run locally or from a stable deployed link, avoid depending on conference Wi-Fi or a rate-limited API.</li>
<li><b>Show attack, then defense.</b> In security demos the contrast is the story: "here is the breach, here is us catching it, here is the evidence."</li>
<li><b>Show, then label.</b> Point at the one component you built, in the architecture diagram, while it runs.</li>
<li><b>Assign roles.</b> One speaker, one driver of the demo, one person ready for Q&amp;A on each of tech and business. Make eye contact with the judges, not the screen.</li>
<li><b>Rehearse three times with a timer</b>, and once with a friend who has not seen the project.</li>
</ul>

<h4>Submission package checklist</h4>
<ol>
<li><b>README</b>: demo GIF or screenshot at the top, one-line pitch, problem, architecture diagram, quick start, threat model, limitations, roadmap, team.</li>
<li><b>2–3 minute demo video</b> with captions; judges often watch it before anything else.</li>
<li><b>Slide deck</b>: 8–10 slides, one idea per slide.</li>
<li><b>Clean repository</b>: no secrets, meaningful commits, a license, instructions that actually work from a fresh clone.</li>
<li><b>Deployed link</b> or a one-command local run.</li>
<li><b>Submission text</b> that mirrors the rubric language so each judge can find the criterion they are scoring.</li>
<li><b>Credits</b>: list datasets, libraries, and any AI assistance honestly.</li>
</ol>

<h4>Q&amp;A bank — prepare an answer to each</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Likely question</th><th scope="col">Answer outline</th></tr>
<tr><td>How is this different from existing tools?</td><td>Name the closest two, state one decisive difference, show the comparison row.</td></tr>
<tr><td>Why would anyone pay for this?</td><td>Name the buyer and the budget it replaces; give a price and the saved cost.</td></tr>
<tr><td>How do you handle false positives?</td><td>Give the measured rate, the threshold choice, and the human-review step.</td></tr>
<tr><td>What if the AI is wrong or hallucinates?</td><td>Evidence links, deterministic verification, human approval before action.</td></tr>
<tr><td>Is the product itself secure?</td><td>Threat model, scans, no secrets, least privilege, what is out of scope.</td></tr>
<tr><td>What data do you use and what about privacy?</td><td>Sources, retention, minimization, local processing options.</td></tr>
<tr><td>How does it scale?</td><td>Where the bottleneck is, what you would change first, rough numbers.</td></tr>
<tr><td>What is your moat?</td><td>Data, integrations, workflow lock-in, or speed; be honest about which is real today.</td></tr>
<tr><td>What would you build in the next three months?</td><td>Three concrete milestones tied to a first pilot customer.</td></tr>
<tr><td>What is the biggest risk?</td><td>Name it candidly and say how you would test it first.</td></tr>
</table></div>
`},

{t:"Team, Timeline & Execution", h:`
<h3>6.6 Team, Timeline &amp; Execution Plan</h3>
<p class="lede">Most teams do not lose on skill; they lose on scope, coordination, and a last-hour scramble. A written plan with a feature freeze is the cheapest competitive advantage available.</p>

<h4>Roles for a four-person team</h4>
<ul>
<li><b>Lead / product and pitch:</b> owns the idea, rubric mapping, the story, the deck, and the final Q&amp;A.</li>
<li><b>Core security engineer:</b> builds the hard thing and the measurements.</li>
<li><b>Frontend / UX:</b> builds the golden-path interface, readable outputs, and the demo video visuals.</li>
<li><b>Integration / DevOps:</b> owns the repo, containers, deployment, data seeding, secrets hygiene, and the backup demo.</li>
</ul>
<p>With fewer people, the lead and frontend roles merge. Everyone writes down what they tried, what failed, and what worked in a shared log so work can be handed off.</p>

<h4>Sample timeline (24-hour event)</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Hours</th><th scope="col">Goal</th><th scope="col">Output</th></tr>
<tr><td>0–1</td><td>Rubric, judges, track, constraints</td><td>Criterion-to-artifact list</td></tr>
<tr><td>1–3</td><td>Problem choice, MVP definition, sketches</td><td>One-sentence pitch; golden-path storyboard</td></tr>
<tr><td>3–12</td><td>Build the hard thing and the golden path end to end</td><td>Ugly but complete flow on real data</td></tr>
<tr><td>12–17</td><td>Measure, secure, integrate sponsor tech</td><td>Metrics table, threat model, scans</td></tr>
<tr><td>17–20</td><td>Polish UI and error handling; record backup demo</td><td>Backup video; deployed link</td></tr>
<tr><td>20 (feature freeze)</td><td>No new features after this point</td><td>Tagged release</td></tr>
<tr><td>20–23</td><td>README, deck, business slide, rehearse</td><td>Complete submission package</td></tr>
<tr><td>23–24</td><td>Submit early, test links, rest</td><td>Confirmation screenshot</td></tr>
</table></div>
<p>For a 36–48 hour event, stretch the middle blocks and keep the same freeze-then-package structure; protect at least four hours at the end and real sleep for everyone.</p>

<h4>Execution habits</h4>
<ul>
<li><b>Prepare before the event, within the rules.</b> Create accounts and API keys, test your boilerplate, agree on a stack, and set up repo templates. Do not pre-build the project; many events disqualify pre-written code, so read the rules.</li>
<li><b>Choose a stack your team already knows.</b> A hackathon is a poor time to learn a framework.</li>
<li><b>Use sensible commit hygiene:</b> short-lived branches, daily tags, and a stable "demo" branch that only receives tested changes.</li>
<li><b>Time-box and re-scope.</b> If a feature is not working at the halfway mark, cut it. Stuck for 45 minutes means switch tasks or ask a teammate.</li>
<li><b>Submit early.</b> Platforms slow down and fail near deadlines; a complete early submission can be edited later.</li>
<li><b>Sleep.</b> A rested team demos better and catches the broken link before the judge does.</li>
</ul>
`},

{t:"Optimization Checklist & Integrity", h:`
<h3>6.7 Rubric-Optimization Checklist &amp; Integrity</h3>
<p class="lede">Optimizing for the rubric is smart; faking it is fatal. The best strategy makes real work legible, and stays inside the rules.</p>

<h4>Pre-submission checklist</h4>
<ol>
<li>Every rubric criterion has a named, visible artifact (slide, demo moment, README section).</li>
<li>The one-sentence pitch is in the README, the video, the first slide, and the submission title.</li>
<li>The golden path runs from a fresh browser in under two minutes.</li>
<li>There is a measured result with a baseline and an honest limitations section.</li>
<li>The threat model, scan results, and secret-scan result are in the repository.</li>
<li>The business slide has buyer, price, and bottom-up market numbers.</li>
<li>The sponsor's technology is used meaningfully and mentioned by name, if the event has a sponsor track.</li>
<li>The demo video, deployed link, repo, and deck all open in an incognito window.</li>
<li>The team has rehearsed the Q&amp;A bank answers aloud.</li>
</ol>

<h4>Common failure modes</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Failure</th><th scope="col">Why it loses points</th><th scope="col">Fix</th></tr>
<tr><td>Too many features</td><td>Nothing works end to end</td><td>One golden path, feature freeze</td></tr>
<tr><td>No business story</td><td>Loses feasibility and impact points</td><td>One slide and a rehearsed 60-second answer</td></tr>
<tr><td>Demo depends on the network</td><td>Live failure under pressure</td><td>Local or pre-seeded demo plus backup video</td></tr>
<tr><td>Unmeasured AI claims</td><td>Technical judges discount it</td><td>Baseline, metrics, evidence links</td></tr>
<tr><td>Insecure security project</td><td>Credibility collapses</td><td>Threat model, scans, no secrets</td></tr>
<tr><td>Late submission mistakes</td><td>Broken links, missing files</td><td>Submit early and verify</td></tr>
</table></div>

<h4>Integrity red lines</h4>
<ul>
<li><b>Never present a mocked result as a live one.</b> If part of the demo is simulated, say so. Judges forgive simplification; they do not forgive deception.</li>
<li><b>Follow the build rules.</b> Pre-existing code, team size, and AI-assistance rules differ by event. Some organizers explicitly check winning teams for cheating before announcing results.</li>
<li><b>Credit your sources:</b> datasets, libraries, models, and any code you adapted. Respect licenses.</li>
<li><b>Stay within scope and the law when testing.</b> Use your own lab, intentionally vulnerable targets, or public datasets; never test against systems you do not own or have written permission to test.</li>
<li><b>Handle dual-use responsibly.</b> Offensive tooling should be framed for defense, kept minimal, and not released in a weaponized form.</li>
</ul>
`},
  ]
},

  subs:[
{t:"How the Security Market Works", h:`
<h3>7.1 How the Security Market Works</h3>
<p class="lede">Before designing a product, understand the economic system it will live in: who has the problem, who holds the budget, who competes with you, and why buyers behave the way they do. Security has quirks that differ from other software markets.</p>

<h4>The core buying psychology</h4>
<p>Security is bought on fear, justified on return on investment, and renewed on proof. Buyers are protecting against events that may never happen, so they need evidence that you reduce risk, satisfy auditors, or save analyst time. That is why compliance, breach headlines, and insurance requirements drive so much spending, and why "show me it worked" metrics matter in every renewal.</p>

<h4>The major segments</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Segment</th><th scope="col">What it covers</th><th scope="col">Typical buyer</th></tr>
<tr><td>Endpoint</td><td>Antivirus, EDR/XDR on laptops and servers</td><td>IT / security operations</td></tr>
<tr><td>Identity</td><td>SSO, MFA, privileged access, passkeys</td><td>IT / CISO</td></tr>
<tr><td>Network</td><td>Firewalls, zero-trust access, secure web gateways</td><td>Network / infrastructure</td></tr>
<tr><td>Cloud</td><td>Posture management, workload and container protection</td><td>Cloud / platform teams, CISO</td></tr>
<tr><td>Application security</td><td>SAST, DAST, SCA, API security, supply chain</td><td>Engineering leaders, DevSecOps</td></tr>
<tr><td>Data security and privacy</td><td>DLP, encryption, key management, privacy tooling</td><td>CISO, DPO, compliance</td></tr>
<tr><td>Security operations</td><td>SIEM, SOAR, managed detection and response</td><td>SOC manager, CISO</td></tr>
<tr><td>Email and awareness</td><td>Phishing defense, training, simulations</td><td>IT, HR, CISO</td></tr>
<tr><td>Governance, risk, compliance</td><td>Audit automation, risk registers, vendor risk</td><td>Compliance, legal, CISO</td></tr>
<tr><td>AI and emerging</td><td>LLM security, deepfake and fraud detection, OT/IoT</td><td>CISO, product and AI teams</td></tr>
</table></div>

<h4>Structural forces</h4>
<ul>
<li><b>Tool sprawl and consolidation:</b> enterprises own dozens of tools and want fewer vendors, so large platform vendors bundle features. Startups must either integrate well or be clearly best at a specific job.</li>
<li><b>Talent shortage:</b> there are not enough skilled defenders, so anything that automates triage, reporting, or remediation has a natural value proposition, as does outsourcing to managed providers.</li>
<li><b>Regulation:</b> new data-protection and incident-reporting rules create mandatory demand for compliance tooling.</li>
<li><b>Attack-surface shifts:</b> cloud, SaaS, supply chain, remote work, and AI each opened a new product category within a few years. Spotting the next shift is where startups find room.</li>
<li><b>Acquisitive incumbents:</b> large vendors frequently buy successful startups, making acquisition a common outcome.</li>
</ul>
<p>Market-size and growth figures change quickly; use current analyst reports and public filings when you need numbers rather than memorizing any figure from this book.</p>
<div class="box"><p><b>Key idea:</b> a product wins by owning a narrow, painful job for a defined buyer first (the wedge), then expanding. Starting as a platform is how startups disappear.</p></div>
`},

{t:"Customers, Positioning & Discovery", h:`
<h3>7.2 Customers, Positioning &amp; Discovery</h3>
<p class="lede">Most failed products solved a problem that was real for someone but not painful enough, frequent enough, or funded enough. Customer discovery is the discipline of finding that out cheaply, before building.</p>

<h4>Define the ideal customer profile (ICP)</h4>
<p>Write down: industry, company size, tech stack, who feels the pain, who signs the purchase, and the trigger event that makes them look for a solution (an audit, a breach, a customer questionnaire, a new regulation). A good ICP is narrow enough that you could list fifty real companies that fit it.</p>

<h4>Know the personas</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Persona</th><th scope="col">Cares about</th><th scope="col">Fears</th><th scope="col">Speak to them with</th></tr>
<tr><td>CISO / security head</td><td>Risk reduction, board reporting, budget defense</td><td>A breach on their watch; tool sprawl</td><td>Outcomes, evidence, integration, compliance mapping</td></tr>
<tr><td>SOC analyst</td><td>Fewer false alerts, faster investigation</td><td>Alert fatigue, another dashboard</td><td>Time saved per alert, workflow fit</td></tr>
<tr><td>DevSecOps / engineer</td><td>No friction in the pipeline, accurate findings</td><td>Noisy tools that slow releases</td><td>CLI/API, low false positives, CI integration</td></tr>
<tr><td>IT admin at a small business</td><td>Simple setup, low cost</td><td>Complexity, no one to maintain it</td><td>Five-minute setup, clear plain-language outputs</td></tr>
<tr><td>Compliance officer</td><td>Passing audits, documentation</td><td>Findings, fines</td><td>Control mapping, automated evidence</td></tr>
<tr><td>Procurement / finance</td><td>Price, contract risk, vendor stability</td><td>Overspending, lock-in</td><td>Clear pricing, references, security questionnaire answers</td></tr>
</table></div>
<p>Note that the user, the buyer, and the budget holder are often different people, and a product can win with one and die with another.</p>

<h4>Customer discovery interviews</h4>
<p>Talk to at least ten real people in your ICP before investing heavily. Ask about their past behavior, not their opinion of your idea:</p>
<ul>
<li>"Tell me about the last time this problem happened. What did you do?"</li>
<li>"How much time or money did it cost?"</li>
<li>"What tools or workarounds do you use today, and what do they cost?"</li>
<li>"What have you tried that did not work?"</li>
<li>"Who else had to be involved to solve it or approve a purchase?"</li>
<li>"If this disappeared tomorrow, what would change?"</li>
</ul>
<p>Treat compliments as noise. Strong signals are specific stories, existing spend, a request to be told when it is ready, or an offer to pilot. Weak signals are "sounds interesting" and "someone should build that."</p>

<h4>Positioning statement</h4>
<pre><code>For [ideal customer] who [has this painful problem],
[product] is a [category] that [key benefit].
Unlike [main alternative], we [decisive difference] because [reason to believe].</code></pre>
<p>Use it as the spine of your pitch, website, and README. If the "unlike" line is hard to write, the differentiation is not clear yet.</p>

<h4>Jobs to be done</h4>
<p>Customers hire a product to make progress in a specific situation: "when a suspicious alert fires at 3 a.m., I want to know in one minute if it is real, so that I can go back to sleep without risking a breach." Jobs are more stable than features and tell you what you are really competing with — often a spreadsheet, a script, or doing nothing.</p>
`},

{t:"Business Models, Pricing & Unit Economics", h:`
<h3>7.3 Business Models, Pricing &amp; Unit Economics</h3>
<p class="lede">A product is a business only if the revenue per customer, over time, comfortably exceeds the cost of finding, serving, and keeping that customer. These formulas are universal across technology businesses, and judges in business-aware panels notice if you know them.</p>

<h4>Common models</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Model</th><th scope="col">How it makes money</th><th scope="col">Fits</th><th scope="col">Watch out for</th></tr>
<tr><td>Subscription (per seat, asset, or endpoint)</td><td>Recurring fee scaled to a unit the customer understands</td><td>Most SaaS security tools</td><td>Pricing unit that discourages deployment</td></tr>
<tr><td>Usage-based</td><td>Pay per event, scan, GB, or API call</td><td>Data pipelines, scanners, AI features</td><td>Unpredictable bills worry buyers</td></tr>
<tr><td>Open core</td><td>Free open-source core, paid enterprise features and support</td><td>Developer and infrastructure tools</td><td>Community fragmentation, cloud providers hosting your core</td></tr>
<tr><td>Freemium / product-led</td><td>Free tier converts to paid</td><td>Developer-facing and SMB tools</td><td>High support cost with low conversion</td></tr>
<tr><td>Managed service (MSSP / MDR)</td><td>Fee for operating security on behalf of the customer</td><td>Customers without security staff</td><td>Margin pressure, hard to scale people</td></tr>
<tr><td>Marketplace / channel</td><td>Sold through partners or cloud marketplaces</td><td>Enterprise reach</td><td>Partner margin and loss of customer relationship</td></tr>
<tr><td>Licensing / OEM</td><td>Fee for embedding your technology in others' products</td><td>Deep technology, data feeds</td><td>Dependence on a few partners</td></tr>
<tr><td>Services and certification</td><td>Pentests, audits, training</td><td>Early cash flow</td><td>Does not scale like software</td></tr>
</table></div>

<h4>Pricing approaches</h4>
<ul>
<li><b>Cost-plus:</b> your costs plus a margin. Simple, but ignores what the customer values.</li>
<li><b>Competitor-based:</b> anchored to alternatives. Safe, but erodes differentiation.</li>
<li><b>Value-based:</b> a fraction of the value created, such as analyst hours saved or breach cost avoided. Usually best for security if you can quantify the benefit.</li>
</ul>
<p>Offer three tiers where the middle one is what you actually want most customers to choose, and charge by a unit that grows with the customer's value (assets protected, users, scans) rather than one that punishes adoption.</p>

<h4>The formulas</h4>
<pre><code>MRR = sum of monthly recurring revenue          ARR = MRR x 12
ARPA = MRR / number of paying accounts
Gross margin = (revenue - cost of goods sold) / revenue
CAC = (sales + marketing spend) / new customers won
Monthly churn = customers lost in month / customers at start
LTV = ARPA x gross margin / monthly churn
CAC payback (months) = CAC / (ARPA x gross margin)
Net revenue retention (NRR) = (start MRR + expansion - churn - contraction) / start MRR
Burn multiple = net burn / net new ARR
Rule of 40 = revenue growth % + profit margin %</code></pre>

<h4>Worked example</h4>
<p>Suppose you charge a small business $200 per month, gross margin is 80%, monthly churn is 2%, and each customer costs $2,000 to acquire.</p>
<pre><code>Gross profit per customer per month = 200 x 0.80 = 160
LTV = 160 / 0.02 = 8,000
LTV : CAC = 8,000 / 2,000 = 4 : 1
CAC payback = 2,000 / 160 = 12.5 months</code></pre>
<p>Common rules of thumb: an LTV:CAC of about 3:1 or better, payback within 12–18 months for small customers, gross margin in the 70–80% range for software, and net revenue retention above 100%. These are guidelines, not laws — they vary by segment and stage — but being able to say "here are our assumptions and here is what would have to be true" is a mark of credibility.</p>

<h4>Costs unique to modern security products</h4>
<p>Cloud hosting, data storage and egress, third-party threat-intelligence feeds, LLM or inference costs per scan, compliance audits, and support. Include them in cost of goods sold; AI-heavy products especially can have thin margins if each query is expensive.</p>
`},

{t:"Go-To-Market & Distribution", h:`
<h3>7.4 Go-To-Market &amp; Distribution</h3>
<p class="lede">Great technology without distribution loses to average technology with distribution. Go-to-market (GTM) is the plan for reaching the right buyers, convincing them, and getting paid repeatedly.</p>

<h4>Three main motions</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Motion</th><th scope="col">How it works</th><th scope="col">Best when</th><th scope="col">Typical deal</th></tr>
<tr><td>Product-led (PLG)</td><td>Users try the product themselves; paid plans follow usage</td><td>Developer tools, SMB, easy install</td><td>Small, many, fast</td></tr>
<tr><td>Sales-led (SLG)</td><td>Sales team runs demos, pilots, negotiation</td><td>Complex or high-risk enterprise products</td><td>Large, few, slow</td></tr>
<tr><td>Channel / partner</td><td>Resellers, MSSPs, system integrators, marketplaces sell for you</td><td>You lack your own reach or serve many small customers</td><td>Medium, partner takes margin</td></tr>
</table></div>
<p>Sales cycles roughly lengthen with deal size: days to weeks for small businesses, a couple of months for mid-sized companies, and six to twelve months or more for large enterprises and governments. Plan your cash and milestones around the cycle you will actually face.</p>

<h4>Security-specific distribution tactics</h4>
<ul>
<li><b>Research as marketing:</b> responsibly disclosed vulnerabilities, threat reports, and open datasets build credibility that advertising cannot buy.</li>
<li><b>Open source and community:</b> a useful free tool creates users, contributors, and a pipeline of enterprise leads. Conference talks and CTF sponsorships reach practitioners directly.</li>
<li><b>Integrations as distribution:</b> being a first-class app on big platforms (SIEMs, cloud marketplaces, identity providers, ticketing tools) puts you where buyers already work and where sponsor-platform hackathons are aiming.</li>
<li><b>Managed service providers:</b> MSPs and MSSPs serve many small customers; one partnership can equal hundreds of direct sales.</li>
<li><b>Design partners:</b> three to five friendly customers who co-build the product in exchange for early access and influence. They provide references, feedback, and your first case studies.</li>
</ul>

<h4>The pilot (proof of concept)</h4>
<p>Enterprise security products usually must pass a trial. Run it like a mini-project: agree success criteria in writing before it starts (for example, detect 90% of seeded test cases with fewer than five false alerts a day), set a fixed duration of two to six weeks, name a champion and an economic buyer, and agree what happens if you meet the criteria. A pilot without success criteria becomes a free, endless trial.</p>

<h4>Funnel thinking</h4>
<pre><code>Visitors -> Leads -> Qualified leads -> Pilots -> Customers -> Expansion
Work backwards: to win 10 customers at a 25% pilot-to-paid rate you need 40 pilots;
at a 20% qualified-lead-to-pilot rate that is 200 qualified leads.</code></pre>

<h4>Earning buyer trust</h4>
<p>Prepare a security whitepaper, an architecture and data-flow description, completed security questionnaires, an independent penetration-test summary, a public vulnerability disclosure policy, and eventually audit reports (see section 7.5). Buyers will review your security before they review your features.</p>
`},

{t:"Trust, Compliance & Legal", h:`
<h3>7.5 Trust, Compliance &amp; Legal</h3>
<p class="lede">A security vendor holds privileged access to a customer's most sensitive systems, so trust is part of the product. Compliance frameworks are how buyers verify trust at scale, and regulation is also a source of demand. This section is educational, not legal advice; confirm specifics with qualified counsel.</p>

<h4>Frameworks and laws you will hear about</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Item</th><th scope="col">What it is</th><th scope="col">Why it matters to you</th></tr>
<tr><td>SOC 2 (Type I / Type II)</td><td>Audit report on security and related controls of a service provider</td><td>Common requirement for selling to businesses, especially in North America</td></tr>
<tr><td>ISO/IEC 27001</td><td>International standard for an information-security management system</td><td>Widely recognized globally, including by Indian and European buyers</td></tr>
<tr><td>PCI DSS</td><td>Rules for handling payment-card data</td><td>Needed if you touch card data or sell to merchants</td></tr>
<tr><td>HIPAA</td><td>US rules for health information</td><td>Needed for healthcare customers in the US</td></tr>
<tr><td>GDPR</td><td>European data-protection regulation</td><td>Applies if you handle personal data of people in the EU</td></tr>
<tr><td>India's DPDP Act, 2023</td><td>India's personal-data protection law</td><td>Shapes data handling, consent, and breach duties for products serving India</td></tr>
<tr><td>CERT-In directions (2022)</td><td>Indian government rules including time-bound incident reporting</td><td>Customers in India may expect your tooling to help meet reporting obligations</td></tr>
<tr><td>IT Act, 2000</td><td>India's core cyber law including unauthorized-access offenses</td><td>Defines the legal line for testing and research; always get written permission</td></tr>
<tr><td>NIST Cybersecurity Framework and CIS Controls</td><td>Voluntary security frameworks organized by function or control</td><td>A common language; map your features to them in your marketing</td></tr>
<tr><td>Sector rules (e.g. banking and securities regulators)</td><td>Finance and other regulators issue their own cyber-resilience requirements</td><td>Sets mandatory demand in regulated verticals</td></tr>
</table></div>

<h4>Contracts and liability</h4>
<ul>
<li><b>Service-level agreements (SLAs):</b> promised uptime and response times; missing them costs money.</li>
<li><b>Data processing agreements:</b> define what you do with customer data, where it lives, and how breaches are handled.</li>
<li><b>Liability caps and indemnities:</b> negotiated limits on what you owe if something goes wrong; security vendors face particularly sharp questions here.</li>
<li><b>Intellectual property:</b> who owns code, models, and data created during pilots; avoid accidentally giving away your core IP.</li>
<li><b>Open-source licenses:</b> permissive licenses (MIT, Apache 2.0) are easy to build on; copyleft licenses (GPL, AGPL) can force you to open your own code in certain uses. Check every dependency.</li>
</ul>

<h4>Operating a security product responsibly</h4>
<ul>
<li><b>Secure your own house:</b> a vendor compromise becomes a customer compromise. Apply everything in chapter 5, publish a vulnerability disclosure policy, and sign and verify your builds.</li>
<li><b>Data minimization:</b> collect only what the product needs, keep it only as long as needed, and support deletion and regional data residency.</li>
<li><b>Responsible disclosure:</b> follow coordinated disclosure norms for any flaws you find in others' products and give researchers a safe, documented path to report flaws in yours.</li>
<li><b>Dual use:</b> offensive features such as exploit generators and scanners help defenders and attackers alike. Decide deliberately who you sell to and what you build in.</li>
<li><b>Insurance:</b> cyber-liability and errors-and-omissions cover are often required by enterprise customers.</li>
<li><b>AI-specific risks:</b> training and prompt data may include customer secrets; decide whether you retain it, whether it leaves the customer's environment, and how you test for prompt injection.</li>
</ul>
<div class="box"><p><b>For a hackathon:</b> you will not have audits, but you can show you understand them: name the two or three regulations your buyer cares about, say which control your feature supports, and state your data-handling stance in one line.</p></div>
`},

{t:"Strategy, Competition & Moats", h:`
<h3>7.6 Strategy, Competition &amp; Moats</h3>
<p class="lede">Strategy is deciding what not to do and why you can win. Technology products face fast imitation, so the question is always: what makes this hard to copy or replace?</p>

<h4>Porter's five forces applied to a security startup</h4>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Force</th><th scope="col">Typical situation in security</th><th scope="col">Implication</th></tr>
<tr><td>Rivalry among competitors</td><td>High: many vendors per category and large platforms bundling features</td><td>Win a narrow niche first; differentiate on accuracy, integration, or ease</td></tr>
<tr><td>Threat of new entrants</td><td>Moderate: low barrier to build software, high barrier to earn trust</td><td>Trust, references, and compliance are your barriers</td></tr>
<tr><td>Supplier power</td><td>Cloud, LLM, and data-feed providers can change terms or compete</td><td>Avoid single-vendor dependency; own proprietary data or workflow</td></tr>
<tr><td>Buyer power</td><td>High: buyers compare vendors and demand pilots</td><td>Prove value quickly; make switching costly through integration</td></tr>
<tr><td>Threat of substitutes</td><td>Services, in-house scripts, bundled platform features, doing nothing</td><td>Understand the real alternative; price against it</td></tr>
</table></div>

<h4>Sources of defensibility (moats)</h4>
<ul>
<li><b>Data and network effects:</b> every customer makes detection better (shared threat intelligence, labeled incidents).</li>
<li><b>Workflow and integration lock-in:</b> embedded in a customer's daily process and connected to many systems.</li>
<li><b>Switching costs:</b> migrations, retraining, lost history.</li>
<li><b>Brand and trust:</b> hard to build, especially after a vendor breach elsewhere in the industry.</li>
<li><b>Distribution:</b> exclusive or deep channel relationships.</li>
<li><b>Speed and focus:</b> not permanent, but real for a small team in a niche large vendors ignore.</li>
<li><b>Technical depth:</b> research capability that is hard to hire for.</li>
</ul>
<p>Be honest in a pitch about which moat exists today and which you intend to build. Claiming a network effect with zero customers is not credible.</p>

<h4>Competitive analysis</h4>
<p>Build a simple matrix of three to five competitors against five to eight attributes the buyer cares about (target customer, setup effort, price, detection quality, integrations, deployment model, openness). Include the non-obvious competitors — the free tool, the consultant, the spreadsheet — and leave honest gaps where a competitor is stronger.</p>

<h4>Strategic questions to answer</h4>
<ul>
<li><b>Why now?</b> A regulatory deadline, a new attack surface, a new enabling technology, or a platform shift. Without a "why now," incumbents have likely already solved it.</li>
<li><b>Feature or company?</b> Will a large platform ship this as a checkbox next year? If so, plan to be the best in a segment or expand beyond the feature.</li>
